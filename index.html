<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>擴容｜職場裡的溫柔革命</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --color-bg: #F5F2EC;
  --color-text: #2C2C2C;
  --color-brown: #4A3C31;
  --color-muted: #8A7E72;
  --color-border: rgba(74,60,49,0.12);
  --color-hero-bg: #E8E4DC;
  --color-card-hover: rgba(74,60,49,0.04);
  --color-modal-overlay: rgba(44,44,44,0.5);
  --color-nav-bg: rgba(245,242,236,0.92);
  --color-tag-bg: rgba(74,60,49,0.06);
  --color-btn-active-text: #ffffff;
  --font-serif: 'Noto Serif TC', 'Songti SC', serif;
  --font-sans: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-mono: 'Fragment Mono', 'Courier New', monospace;
  --ease-power3: cubic-bezier(0.35, 0, 0.1, 1);
  --ease-power2: cubic-bezier(0.45, 0, 0.3, 1);
}

/* Coffee Theme */
[data-theme="coffee"] {
  --color-bg: #1F1612;
  --color-text: #D4C4B0;
  --color-brown: #C9A87C;
  --color-muted: #8B7355;
  --color-border: rgba(201,168,124,0.15);
  --color-hero-bg: #2A1F1A;
  --color-card-hover: rgba(201,168,124,0.06);
  --color-modal-overlay: rgba(15,10,8,0.75);
  --color-nav-bg: rgba(31,22,18,0.92);
  --color-tag-bg: rgba(201,168,124,0.10);
  --color-btn-active-text: #1F1612;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background .4s var(--ease-power3), color .4s var(--ease-power3);
}
a { color: inherit; text-decoration: none; }

/* Theme Toggle */
.theme-toggle {
  position: fixed; bottom: 24px; right: 24px; z-index: 300;
  display: flex; align-items: center; gap: 8px;
  background: var(--color-brown); color: var(--color-btn-active-text);
  border: none; border-radius: 100px; padding: 10px 18px;
  font-family: var(--font-sans); font-size: .85rem; cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  transition: transform .2s, box-shadow .2s, background .3s, color .3s;
}
.theme-toggle:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
.theme-toggle:active { transform: scale(0.96); }
.theme-toggle svg {
  width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8;
}

/* Preloader - 簡化版 */
.preloader {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--color-bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .6s var(--ease-power3), visibility .6s;
}
.preloader.loaded { opacity: 0; visibility: hidden; pointer-events: none; }
.preloader-title {
  font-family: var(--font-serif); font-size: clamp(2rem, 6vw, 4.5rem);
  color: var(--color-brown); letter-spacing: .06em;
}
.preloader-sub {
  margin-top: 16px; font-size: .9rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--color-muted);
}
.preloader-line {
  width: 60px; height: 1px; background: var(--color-brown);
  margin-top: 20px; animation: preloaderLine 1.2s var(--ease-power3) forwards;
}
@keyframes preloaderLine {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}

/* Navigation */
.nav {
  position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
  background: var(--color-nav-bg); backdrop-filter: blur(20px) saturate(1.2);
  border-bottom: 1px solid transparent;
  transition: border-color .3s, background .3s;
}
.nav.scrolled { border-bottom-color: var(--color-border); }
.nav-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 56px;
}
.nav-brand {
  font-family: var(--font-serif); font-size: 1.2rem;
  font-weight: 600; color: var(--color-brown); letter-spacing: .02em;
  transition: opacity .25s;
}
.nav-brand:hover { opacity: .6; }
.nav-links { display: flex; gap: 32px; list-style: none; }
.nav-links a {
  font-size: .85rem; letter-spacing: .02em; color: var(--color-muted);
  transition: color .2s;
}
.nav-links a:hover { color: var(--color-brown); }

/* Hero */
.hero {
  position: relative; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-hero-bg);
  overflow: hidden;
  transition: background .4s var(--ease-power3);
}
.hero-deco {
  position: absolute; font-family: var(--font-serif);
  font-size: clamp(6rem, 20vw, 16rem); color: var(--color-brown);
  opacity: .04; pointer-events: none; user-select: none;
  letter-spacing: .1em; line-height: 1;
}
.hero-deco.d1 { top: 8%; left: 5%; }
.hero-deco.d2 { bottom: 10%; right: 5%; }
.hero-wrap {
  max-width: 1100px; width: 100%; margin: 0 auto;
  display: grid; grid-template-columns: 1.1fr 1fr;
  gap: 64px; padding: 120px 24px 80px; align-items: center;
}
@media (max-width: 768px) {
  .hero-wrap { grid-template-columns: 1fr; gap: 40px; padding: 100px 20px 60px; }
  .nav-links { display: none; }
}
.hero-title {
  font-family: var(--font-serif); font-size: clamp(2.5rem, 6vw, 4.8rem);
  font-weight: 600; line-height: 1.1; color: var(--color-brown); letter-spacing: .02em;
}
.hero-subtitle {
  margin-top: 28px; font-size: clamp(1rem, 2vw, 1.25rem);
  line-height: 1.8; color: var(--color-muted); max-width: 480px;
}
.hero-meta {
  margin-top: 40px; display: flex; align-items: center; gap: 20px;
}
.hero-author {
  font-family: var(--font-mono); font-size: .8rem;
  letter-spacing: .06em; text-transform: uppercase; color: var(--color-brown);
}
.hero-line { width: 40px; height: 1px; background: var(--color-brown); opacity: .3; }
.hero-count {
  font-size: .8rem; color: var(--color-muted); letter-spacing: .02em;
}
.hero-visual {
  display: flex; align-items: center; justify-content: center;
  min-height: 300px;
}
.hero-circle {
  position: relative; width: 220px; height: 220px;
}
.hero-ring {
  position: absolute; inset: 0;
  border: 1px solid rgba(128,128,128,0.15); border-radius: 50%;
}
.hero-ring.r1 { inset: 0;   animation: ringPulse 4s ease-in-out infinite; }
.hero-ring.r2 { inset: 25px; animation: ringPulse 4s ease-in-out .8s infinite; }
.hero-ring.r3 { inset: 50px; animation: ringPulse 4s ease-in-out 1.6s infinite; }
.hero-ring.r4 { inset: 75px; animation: ringPulse 4s ease-in-out 2.4s infinite; }
.hero-icon {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 56px; height: 56px; border: 2px solid var(--color-brown);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  opacity: .7;
}
.hero-icon::before, .hero-icon::after {
  content: ''; position: absolute; background: var(--color-brown);
}
.hero-icon::before { width: 2px; height: 16px; }
.hero-icon::after  { width: 16px; height: 2px; }
@keyframes ringPulse {
  0%, 100% { transform: scale(1); opacity: .6; }
  50%      { transform: scale(1.02); opacity: 1; }
}

/* Preface */
.preface {
  max-width: 680px; margin: 0 auto; padding: 100px 24px 80px;
}
.preface-header {
  font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--color-muted); margin-bottom: 48px;
}
.preface-title {
  font-family: var(--font-serif); font-size: clamp(1.5rem, 4vw, 2.25rem);
  font-weight: 600; line-height: 1.4; color: var(--color-brown); margin-bottom: 8px;
}
.preface-subtitle {
  font-size: 1.05rem; color: var(--color-muted); margin-bottom: 40px; line-height: 1.7;
}
.preface-body {
  font-size: 1rem; line-height: 2; color: var(--color-text);
}
.preface-body p { margin-bottom: 1.6em; }
.preface-body strong { color: var(--color-brown); font-weight: 600; }
.preface-signature {
  margin-top: 48px; display: flex; align-items: center; gap: 16px;
}
.preface-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--color-brown); opacity: .15;
}
.preface-name {
  font-family: var(--font-serif); font-size: 1rem; font-weight: 600;
  color: var(--color-brown);
}
.preface-role {
  font-size: .85rem; color: var(--color-muted);
}

/* Dimensions */
.dimensions {
  max-width: 1100px; margin: 0 auto; padding: 80px 24px;
}
.dimensions-header {
  margin-bottom: 56px; max-width: 640px;
}
.dimensions-label {
  font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--color-muted); margin-bottom: 20px;
}
.dimensions-title {
  font-family: var(--font-serif); font-size: clamp(1.5rem, 4vw, 2.25rem);
  font-weight: 600; color: var(--color-brown); line-height: 1.4; margin-bottom: 16px;
}
.dimensions-desc {
  font-size: 1rem; line-height: 1.8; color: var(--color-muted);
}

/* Accordion */
.accordion { display: flex; flex-direction: column; gap: 12px; }
.accordion-item { border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; }
.accordion-toggle {
  width: 100%; display: flex; align-items: center; gap: 20px;
  padding: 24px 28px; background: transparent; border: none; cursor: pointer;
  text-align: left; transition: background .2s;
}
.accordion-toggle:hover { background: var(--color-card-hover); }
.accordion-num {
  font-family: var(--font-mono); font-size: .8rem; letter-spacing: .04em;
  color: var(--color-muted); flex-shrink: 0; min-width: 36px;
}
.accordion-info { flex: 1; }
.accordion-name {
  font-family: var(--font-serif); font-size: 1.15rem; font-weight: 600;
  color: var(--color-brown); margin-bottom: 4px;
}
.accordion-meta {
  font-size: .85rem; color: var(--color-muted); line-height: 1.5;
}
.accordion-arrow {
  width: 20px; height: 20px; flex-shrink: 0;
  transition: transform .3s var(--ease-power2);
}
.accordion-arrow svg { width: 100%; height: 100%; stroke: var(--color-muted); stroke-width: 1.5; fill: none; }
.accordion-item.is-open .accordion-arrow { transform: rotate(180deg); }

.accordion-body {
  max-height: 0; overflow: hidden;
  transition: max-height .4s var(--ease-power2), padding .3s;
}
.accordion-item.is-open .accordion-body { max-height: 500px; padding: 0 28px 28px; }
.accordion-body p {
  font-size: .95rem; line-height: 1.8; color: var(--color-text); padding-left: 56px;
}

/* Chapters Grid */
.chapters {
  max-width: 1100px; margin: 0 auto; padding: 80px 24px;
}
.chapters-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 20px; margin-bottom: 48px;
}
.chapters-title {
  font-family: var(--font-serif); font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 600; color: var(--color-brown);
}
.chapters-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn {
  padding: 8px 18px; border-radius: 100px; border: 1px solid var(--color-border);
  background: transparent; font-size: .85rem; cursor: pointer;
  color: var(--color-muted); transition: all .2s;
}
.filter-btn:hover { border-color: var(--color-brown); color: var(--color-brown); }
.filter-btn.is-active { background: var(--color-brown); color: var(--color-btn-active-text); border-color: var(--color-brown); }

.chapters-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
}
@media (max-width: 900px) { .chapters-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .chapters-grid { grid-template-columns: 1fr; } }

.chapter-card {
  border: 1px solid var(--color-border); border-radius: 12px; padding: 28px;
  cursor: pointer; transition: transform .3s var(--ease-power2), box-shadow .3s, border-color .3s;
  background: transparent; text-align: left; width: 100%;
  display: flex; flex-direction: column; min-height: 200px;
}
.chapter-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  border-color: rgba(128,128,128,0.25);
}
[data-theme="coffee"] .chapter-card:hover {
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  border-color: rgba(201,168,124,0.25);
}
.chapter-card-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.chapter-num {
  font-family: var(--font-mono); font-size: .8rem; letter-spacing: .04em;
  color: var(--color-muted);
}
.chapter-dim {
  font-size: .75rem; color: var(--color-muted); background: var(--color-tag-bg);
  padding: 3px 10px; border-radius: 100px;
}
.chapter-name {
  font-family: var(--font-serif); font-size: 1.1rem; font-weight: 600;
  line-height: 1.5; color: var(--color-brown); margin-bottom: 16px;
}
.chapter-excerpt {
  font-size: .9rem; line-height: 1.7; color: var(--color-muted);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; flex: 1;
}
.chapter-tags {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px;
}
.chapter-tag {
  font-size: .75rem; color: var(--color-muted); padding: 3px 10px;
  border-radius: 100px; border: 1px solid var(--color-border);
}
.chapter-footer {
  display: flex; align-items: center; justify-content: space-between; margin-top: 20px;
  padding-top: 16px; border-top: 1px solid var(--color-border);
}
.chapter-read {
  font-size: .85rem; color: var(--color-brown); font-weight: 500;
  transition: color .2s;
}
.chapter-card:hover .chapter-read { color: var(--color-muted); }
.chapter-read svg {
  width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; fill: none;
  margin-left: 4px; vertical-align: middle;
}

/* Article Modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--color-modal-overlay); backdrop-filter: blur(4px);
  opacity: 0; visibility: hidden;
  transition: opacity .3s, visibility .3s;
}
.modal-overlay.is-visible { opacity: 1; visibility: visible; }
.modal {
  position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 680px; z-index: 201;
  background: var(--color-bg);
  transform: translateX(100%);
  transition: transform .4s var(--ease-power3), background .4s var(--ease-power3);
  overflow-y: auto;
}
.modal.is-visible { transform: translateX(0); }
.modal-close {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 32px; background: var(--color-nav-bg); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--color-border); cursor: pointer;
  transition: background .3s;
}
.modal-close svg { width: 20px; height: 20px; stroke: var(--color-brown); stroke-width: 1.5; fill: none; }
.modal-label { font-size: .8rem; color: var(--color-muted); }
.modal-inner { padding: 20px 32px 64px; }
.modal-header { margin-bottom: 40px; }
.modal-dim {
  font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--color-muted); margin-bottom: 12px;
}
.modal-title {
  font-family: var(--font-serif); font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 600; line-height: 1.4; color: var(--color-brown); margin-bottom: 16px;
}
.modal-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.modal-tag {
  font-size: .8rem; color: var(--color-muted); padding: 5px 14px;
  border-radius: 100px; border: 1px solid var(--color-border);
}
.modal-body {
  font-size: 1rem; line-height: 2; color: var(--color-text);
}
.modal-body p { margin-bottom: 1.6em; }
.modal-nav {
  display: flex; justify-content: space-between; gap: 12px; margin-top: 48px;
  padding-top: 32px; border-top: 1px solid var(--color-border);
}
.modal-nav button {
  padding: 12px 24px; border: 1px solid var(--color-border); border-radius: 8px;
  background: transparent; font-size: .85rem; cursor: pointer; color: var(--color-muted);
  transition: all .2s; flex: 1;
}
.modal-nav button:hover { border-color: var(--color-brown); color: var(--color-brown); }
.modal-nav button:disabled { opacity: .3; cursor: not-allowed; }

/* Footer */
.footer {
  border-top: 1px solid var(--color-border); padding: 40px 24px;
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
}
.footer-copy { font-size: .85rem; color: var(--color-muted); }
.footer-links { display: flex; gap: 24px; list-style: none; }
.footer-links a { font-size: .85rem; color: var(--color-muted); transition: color .2s; }
.footer-links a:hover { color: var(--color-brown); }

/* Reveal Animations */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s var(--ease-power3), transform .6s var(--ease-power3); }
.reveal.is-visible { opacity: 1; transform: translateY(0); }
.reveal-delay-1 { transition-delay: .08s; }
.reveal-delay-2 { transition-delay: .16s; }
.reveal-delay-3 { transition-delay: .24s; }
.reveal-delay-4 { transition-delay: .32s; }
.reveal-delay-5 { transition-delay: .40s; }
.reveal-delay-6 { transition-delay: .48s; }
</style>
<base target="_blank">
</head>
<body>

  <svg id="theme-icon-light" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  <svg id="theme-icon-coffee" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
  <span id="theme-label">咖啡模式</span>
</button>

<!-- Preloader -->
<div class="preloader" id="preloader">
  <div class="preloader-title">擴容</div>
  <div class="preloader-sub">職場裡的溫柔革命</div>

<!-- Navigation -->
<nav class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="#">擴容</a>
    <ul class="nav-links">

      <li><a href="#dimensions">維度</a></li>
      <li><a href="#chapters">篇章</a></li>

</nav>

<!-- Hero -->

        <span class="hero-count" id="hero-count"></span>

    <div class="hero-visual">
      <div class="hero-circle">
        <div class="hero-ring r1"></div>
        <div class="hero-ring r2"></div>
        <div class="hero-ring r3"></div>
        <div class="hero-ring r4"></div>
        <div class="hero-icon"></div>
      </div>
    </div>
  </div>
</section>

<!-- Preface -->
<section class="preface reveal" id="preface">
  <div class="preface-header">序</div>
  <h2 class="preface-title" id="preface-title"></h2>
  <p class="preface-subtitle" id="preface-subtitle"></p>

  <div class="preface-signature">

      <div class="preface-name">石頭哥</div>

</section>

<!-- Dimensions -->
<section class="dimensions reveal" id="dimensions">
  <div class="dimensions-header">
    <div class="dimensions-label">八大維度</div>

</section>

<!-- Chapters -->

</section>
