function renderHero() {
  const titleEl = document.getElementById('hero-title');
  const subEl = document.getElementById('hero-subtitle');
  const countEl = document.getElementById('hero-count');

  const title = appData.intro.title || '擴容';
  titleEl.innerHTML = title.split('').map(ch => '<span class="reveal-ch">' + ch + '</span>').join('');

  subEl.textContent = appData.intro.subtitle || '';

  let totalArticles = 0;
  appData.dimensions.forEach(d => { totalArticles += (d.articles ? d.articles.length : 0); });
  countEl.textContent = totalArticles + ' 篇職場溫柔革命';
}

function renderPreface() {
  document.getElementById('preface-title').textContent = appData.intro.prefaceTitle || '';
  document.getElementById('preface-subtitle').textContent = appData.intro.prefaceSubtitle || '';

  const prefaceText = appData.intro.prefaceText || '';
  const paragraphs = prefaceText.split('\n\n').filter(p => p.trim());
  document.getElementById('preface-body').innerHTML = paragraphs.map(p => {
    const boldP = p.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return '<p>' + boldP + '</p>';
  }).join('');
}

function renderDimensions() {
  document.getElementById('dimensions-title').textContent = appData.intro.dimensionsTitle || '八大維度';
  document.getElementById('dimensions-desc').textContent = appData.intro.dimensionsSubtitle || '';

  const accordionEl = document.getElementById('accordion');
  let dimIndex = 0;
  appData.dimensions.forEach((dim, i) => {
    dimIndex = i + 1;
    const item = document.createElement('div');
    item.className = 'accordion-item';
    item.innerHTML = '
      <button class="accordion-toggle">
        <span class="accordion-num">' + String(dimIndex).padStart(2,'0') + '</span>
        <div class="accordion-info">
          <div class="accordion-name">' + dim.name + '</div>
          <div class="accordion-meta">' + (dim.articles ? dim.articles.length : 0) + ' 篇</div>
        </div>
        <span class="accordion-arrow"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span>
      </button>
      <div class="accordion-body"><p>' + (dim.dimensionText || '') + '</p></div>
    ';
    accordionEl.appendChild(item);
  });
}

function renderFilters() {
  const filtersEl = document.getElementById('filters');
  appData.dimensions.forEach(dim => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.filter = dim.id;
    btn.textContent = dim.name;
    filtersEl.appendChild(btn);
  });
}

function renderChapters(filterDim) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  let globalIndex = 0;
  appData.dimensions.forEach(dim => {
    if (filterDim && filterDim !== 'all' && filterDim !== dim.id) return;
    if (!dim.articles) return;

    dim.articles.forEach((article, idx) => {
      globalIndex++;
      const card = document.createElement('article');
      card.className = 'chapter-card reveal reveal-delay-' + ((globalIndex % 6) || 6);
      const articleIndex = globalIndex - 1;
      card.dataset.index = articleIndex;

      let excerpt = '';
      if (article.summary) {
        excerpt = article.summary.substring(0, 90).replace(/\n/g, '') + '...';
      }

      const tagsHtml = (article.tags || []).slice(0, 3).map(t =>
        '<span class="chapter-tag">' + t + '</span>'
      ).join('');

      card.innerHTML = '
        <div class="chapter-card-header">
          <span class="chapter-num">' + String(globalIndex).padStart(2,'0') + '</span>
          <span class="chapter-dim">' + dim.name + '</span>
        </div>
        <h3 class="chapter-name">' + (article.title || '') + '</h3>
        <p class="chapter-excerpt">' + excerpt + '</p>
        <div class="chapter-tags">' + tagsHtml + '</div>
        <div class="chapter-footer">
          <span class="chapter-read">閱讀更多 <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
        </div>
      ';

      card.addEventListener('click', () => openModal(articleIndex));
      grid.appendChild(card);
    });
  });

  setTimeout(() => observeReveal(), 100);
}

// ===== Preloader =====
function initPreloader() {
  const preloader = document.getElementById('preloader');
  setTimeout(() => { preloader.classList.add('loaded'); }, 800);
}

// ===== Nav =====
function initNav() {
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 60);
  }, { passive: true });

  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const target = document.querySelector(link.getAttribute('href'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ===== Reveal on scroll =====
let revealObserver;
function initReveal() {
  revealObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('is-visible');
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
  observeReveal();
}
function observeReveal() {
  document.querySelectorAll('.reveal:not(.is-visible)').forEach(el => {
    revealObserver.observe(el);
  });
}

// ===== Accordion =====
function initAccordion() {
  document.getElementById('accordion').addEventListener('click', e => {
    const toggle = e.target.closest('.accordion-toggle');
    if (!toggle) return;
    const item = toggle.closest('.accordion-item');
    const wasOpen = item.classList.contains('is-open');
    document.querySelectorAll('.accordion-item.is-open').forEach(i => i.classList.remove('is-open'));
    if (!wasOpen) item.classList.add('is-open');
  });
}

// ===== Filters =====
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('is-active'));
  btn.classList.add('is-active');
  renderChapters(btn.dataset.filter);
});

// ===== Modal =====
let currentModalIndex = 0;

function initModal() {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  const closeBtn = document.getElementById('modal-close');

  function close() { modal.classList.remove('is-visible'); overlay.classList.remove('is-visible'); document.body.style.overflow = ''; }

  overlay.addEventListener('click', close);
  closeBtn.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
}

function openModal(globalIndex) {
  currentModalIndex = globalIndex;
  updateModalContent();

  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  overlay.classList.add('is-visible');
  modal.classList.add('is-visible');
  document.body.style.overflow = 'hidden';
  document.getElementById('modal-inner').scrollTop = 0;
}

function updateModalContent() {
  let currentGlobalIdx = 0;
  let found = null;
  let dimName = '';

  for (const dim of appData.dimensions) {
    if (!dim.articles) continue;
    for (const article of dim.articles) {
      if (currentGlobalIdx === currentModalIndex) {
        found = article;
        dimName = dim.name;
        break;
      }
      currentGlobalIdx++;
    }
    if (found) break;
  }

  if (!found) return;

  const inner = document.getElementById('modal-inner');
  const totalArticles = appData.dimensions.reduce((sum, d) => sum + (d.articles ? d.articles.length : 0), 0);

  let bodyHtml = '';
  if (found.summary) {
    const paragraphs = found.summary.split('\n\n').filter(p => p.trim());
    bodyHtml = paragraphs.map(p => {
      const boldP = p.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      return '<p>' + boldP + '</p>';
    }).join('');
  }

  const tagsHtml = (found.tags || []).map(t =>
    '<span class="modal-tag">' + t + '</span>'
  ).join('');

  inner.innerHTML = '
    <div class="modal-header">
      <div class="modal-dim">' + dimName + ' &middot; ' + String(currentModalIndex + 1).padStart(2,'0') + ' / ' + String(totalArticles).padStart(2,'0') + '</div>
      <h2 class="modal-title">' + (found.title || '') + '</h2>
      <div class="modal-tags">' + tagsHtml + '</div>
    </div>
    <div class="modal-body">' + bodyHtml + '</div>
    <div class="modal-nav">
      <button id="modal-prev" ' + (currentModalIndex <= 0 ? 'disabled' : '') + '>&#8592; 上一篇</button>
      <button id="modal-next" ' + (currentModalIndex >= totalArticles - 1 ? 'disabled' : '') + '>下一篇 &#8594;</button>
    </div>
  ';

  const prevBtn = document.getElementById('modal-prev');
  const nextBtn = document.getElementById('modal-next');
  if (prevBtn) prevBtn.addEventListener('click', () => { if (currentModalIndex > 0) { currentModalIndex--; updateModalContent(); document.getElementById('modal-inner').scrollTop = 0; }});
  if (nextBtn) nextBtn.addEventListener('click', () => { if (currentModalIndex < totalArticles - 1) { currentModalIndex++; updateModalContent(); document.getElementById('modal-inner').scrollTop = 0; }});
}

// ===== Keyboard Nav =====
function initKeyboardNav() {
  const modal = document.getElementById('modal');
  document.addEventListener('keydown', e => {
    if (!modal.classList.contains('is-visible')) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); document.getElementById('modal-prev')?.click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); document.getElementById('modal-next')?.click(); }
  });
}

// ===== Start =====
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadAllData);
} else {
  loadAllData();
}
</script>
