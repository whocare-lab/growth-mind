:root,[data-theme="light"]{
  --bg:#f7f2ea;

  --text:#221c17;

  --warm:#f7efe2;
  --cool:#eaf5f6;

  --title:clamp(2rem,5vw,2.8rem);

}
[data-theme="dark"]{
  --bg:#1d1713;
  --surface:#28211c;
  --text:#f2e7d7;
  --muted:#c5b7a8;
  --soft:#918274;
  --line:rgba(242,231,215,.1);
  --warm:#302621;
  --cool:#213030;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",sans-serif;font-size:var(--body);line-height:1.72}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-size:14px;color:var(--muted);letter-spacing:.08em}
.theme{width:46px;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px}
.stack{display:grid;gap:18px}
.grid{display:grid;gap:18px}
.card,.reader,.inner{border:1px solid var(--line);box-shadow:var(--shadow)}
.tap{width:100%;padding:0;border:0;background:none;text-align:left}
.shell{border-radius:32px;padding:28px 24px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.hero .shell{background:linear-gradient(180deg,var(--surface),var(--warm))}
.warm .shell{background:var(--warm)}
.cool .shell{background:var(--cool)}
.kicker{font-size:.95rem;color:var(--muted);margin-bottom:12px}
h1{margin:0 0 14px;font-size:var(--hero);line-height:1.04;font-weight:900;letter-spacing:-.03em}
h2{margin:0 0 10px;font-size:var(--title);line-height:1.1;font-weight:900;letter-spacing:-.03em}
h3{margin:0 0 10px;font-size:var(--card);line-height:1.16;font-weight:900;letter-spacing:-.02em}
.punch{margin:0;max-width:15ch;font-size:clamp(1.2rem,1.06rem + .7vw,1.88rem);line-height:1.45;color:var(--muted);font-weight:500}
.summary{margin:0;max-width:19ch;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:.95rem;color:var(--soft)}
.hint{font-size:.95rem;color:var(--soft);margin:2px 4px}
.expand{display:none;gap:14px;margin-top:14px}
.expand.active{display:grid}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(286px,84vw);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.carousel>*{scroll-snap-align:start}
.reader{position:fixed;inset:0;display:none;z-index:50;background:rgba(20,16,12,.42);backdrop-filter:blur(6px);padding:10px}
.reader.active{display:block}
.reader-box{height:100%;background:var(--surface);border-radius:28px;padding:20px 18px 26px;overflow:auto;display:flex;flex-direction:column}
.reader-top{position:sticky;top:0;background:linear-gradient(180deg,var(--surface) 80%,rgba(0,0,0,0));padding-bottom:12px;margin-bottom:8px;flex-shrink:0}
.reader-title{font-size:clamp(1.55rem,4.5vw,2.15rem);line-height:1.15;font-weight:900;margin:0 0 8px}
.reader-sub{font-size:.92rem;color:var(--muted);margin-bottom:4px}
.reader-content{font-size:var(--full);line-height:1.84;color:var(--text);flex:1;overflow-y:auto;padding-right:8px}
.reader-content p{margin:0 0 1em}
.close{min-height:44px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;margin-top:12px}
.report{padding:14px 16px;border-radius:20px;background:rgba(1,105,111,.08);border:1px solid rgba(1,105,111,.12);color:var(--muted)}
@media (min-width:860px){
  .wrap{padding:26px 24px 100px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .carousel{grid-auto-columns:minmax(320px,34vw)}
  .reader{padding:20px 70px}
  .reader-box{padding:26px 30px 36px}
}

<h1>擴容</h1>
<p class="punch">職場裡的溫柔革命——把那些撐不住的時刻，變成你容納幸福的底氣。</p>

<article>
<button class="tap" data-reader-title="序文" data-reader-sub="完整閱讀模式" data-reader-content="序言：為什麼我想整理成「擴容」<br><br>擴容，不是要你假裝沒事，也不是要你把痛苦合理化。<br><br>擴容，是把那些曾經讓你難受、失望、委屈、跌倒的經驗，一點一點消化，最後轉化成更深的理解、更穩的情緒、更大的格局，還有更能承接人生起伏的力量。<br><br>這本書，不是要你變成「不會痛」的人。而是陪你練習：在痛的時候，不再只會撐硬，而是多一點看見自己、理解自己、放過自己的能力。<br><br>這些年，走過幾家企業、穿梭過許多廠房、開過無數次的會議，我看見一個愈來愈明顯的現象：<br><br>我們這個時代的工作者，擁有前所未有的工具與資訊，卻也承受著前所未有的「內在緊繃」。<br><br>我們學會了敏捷開發、數據分析、專案管理，卻很少有人教我們：當自己明明已經盡力了，卻仍覺得不夠好的時候，該如何安放那份挫敗。<br><br>有人在升遷名單上摔了一跤，有人在病床旁打開筆電，有人一邊應付家庭壓力一邊扛著公司業績。表面上大家都還在運轉，心裡卻早已撐得滿滿的。<br><br>我常在課後、走廊、電梯旁，聽見那些壓低音量說出口的心事：<br><br>「石頭哥，我好像一個快要滿出來的杯子，但還是一直有人往裡面倒水。」<br><br>「我也知道不該這麼在意，但就是放不下。」<br><br>「我不是不想改變，只是我真的好累。」<br><br>那一刻，我總會想起紀伯倫說的話：「悲傷在你內心刻得越深，你能承載的快樂就越多。」<br><br>如果有一個詞，既能承認現實的殘酷，又仍然相信人能在裂縫中長出韌性——我想，那個詞就是「擴容」。<br><br>擴容，不是要你變得無堅不摧，也不是要你否認那些曾經讓你痛到睡不著的夜晚。<br><br>擴容，是讓你的內在容器，慢慢長得更柔軟、更寬闊。寬到可以容納不確定性、暫時的失敗、別人的誤解，甚至是你對自己的失望。<br><br>這本書的 48 篇文字，構成了一張向外推演的「同心圓」地圖：<br><br>從最內層的情緒擴容、認知擴容，一路走到行動、關係、團隊、策略、時間，最後回到生命擴容——陪你從核心的內在修練，走向外部世界的博弈與整合。<br><br>你會看見，原來那些以為撐不過去的時刻，有一天都可能變成你看待別人痛苦時的溫柔；原來那些以為是錯誤的選擇，也可能在未來某個節點，變成你獨一無二的底氣。<br><br>人生的痛，不是為了折磨你，而是慢慢幫你「擴容」。<br><br>當你翻開這 8 個維度的 48 篇故事，我希望它不只是一組職涯建議，而是一雙在深夜裡遞給你的溫暖手掌。<br><br>加油囉，我的朋友。我們書裡見。">

  {id:1, dim:"dim1", title:"人生 的 痛 ， 不是 為 了 折 磨 你 ， 而 是 慢慢 幫 你 「 擴 容 」", summary:"當你面 對 痛苦 、 難 過 、 悲 傷 時 ， 別 急著 逃 避 。 紀 伯 倫 說 悲 傷 刻 得 越 深 ， 能 承 載 的 快 樂 就", content:"<p>第 1 篇：人生 的 痛 ， 不是 為 了 折 磨 你 ， 而 是 慢慢 幫 你 「 擴 容 」</p>\n<p>當你面 對 痛苦 、 難 過 、 悲 傷 時 ， 別 急著 逃 避 。 紀 伯 倫 說 悲 傷 刻 得 越 深 ， 能 承 載 的 快 樂 就</p>\n<p>越多。職 場 裡 的 隱 形 失落 從 未 遠 離 ， 唯 有 承 認 痛苦 、 練 習 與 悲 傷 共 處 ， 才 能 讓 內 在 容 器 慢慢 擴 容 ，</p>\n<p>長出承接光 亮 的 底 氣 。</p>\n<p>今天在  Threads 上 滑 到 一 段 話 ， 像 是 一 記 溫 柔 的 重 錘 ，一 次 粉 碎 了 那些 我 們 平 日 試 圖 掩 蓋 的 悲</p>\n<p>傷。那位 脆友 寫道 ： 「 情 緒 的 深 度 來 自 內 在 ， 而 不是外 界 給 予 。 」 這 讓 我 想起 ， 真 正 打 動 人 的， 從</p>\n<p>來不是單 純 的安 慰 ， 而 是 那些 能 讓 人 重 新 理 解 自 己 生 命 經 驗 的 句 子 。</p>\n<p>很多時候 ，我 們 把 快 樂 想得 太 輕 ， 把 悲 傷 想得 太 重 。 可是 真 正成 熟 的 人生 ， 不是 永 遠 都快 樂 ， 而</p>\n<p>是你終於懂得 ：情 緒 不是 敵 人 ， 悲 傷 也 不是 失 敗 。 它 只 是生 命 的一 部分 ， 提 醒 你 還 活 著 ， 還 會</p>\n<p>痛，也還能 再次感 受 溫 暖 。</p>\n<p>我第一次 讀到 紀 伯 倫 《先 知 》 裡 的 〈 On Joy and Sorrow 〉 ， 是在 一 個 風 雨 交 加 的 夜晚 。 那 時 我 剛</p>\n<p>結束一場 極其 艱 難 的 專 案 ， 團 隊 裡 有 人 離 職 ，有 人 當 著 我 的 面 摔 門 ，有 人 默默 把 辭 呈 放 在我 桌</p>\n<p>上。我獨自坐在 辦 公 室 裡 ， 窗 外 的 雨 打 在 玻璃 上 ， 我以 為 自 己 撐 過 去 了 ， 畢 竟 專 案 結 案 了 ， 數 字</p>\n<p>也達標了 。 但就在 那 個 瞬 間 ， 某 種 巨 大 的 空 洞 襲 來 ， 像 是 一 個 無 底 的 黑 洞 ， 把 我所 有 「 應 該 感 到</p>\n<p>開心」的情 緒全部 吸 走 。</p>\n<p>我打開書 ， 讀到 那 句 ： 「悲 傷 在你 內 心 刻 得 越 深 ， 你能 承 載 的 快 樂 就 越 多 。 」</p>\n<p>我停了下 來 。不是 因 為 它 悲 觀 ， 而 是 因 為 它 太 誠 實 了 。</p>\n<p>原來，我 們以 為 撐 不 過 去 的 那些 夜晚 ， 其 實 正在 默默 擴 大我 們 內 心 的 容量 。 原 來 ， 那些 讓 人 低 頭</p>\n<p>的啜泣，也可能在 無 形 之 中， 讓 我 們 更 懂 得 如 何 承 接 光 亮 。</p>\n<p>我想起一位 朋友 ， 她 在 母 親 過 世 後 的 第 三年 ， 才 終 於 允 許 自 己走 進 母 親 以前 常去 的 那 間 菜 市 場 。</p>\n<p>她站在那 個 攤位前 ， 看 著 老 闆 娘 熟 練 地 包 著 青 菜 ， 突 然 鼻 酸 。 她 說 ： 「 我以 為 我 已 經 好了 ， 但 原 來</p>\n<p>我只是把 悲 傷關在 門 外 ， 假 裝 它 不 存 在 。 」</p>\n<p>她後來告 訴我 ， 那 次 痛 哭 之 後 ， 她 反而 能好好 吃 飯 了 。 不是 因 為 悲 傷 消 失 了 ， 而 是 因 為 她 終 於 承</p>\n<p>認：「這一次 ，真 的 很 痛 。 」 而 正是 那 份承 認 ， 讓 她 的 容 器 撐 開 了 一 點點 。</p>\n<p>職場裡的 悲 傷 往往 更 隱 形 。 沒 有 人 會 為 了 一 個 沒 有 升 遷 的 季 度 辦 葬 禮 ， 沒 有 人 會 為 了 一 個 被 否 決</p>\n<p>的提案穿 黑 衣 。 但那些 失落 是 真 實 的。 你 熬 夜 做 的 簡 報 被 主 管 一 句 「 重做 」 打 回 ； 你 帶 了 兩 年 的</p>\n<p>部屬突然 說要離 開 ； 你以 為 穩 操 勝 算 的 專 案 ， 最 後 輸 給 了 競 爭 對 手 。 這 些 時 刻 ， 我 們 習 慣 說 「 沒</p>\n<p>關係，下次 再努力 」 ， 然 後 把 情 緒 收 拾 好 ， 放 進 心 裡 最 深 、 最不 打 擾 人 的 抽 屜 。</p>\n<p>7不知不覺，我 們 變成 一 個 很 會 替 別 人 著 想 、 卻 不 太 敢 承 認 自 己需 要 的 人 。</p>\n<p>但悲傷從未 遠離 。特 別 是在 一 個 夜 深 人 靜 、 風 雨 交 加 的 夜晚 ， 甚 至 明明 一 群 人 熱 鬧 的 場 合 ， 你 依</p>\n<p>舊會感受到這 股 闇 黑 力 量 的 襲 擊 。 它 會 在你最不 設 防 的 時 候 敲 門 ， 提 醒 你 ： 那些 沒 有 認 真 聽 完 的</p>\n<p>電話，那些 「以後 有的 是 時 間 」 卻 再 也 回不 去 的日 常 ， 其 實 一 直都 在 。</p>\n<p>這種遲到的心痛 ， 很 殘 忍 ， 也 很 真 實 。 它 像 是在提 醒 你 ： 你以 為 自 己很 會 收 斂 情 緒 ， 很 會 理性 處</p>\n<p>理一切，其 實 只是 一 直 沒 有 勇 氣 承 認 —— 你 一 直 在 深深 地 愛 著 某 個 目 標 、 某 段 關 係 、 某 個 版本 的 自</p>\n<p>己。</p>\n<p>後來我慢慢看懂 ， 紀 伯 倫 說 的 「 擴 容 」 究 竟 是 什 麼 意 思 。</p>\n<p>它不是要我 們愛上 悲 傷 ， 也 不是要我 們 歌 頌 痛苦 。 它 是在 說 ， 當 你 願 意回 望 那些 過 往 支 離 破 碎 的</p>\n<p>自己、痛不欲生 、 無 能 為 力 的 片 段 ， 你 會發 現 它 們 沒 有 白 來 。 也 因 為 這 些 痛 ， 它 們 把 你 磨 得 更 柔</p>\n<p>軟，也更 堅定 ； 把 你 內 心 的 容 納 撐 得 更 深 ， 也 更能 承 載 。</p>\n<p>如果說年輕 時 的我 們 ， 總 希 望 人生 一 路 順 風 ， 那 麼 走 到 後 來 的 我 們 才 終 於 明 白 ， 真 正 讓 人 長 出 厚</p>\n<p>度的，往往不是 順 境 ， 而 是 那些 不 曾 輕 易 放 過 我 們 的 時 刻 。</p>\n<p>所以，當你下 一次面 對 痛苦 、 難 過 、 悲 傷 時 ， 我 想 邀 請 你 —— 不是要你 立 刻 釋 懷 ， 也 不是要你正 向</p>\n<p>思考 ——而是 蹲下 身 來 ， 輕輕 地 坐 在自 己 的 身 旁 ， 告 訴 自 己 ： 讓 我 們 一 起 練 習 理 解 這 次 有 多 痛 。</p>\n<p>我們不可能愛上 悲 傷 ， 但 是要 一 次 又 一 次地 ， 在 試 煉 中 學 會 不 再把 悲 傷 視 為 人生 的 敵 人 。 因 為 有</p>\n<p>些光，不是 從外面 照 亮 你 ， 而 是 從 你 曾 經 的 黑 暗 裡 長 出 來 的。</p>\n<p>人生的痛，不是 為了 折 磨 你 ， 而 是 慢慢 幫 你 「 擴 容 」 。 當 你能用 這 樣 的 方式看 待 自 己 的 經 歷 ， 也 許</p>\n<p>就會發現 ， 那些 曾 經 讓 你以 為 自 己 快 撐 不 住 的 時 刻 ， 最 後 都 變 成了你 容 納 更大 幸 福 的 底 氣 。</p>\n<p>【80 字摘要】  紀 伯 倫 說 悲 傷 刻 得 越 深 ， 能 承 載 的 快 樂 就 越 多 。 職 場 裡 的 隱 形 失落 從 未 遠 離 ， 唯 有 承 認 痛苦 、 練</p>\n<p>習與悲傷共 處 ，才 能 讓 內 在 容 器 慢慢 擴 容 ， 長 出 承 接 光 亮 的 底 氣 。</p>\n<p>【五個關鍵字】  擴容 、 紀 伯 倫 、 悲 傷 與 喜 悅 、 職 場 療癒 、 情 緒 深 度</p>\n<p>8</p>"},
  {id:2, dim:"dim1", title:"緊 張是 靈 魂 在 擴 容 ： 把 恐 懼 重 新 命 名", summary:"當你上 台 前手心出 汗 、 報 告前心 跳 加 速 ， 你 會 不 會 把 這 些 反 應 當 成 「 我不 夠 好 」 的 證", content:"<p>第 2 篇： 緊 張是 靈 魂 在 擴 容 ： 把 恐 懼 重 新 命 名</p>\n<p>當你上 台 前手心出 汗 、 報 告前心 跳 加 速 ， 你 會 不 會 把 這 些 反 應 當 成 「 我不 夠 好 」 的 證</p>\n<p>據？史丹佛 研究 顯 示 ， 重 新 命 名 壓 力可 改 善 表 現 。 透 過 「 擴 容 呼 吸 」 三 步 驟 ， 將 恐 懼 轉 化 為 擴 張 的</p>\n<p>訊號，與 壓力共 舞 而 非 對 抗 。</p>\n<p>你站在公司會 議 室 的 洗 手 間 裡 ， 看 著 鏡 子 裡 的 自 己 。 臉 色 蒼 白 ， 嘴 唇 乾 燥 ， 雙 手在 水 龍 頭 下 反 覆</p>\n<p>沖洗，不是 因 為 髒 ， 是 因 為 你不知道 還 能 做 些什 麼 來 拖 延 那 個 即 將 到 來 的 時 刻 。</p>\n<p>再過五分 鐘 ，你要 向 董 事 會 報 告 一 個 你 準 備 了三 個 月的 專 案 。 你 的 胃 在收 縮 ， 你 的 膝 蓋 在微微 顫</p>\n<p>抖。你對自 己 說 ： 「 我好 緊 張 。 」 然 後 下 一 秒 ， 那 個 熟 悉 的 聲 音 接上 來 ： 「 你看 ， 你 就 是不 夠 好 。</p>\n<p>如果你夠好 ，你就 不 會 這 麼 緊 張 了 。 」</p>\n<p>這個聲音 騙了你多 久 ？</p>\n<p>我記得我第 一次 向 總 經 理 報 告 的 時 候 ， 也 是 這 樣 。 我站在 他 辦 公 室 門 口 ， 手 裡 的 資 料 夾 差 點 掉 在</p>\n<p>地上。我以 為 那是我 「 能力不 足 」 的 證 明 。 但 多年 後 我 才 明 白 ， 那 個 顫 抖 不是 警 告 ， 是 訊 號 —— 我</p>\n<p>的系統正在 升 級 ， 我 的 容 器 正在 被 迫 撐 大 。</p>\n<p>史丹佛心理 學家  Alia Crum 做 了 一 個 著 名 的 實 驗 ： 她 告 訴 一 群 受 試 者 ， 壓 力 反 應 —— 心 跳 加 速 、</p>\n<p>呼吸急促 ——不是 身 體 在 警 告你 「 你不行 」 ， 而 是 身 體 在 幫 你 「 準 備 迎 接 挑 戰 」 。 結 果 ， 那些 被重 新</p>\n<p>教導「壓力是 有 益 的 」 的 人 ， 不 僅 表 現 更好 ， 他 們 的 血 管也 沒 有 因 壓 力 而 過 度收 縮 。</p>\n<p>這就是「重 新 命名 」 的 力 量 。 當 你 把 「 緊 張 」 重 新 命 名 為 「 靈 魂 在 擴 容 」 ， 你 的 身 體 反 應 不 會 改</p>\n<p>變，但你與 它 的關 係 會 改 變 。 你不 再 是 壓 力 的 受 害 者 ， 你是 壓 力 的 共 舞 者 。</p>\n<p>但我們從小被教 導 的， 往往 是相 反 的。 我 們 被教 導 「 緊 張 等 於 能力不 足 」 。 考 試 前 緊 張 ， 代 表你 準</p>\n<p>備不夠；上台前 緊 張 ， 代 表你不 夠 自信 ； 面 試 前 緊 張 ， 代 表你不 夠 資 格 。 這 個 等式 被重 複 了 太 多</p>\n<p>次，以至於我 們內 化了 它 ， 讓 它 變 成 一 個 自 動 播 放 的 程 式 。</p>\n<p>真相是， 緊 張等於 「 這 件事 對 你 很 重 要 」 。 你 會 因 為 一 場 無 關 緊 要 的 會 議 緊 張 嗎 ？ 不 會 。 你 的 身 體</p>\n<p>在顫抖，是 因 為 它 知道 這 是 一 個 「 擴 容 時 刻 」 。 你 的 靈 魂 在 說 ： 「 這 件事 很 大 ， 我 需 要更多 空 間來</p>\n<p>承載它。 」</p>\n<p>還有一個常 見 的 誤 解 ： 「 如果我不 緊 張 ， 代 表我 準 備 好了 。 」 錯 。 許 多 頂 尖 表 演 者 、 運動 員 、 執 行</p>\n<p>長在重大 時刻前都 會 緊 張 。 區 別 不在 於 有 沒 有 緊 張 ， 而 在 於 他 們 怎 麼 解 讀 緊 張 。 他 們 把 顫 抖 當 成</p>\n<p>「能量正在 聚集 」 ， 而 不是 「 系 統 即 將 崩 潰 」 。</p>\n<p>9最毒的誤解是 ： 「消 除 緊 張 才 能表 現 好 。 」 這 是不可能 的， 也 是不 必 要 的。 你不可能 消 除 緊 張 ， 就</p>\n<p>像你不可能消 除海 浪 。 你要 做 的 不是 消 除 緊 張 ， 而 是 帶 著 緊 張 行 動 。 就 像 衝 浪 者不 會 等 海 浪 平 靜</p>\n<p>才下水，他 們 學會 的 是在 海 浪 上 保持 平 衡 。</p>\n<p>我後來發展出 一 個小方法 ， 叫 做 「 擴 容 呼 吸 」 。 不是 深 呼 吸 —— 深 呼 吸 有 時 會 讓 你更 缺 氧 。 而 是三</p>\n<p>步驟。</p>\n<p>第一步，承 認 。對自 己 說 ： 「 我 現 在 很 緊 張 ， 這 代 表 這 件事 對 我 很 重 要 。 」 不要 說 「 我不 緊 張 」 ，</p>\n<p>那是壓抑 ；要 說 「 我 感 覺 到 緊 張 」 ， 那 是接 納 。 接 納 會 讓 緊 張從 敵 人 變 成 訪 客 。</p>\n<p>第二步，定位 。問自 己 ： 「 這 個 緊 張 在我 的 身 體 哪 個 部位 ？ 」 胃 部 ？ 胸 口？ 肩 膀 ？ 把 意 識 放 在 那 個</p>\n<p>部位，像把手 輕輕 放 在 一 個 顫 抖 的 孩 子 肩 上 。 你 會發 現 ， 當 你 開 始 「陪 伴 」 那 個 緊 張 ， 而 不是</p>\n<p>「對抗」 它 ， 它 的 強 度 會 慢慢 下 降 。</p>\n<p>第三步，行 動 。倒 數 五 秒 ， 然 後 做 一 件 最小 的 事 —— 打 開 門 、 按 下 投影 片 播 放 鍵 、 說 出 第 一 句 話 。</p>\n<p>行動會把 緊 張從 「 想 像 」 轉 化 為 「 能 量 」 。 你 會發 現 ，一 旦 開 始 了 ， 緊 張 就 變 成了 燃 料 ， 而 不是 障</p>\n<p>礙。</p>\n<p>我認識一個 業 務 經理 ， 每 次提 案 前 都 會 躲 在 樓 梯 間 做 這 個 練 習 。 她 說 ： 「 以前我 會 想 盡 辦 法 讓 自 己</p>\n<p>不緊張， 喝 溫水 、 聽 音 樂 、 深 呼 吸 ， 但 都 沒 用 。 現 在我 直 接告 訴 自 己 ： 『 這 個 緊 張 是我 的 擴 容 訊</p>\n<p>號。』然後我就進 去 了 。 奇 怪 的 事 情 發 生了 —— 我表 現 得比 以前更好 ， 因 為 我不 再 花 力 氣 假 裝 不 緊</p>\n<p>張，我把所 有力 氣 都放 在 內 容 上 。 」</p>\n<p>緊張不是靈 魂 的 裂 縫 ， 是 靈 魂 的 擴 張 。 那些 讓 你 顫 抖 的 時 刻 ， 都 是你 的 容 器 在 偷偷 長 大 。 下 一 次</p>\n<p>當你手心出汗 ， 記 得 對 自 己 說 ： 「 謝謝 你 ， 我 的 靈 魂 ， 又 幫 我 撐 開 了 一 點 空 間 。 」</p>\n<p>【80 字摘要】  緊 張 與 壓 力 反 應 往往 被 誤 解 為 能力不 足 ， 但 史 丹佛 研究 顯 示重 新 命 名 壓 力可 改 善 表 現 。 透 過 「 擴</p>\n<p>容呼吸」三 步 驟 ， 將 恐 懼 轉 化 為 擴 張 的 訊 號 ， 與 壓 力 共 舞 而 非 對 抗 。</p>\n<p>【五個關鍵字】  緊 張 、 壓 力心 態 、 Alia Crum 、 重 新 命 名 、 擴 容 呼 吸</p>\n<p>10</p>"},
  {id:3, dim:"dim1", title:"當 焦 慮成 為 背 景音 ： 你不 必 關 掉 它 ， 只需 調 低音 量", summary:"當焦 慮 不 再 是 偶 爾 的 警 報 ， 而 是 每 天 播 放 的 背 景音 ， 你 會 不 會 覺 得 自 己 「 壞 掉 了 」 ？ 但", content:"<p>第 3 篇： 當 焦 慮成 為 背 景音 ： 你不 必 關 掉 它 ， 只需 調 低音 量</p>\n<p>當焦 慮 不 再 是 偶 爾 的 警 報 ， 而 是 每 天 播 放 的 背 景音 ， 你 會 不 會 覺 得 自 己 「 壞 掉 了 」 ？ 但</p>\n<p>焦慮的本 質是 過度 的 保 護 。 透 過 「 焦 慮 音 量 調 節 」 練 習 ， 學 會 與 背 景音 共 存 ， 而 不是 拚 命 關 掉 它 。</p>\n<p>早上七點 ， 鬧 鐘 還沒 響 你 就 醒 了 。 不是 因 為 睡 飽 了 ， 是 因 為 心 裡 有一 台 無 形 的 收 音 機 ， 從 睜 眼 那</p>\n<p>一刻就開 始播放 —— 今 天要 交 的 報 告 、 下 午 要 開 的 會 、 主 管 昨 天 那 句 話 到 底 是 什 麼 意 思 、 這 個 月的</p>\n<p>業績會不會 達 標 。 這 些 聲 音 疊 在 一 起 ， 像 一 層 厚厚 的 霧 ， 讓 你 還沒 下 床 就感 覺 累 。</p>\n<p>這不是偶 爾 的 緊 張 。 這 是 焦 慮 ， 而 且它 已 經 從 「 警 報 」 變 成了 「 背 景音 」 。</p>\n<p>我認識一 個 專案 經 理 ， 叫 他 阿 凱 。 阿 凱 的 焦 慮 是 從 週 日 晚 上 開 始 的。 他 說 ： 「 我 從 週 日 下 午 四 點 就</p>\n<p>開始憂鬱 ， 因 為想 到明天要上 班 。 」 這 種 憂 鬱 不是 因 為 工作特 別 討 厭 ， 而 是 因 為 他 的 大 腦 已 經 養</p>\n<p>成了一個 習 慣 ：在 事 情 發 生之前 ， 先把 所 有 可能 的 壞 結 果 預 演 一 遍 。 主 管 還沒 開 口 ， 他已 經 假 設</p>\n<p>對方會生 氣 ； 專案 還沒 開 始 ， 他已 經 想 像 它 會 失 敗 。</p>\n<p>這種「預 演式焦 慮 」 讓 他精 疲 力 竭 。 他 說 ： 「 我好 像每 天 都 在 跑 一 場 永 遠 不 會 結 束 的 馬 拉 松 ， 但 終</p>\n<p>點線一直在 退後 。 」</p>\n<p>心理學家發 現 ，焦 慮 的 本 質 其 實 不是 「 敵 人 」 ， 是 「 過 度 盡 責 的 保 護 者 」 。 你 的 大 腦 在 試 圖 保 護</p>\n<p>你，只是 它 的方式 太 激 烈 了 —— 它 用 一 百 種 災 難 劇 本 來 提 醒 你 「 要小心 」 。 問題 是 ， 當 這 個 保 護 者</p>\n<p>每天二十四小 時 值 班 ， 你 就 沒 有 休 息 的 時 間 了 。</p>\n<p>我後來給 阿 凱 一 個 方法 ， 我 稱 之 為 「 焦 慮 音 量 調 節 」 。 不是 消 除 焦 慮 ， 是 調 低 它 的 音 量 。</p>\n<p>第一步，「 命名 它 」 。 當 焦 慮 來 的 時 候 ， 不要 說 「 我 很 煩 」 ， 要 具 體 地 說 ： 「 我 現 在 感 覺 到 的 是 『 對</p>\n<p>未知的恐 懼 』 」 ，或 者 「 我 現 在 感 覺 到 的 是 『 怕 被 評 價 的 緊 繃 』 」 。 命 名 會 讓 模 糊 的 巨 大 怪 物 ， 變 成</p>\n<p>可以被看 見 的具體 對 象 。</p>\n<p>第二步，「問 它 」 。 對 你 的 焦 慮 說 ： 「 謝謝 你 想保 護 我 ， 但 這 個 危 險 是 真 實 的， 還 是 想 像 的 ？ 」 阿 凱</p>\n<p>發現，他百分之 八 十 的 焦 慮 ， 都 來 自 「 還沒 發 生 的 事 」 。 當 他 開 始 區 分 「 真 實 的 危 險 」 和 「 想 像 的</p>\n<p>危險」，他 的焦 慮 音 量就 降 了 一 半 。</p>\n<p>第三步，「 給 它 時 間 」 。 每 天 設 定 一 個 十五 分 鐘 的 「 焦 慮 時 間 」 ， 在 這 十五 分 鐘 裡 ， 你可以 盡 情 擔</p>\n<p>心、盡情 預 演 、 盡 情 害 怕 。 但十五 分 鐘 一 到 ， 就 關 上 那 台 收 音 機 。 其 他 時 間當 焦 慮 來 敲 門 ， 你告</p>\n<p>訴它：「現在不是 焦 慮 時 間 ， 我 們 下 午 四 點 見 。 」 這 聽 起 來 很 蠢 ， 但 它 有 效 —— 因 為 你在 重 新 奪 回 控</p>\n<p>制權。</p>\n<p>11阿凱做了三 個 月後告 訴 我 ： 「 我 發 現 焦 慮 不 會 消 失 ， 但 我 學 會 了不 讓 它 當  DJ 。 它 可以在 背 景播</p>\n<p>放，但我不 再 跟著 它 的 節 奏 跳舞 了 。 」</p>\n<p>焦慮不是壞掉了 。是你 的 保 護 系 統 太 過 盡 責 。 擴 容 不是 關 掉 背 景音 ， 是 學 會 在 它 播 放 的 同 時 ， 還</p>\n<p>能聽見自 己 的聲 音 。</p>\n<p>【80 字摘要】  當焦 慮 從 警 報 變 成 背 景音 ， 我 們 往往 誤 以 為 自 己 壞 掉 了 。 但 焦 慮 的 本 質 是 過 度 盡 責 的 保 護 者 。 透</p>\n<p>過「焦慮 音量 調 節 」 三 步 驟 —— 命 名 、 提 問 、 給 它 時 間 —— 重 新 奪 回 控 制 權 ， 讓 擴 容 發 生在 與 背 景音 共 處 的 過 程</p>\n<p>中。</p>\n<p>【五個關鍵字】  焦 慮 、 背 景音 、 預 演 式 焦 慮 、 焦 慮 音 量 調 節 、 情 緒 調 節</p>\n<p>12</p>"},
  {id:4, dim:"dim1", title:"職 業 倦 怠 不是 懶惰 ， 是 靈 魂 的 罷 工通知", summary:"當你 每 天 早 上 進 辦 公 室 前要在 車 裡 坐 十 分 鐘 才 有 力 氣 按 電 梯 ， 當 你 對 曾 經 熱 愛 的 工作 感", content:"<p>第 4 篇： 職 業 倦 怠 不是 懶惰 ， 是 靈 魂 的 罷 工通知</p>\n<p>當你 每 天 早 上 進 辦 公 室 前要在 車 裡 坐 十 分 鐘 才 有 力 氣 按 電 梯 ， 當 你 對 曾 經 熱 愛 的 工作 感</p>\n<p>到麻木，你不是 懶惰 ， 你是 倦 怠 了 。 職 業 倦 怠 有 三 個 核 心 症 狀 ： 情 緒 耗 竭 、 去 人 格 化 、 成 就感 降</p>\n<p>低。透過 「 倦 怠 修 復 三 階 段 」 ， 讓 靈 魂 從 罷 工 狀 態 慢慢 復 工 。</p>\n<p>週一早上 八點四 十五 分 ， 你 把 車 停 在 辦 公大 樓 的 地下 停 車 場 ， 熄 了 火 ， 坐 在 駕駛 座 上 。 你知道 再</p>\n<p>過十五分 鐘就要打 卡 了 ， 但 你 動 不了 。 你 滑 著 手 機 ， 看 著 沒 有 意 義 的 短 影 片 ， 只 是 想 拖 延 那 個 走</p>\n<p>進辦公室 的 時刻 。 這 已 經 是你 連 續 第 三 十 七 天 這 樣 了 。</p>\n<p>你不是懶惰 。你以前 比 誰 都 拚 。 但 現 在 ， 那 個 「 拚 」 的 開 關 好 像 被 拔 掉 了 。</p>\n<p>這就是職 業倦 怠 。 心理 學 家  Christina Maslach 研究 倦 怠 數 十 年 ， 提出三 個 核 心 症 狀 ： 情 緒 耗 竭</p>\n<p>（感覺被 掏空） 、 去 人 格 化（ 對 工作 對 人 變 得 冷 漠 、 嘲 諷 ） 、 成 就感 降 低 （ 覺 得 自 己 做 什 麼 都 沒 有</p>\n<p>意義）。如果你三 個 症 狀 都 有， 你不是 「 需 要 休 息 一 週 」 ， 你是 需 要 「 重 新 檢 視這 份 工作 與 你 的 關</p>\n<p>係」。</p>\n<p>我認識一 個 護理 師 ， 她 在 急 診 室 做 了 八 年 。 她 說 ： 「 一 開 始 我 會 為 了 救 活 一 個 病 人 哭 。 後 來 我 變 得</p>\n<p>面無表情 。 現在 ， 我 連 哭 都 哭 不出 來 了 。 」 這 不是 她 變 得 冷 血 ， 是 她 的 情 感 系 統 為 了自 保 ， 關機</p>\n<p>了。</p>\n<p>職場裡的倦 怠 往往 被 誤 解 為 「 抗 壓 性不 足 」 。 主 管 會 說 ： 「 大家 都 累 ， 為 什 麼 只 有 你 撐 不 住 ？ 」 但</p>\n<p>倦怠不是 個人 的缺 陷 ， 是系 統 的 警 訊 。 當 一 個 人 長 期 處 於 「 高要 求 、 低 控 制 、 低 回 饋 」 的 環 境 ，</p>\n<p>倦怠就會發生 。 它 是 靈 魂 的 罷 工通知 —— 不是 因 為 你 懶 ， 是 因 為 你 的 付 出 與 回 報 長 期 失 衡 。</p>\n<p>修復倦怠 ，我 認 為 有 三 個 階 段 ， 不是 速效 藥 ， 是 緩 慢 的 重建 。</p>\n<p>第一階段 ： 「 承 認 罷 工 」 。 不要 再 用 「 我 只 是 有 點 累 」 來 搪 塞 。 對 自 己 誠 實 地 說 ： 「 我 倦 怠 了 。 」 這</p>\n<p>句話很有力量 ， 因 為 它 把 問題 從 「 我不好 」 轉 移 到 「 我 需 要 改 變 」 。 你可以 寫 下三 個 跡 象 ， 證 明自</p>\n<p>己正在倦 怠 ： 例如 「 我 對 同 事 的 玩 笑 不 再 笑 」 、 「 我 週 日 晚 上 會 失 眠 」 、 「 我 覺 得 自 己 做 的 事 像 丟 進</p>\n<p>黑洞」。</p>\n<p>第二階段 ： 「 找到 洩 洪 口 」 。 倦 怠 是情 緒 的 水 庫 滿 了 ， 需 要 洩 洪 。 但 洩 洪 不是 「 去 渡 假 」 這 麼 簡 單</p>\n<p>——很多人 渡 假回 來 更 空 虛 ， 因 為 問題 還 在 。 真 正 的 洩 洪 是 「 做 一 件 讓 你 感 覺 『 這 是我 』 的 事 」 。</p>\n<p>也許是畫畫 、也 許 是 煮 飯 、 也 許 是 散 步 。 重 點 不是 「 放 鬆 」 ， 是 「 重 新 連 結 自 己 」 。</p>\n<p>第三階段 ： 「 談判 復 工 條 件 」 。 當 你 準 備 好回到工作 ， 不要 直 接 跳 回全 速 運 轉 。 和主 管 談 判 （ 或 和</p>\n<p>自己談判） ， 調 整 工作 量 、 調 整 邊 界 、 調 整 期 待 。 也 許 是 暫 時 不接 新 專 案 ， 也 許 是 每 天多 留 一 小 時</p>\n<p>給自己。 復工不是 立 刻 恢 復 百 分之 百 ， 是 從 百 分之 六 十 開 始 ， 慢慢 加 速 。</p>\n<p>13那個護理師後 來 轉 調 到 門 診 部 ， 薪 水少 了 ， 但 她 說 ： 「 我 第 一 次 感 覺 到 ， 我能 夠 再 次 為 一 個 微 笑 而</p>\n<p>感動了。 」 她 的容 器 沒 有 變 大 ， 但 她 終 於 停 止 讓 它 繼續 漏 水 。</p>\n<p>職業倦怠不是 懶惰 ， 是 靈 魂 在 說 ： 「 這 樣 的 交 換 條 件 ， 我不 幹 了 。 」 擴 容 的 第 一 步 ， 是 聽 見 這 個 罷</p>\n<p>工通知，然後重 新 談 判 。</p>\n<p>【80 字摘要】  職 業 倦 怠 的 三 個 核 心 症 狀 是情 緒 耗 竭 、 去 人 格 化 與 成 就感 降 低 ， 它 不是 個 人 缺 陷 而 是系 統 警 訊 。</p>\n<p>透過「倦 怠 修 復三 階 段 」 —— 承 認 罷 工 、 找 到 洩 洪 口 、 談 判 復 工 條 件 —— 讓 靈 魂 從 罷 工 狀 態 慢慢 復 工 。</p>\n<p>【五個關鍵字】  職 業 倦 怠 、 Christina Maslach 、 情 緒 耗 竭 、 倦 怠 修 復 、 靈 魂 罷 工</p>"},
  {id:5, dim:"dim1", title:"悲 傷 的後 座 力 ： 那些 沒 有 說 出 口 的 再 見", summary:"職 場 裡 的 離 別 —— 部 屬 離 職 、 專 案 結 束 、 團 隊 解 散 —— 往往 沒 有 儀 式 ， 所以 悲 傷 沒 有 出", content:"<p>第 5 篇： 悲 傷 的後 座 力 ： 那些 沒 有 說 出 口 的 再 見</p>\n<p>職 場 裡 的 離 別 —— 部 屬 離 職 、 專 案 結 束 、 團 隊 解 散 —— 往往 沒 有 儀 式 ， 所以 悲 傷 沒 有 出</p>\n<p>口。當你發 現自 己 對 「 結 束 」 變 得 麻 木 ， 也 許 只 是 因 為 你 從 未 允 許 自 己 好好 說 再 見 。 透 過 「 微 型 告</p>\n<p>別儀式」， 為 每 一 個 重 要 的 結 束 畫 一 個 句 點 。</p>\n<p>帶了兩年 的部 屬 遞 上 辭 呈 的 那 一 刻 ， 你 感 覺 心 裡 某 個 地方 塌 了 一 塊 。 但 你 的 第 一 反 應 是 笑 著 說</p>\n<p>「恭喜」，然後 轉 身 走 進會 議 室 ， 繼續 下 一 場 會 議 。 你 沒 有 哭 ， 甚 至 沒 有 感 覺 到 悲 傷 。 只 是 那 天 晚</p>\n<p>上開車回家 ，等 紅 燈 的 時 候 ， 突 然 發 現 自 己 的 手在方 向 盤 上微微 發 抖 。</p>\n<p>職場裡的離 別 ， 從 來 不 給 你 時 間 悲 傷 。 部 屬 離 職 ， 你 立 刻 要 找 人 交 接 ； 專 案 結 束 ， 隔 天 就 要 投 入</p>\n<p>下一個； 團 隊解散 ， 你 還 得 強 打精 神 安 慰 別 人 。 沒 有 葬 禮 ， 沒 有 紀 念 儀 式 ， 甚 至 連 一 張 「 謝謝 你 」</p>\n<p>的卡片都 沒 有。 結 束 來 得 突 然 ， 而 我 們 被期 待 立 刻 翻 頁 ， 裝 作 什 麼 都 沒 發 生 。</p>\n<p>心理學家  William Worden 提出 「悲 傷 四任 務 」 ： 接 受 失落 、 經 歷 痛苦 、 適 應 新 環 境 、 將 情 感重</p>\n<p>新投注。他 說 ， 悲 傷 不是 線 性 的， 而 是 反 覆 的。 你可能以 為 自 己 已 經 好了 ， 但 某 個 下 午 ， 聽 到 一</p>\n<p>首歌，看到 一 個熟 悉 的 場 景 ， 那 股 難 過 會 突 然 回 來 ， 毫 無 預 警 。</p>\n<p>我想起一位 產品 經 理 ， 他 帶 了三年 的 團 隊 被 併 入 另 一 個 部 門 。 他 表 現 得 很 專 業 ， 「 這 是 組 織 的 最 佳</p>\n<p>決策」。但三 個 月 後 ， 他 發 現 自 己 對 新 團 隊 完 全提不 起 勁 。 他 說 ： 「 我以 為 我 適 應 了 ， 但 原 來 我 只</p>\n<p>是把悲傷關在門外 ， 假 裝 它 不 存 在 。 」 直 到 某 天 ， 他 在 舊 辦 公 室 樓 下 買 咖 啡 ， 聽 到 熟 悉 的 笑 聲 ，</p>\n<p>眼淚才終於掉下 來 。 那 一 刻 ， 他才 終 於 承 認 ： 「 我 很 想 念 他 們 。 」</p>\n<p>職場悲傷 有三 種 隱 形形 式 。 第 一 種 是 「 未 完 成 的 道 別 」 —— 那 句 「 謝謝 你 」 沒 說 出 口 ， 那 個 擁 抱 沒</p>\n<p>有給出去 ， 那 個 「 我 會 想 你 」 被 你 硬 生生 吞 回 去 。 第二 種 是 「 被 否 認 的 依 戀 」 —— 你以 為 「 只 是同</p>\n<p>事」，但兩年 來 一 起 加 班 、一 起 救 火 、一 起 罵 主 管 的 時 光 ， 不是 「 只 是 」 可以 帶 過 的。 第 三 種 是</p>\n<p>「沒有儀式 的 結束 」 —— 沒 有 告 別 式 ， 沒 有 閉 幕 ，一 切 戛 然而 止 ， 讓 你 的 情 感 懸 在 半 空 中， 找 不到</p>\n<p>著陸點。</p>\n<p>14我們的文化不 擅 長 道 別 。 我 們 被教 導 要 「 向 前看 」 ， 「 不要 沈 溺 在 過 去 」 。 但 心理 學 告 訴 我 們 ， 未 被</p>\n<p>處理的悲 傷不會消 失 ， 它 只 是 被 封 存 ， 然 後 在 未 來 某 個 意 想 不到 的 時 刻 ， 以更 強 烈 的 姿 態 回 來 。</p>\n<p>如果你也正在 經 歷 一 場 「 沒 有 儀 式 的 結 束 」 ， 我 想 邀 請 你 做 一 件事 ： 寫 一 張 只 有 你自 己 會 看到 的 卡</p>\n<p>片。給那 個離職 的 部 屬 、 給 那 個 結 束 的 專 案 、 給 那 個 解 散 的 團 隊 。 寫 下 「 謝謝 你 教 會 我 的 事 」 、</p>\n<p>「我會想 念 的 時刻 」 、 「 我 因 為 你 而 改 變 的 地方 」 。 不 需 要 寄 出 ， 這 張 卡 片是 給 你自 己 的。 它 的 目 的</p>\n<p>不是聯繫對方 ，是 為 你 的 悲 傷 創 造 一 個 出 口 。</p>\n<p>你也可以 創 造 一 個 「 微 型 告 別 儀 式 」 。 也 許 是在最 後 一 次 團 隊 聚 餐 後 ， 獨 自 走 回 辦 公 室 ， 在 那 個 曾</p>\n<p>經一起開會 的會 議 室 門 口 站 一 分 鐘 ， 說 一 聲 「 再 見 」 。 也 許 是 把 專 案 結 案 的 文 件 夾 上 ， 貼 一 張 便 利</p>\n<p>貼，寫下 「這 段路 ， 謝謝 」 。 也 許 只 是在心 裡 ， 允 許 自 己 說 ： 「 這 一 次 的 結 束 ， 我 真 的 很 難 過 。 」</p>\n<p>悲傷不是 軟 弱 。能 夠 為 一 段 關 係 、一 個 團 隊 、一 個 專 案感 到 難 過 ， 說 明你 真 正 投 入了 。 那些 你以</p>\n<p>為「只是工作 」 的 時 刻 ， 其 實 都 是你生 命 中 真 實 存 在 過 的 光 亮 。</p>\n<p>那些沒有 說出口 的 再 見 ， 不 會 因 為 你不 說 就消 失 。 它 們 會 留 在你 的 身 體 裡 ， 變 成 某 種 說 不出 來 的</p>\n<p>悶。擴容 ，是 允 許 自 己 好好 說 再 見 。 不是 為 了 留 在 過 去 ， 是 為 了 帶 著 過 去 給 你 的 養 分 ， 走向 下 一</p>\n<p>個開始。</p>\n<p>你的容器不 需要 永 遠 堅 強 。有 時 候 ， 擴 容 是 讓 自 己 脆 弱 ， 讓 自 己 想 念 ， 讓 自 己 為 那些 沒 有 儀 式 的</p>\n<p>結束，補上 一 個 屬 於 自 己 的 句 點 。</p>\n<p>【80 字摘要】職 場 離 別 往往 沒 有 儀 式 ， 導 致 悲 傷 沒 有 出 口 。 透 過 「 微 型 告 別 儀 式 」 —— 寫 一 張 卡 片 、 創 造 一 個 私</p>\n<p>人道別時 刻 —— 為 未 完 成 的 道 別 畫 上 句 點 ， 讓 擴 容 發 生在 承 認 脆 弱 與 好好 說 再 見 的 過 程 中。</p>\n<p>【五個關 鍵字】職 場 悲 傷 、 William Worden 、 悲 傷 四任 務 、 微 型 告 別 儀 式 、 情 緒 擴 容</p>"},
  {id:6, dim:"dim1", title:"嫉妒是 鏡 子 ： 當 你 羨 慕 別 人 時 ， 其 實 在看 見 自 己 的 渴 望", summary:"當你 嫉妒 同 事 升 遷 、 嫉妒 朋 友 創 業 成 功 ， 你以 為 自 己 在 恨 別 人 ， 其 實 你在看 見 自 己 還沒", content:"<p>第 6 篇： 嫉妒是 鏡 子 ： 當 你 羨 慕 別 人 時 ， 其 實 在看 見 自 己 的 渴 望</p>\n<p>當你 嫉妒 同 事 升 遷 、 嫉妒 朋 友 創 業 成 功 ， 你以 為 自 己 在 恨 別 人 ， 其 實 你在看 見 自 己 還沒</p>\n<p>活出的部分 。 嫉妒 不是 敵 人 ， 是地 圖 。 透 過 「 嫉妒 解 碼 」 三 步 驟 ， 把 嫉妒 轉 化成自我 認識 的 線 索 。</p>\n<p>公司內網公告 欄上 ， 同 期 同 事 的 名 字 出 現 在 升 遷 名 單 裡 。 你 笑 著 走 過 去 恭 喜 他 ， 拍 了 拍 他 的 肩 膀</p>\n<p>說「太棒了 ，請客 」 。 他 笑 著 答 應 。 你 轉 身 走 回 座 位 ， 臉 上 的 笑 容 像 退 潮 一 樣 消 失 。 你 盯 著 螢 幕 ，</p>\n<p>心裡有一 個聲 音很 小 聲 地 說 ： 「 憑 什 麼 是 他？ 」</p>\n<p>那個聲音 讓你感到 羞 恥 。 你 覺 得 自 己 是 個 糟 糕 的 人 ， 怎 麼 可以 這 麼 「 見 不 得 別 人好 」 。 你 迅 速把那</p>\n<p>個聲音壓下去 ，告 訴 自 己 「 我是 為 他 高 興 的 」 。 但那 天 晚 上 ， 你 躺 在 床 上 ， 那 個 問題 像 壞 掉 的 燈 管</p>\n<p>一樣閃爍 ： 「 為 什 麼 是 他 ， 不是我 ？ 」</p>\n<p>15哲學家  Søren Kierkegaard 說 過 一 句 很 重 的 話 ： 「 嫉妒 是 一 種 自我 揭 露 。 」 它 不是 關 於 別 人 ， 而 是</p>\n<p>關於你自 己 。 當你 嫉妒 某 個 人 ， 其 實 是在 說 ： 「 他 擁 有的， 是我 想 要 但 還沒 有 勇 氣 追 求 的。 」 心理</p>\n<p>學家  Melanie Klein 進 一 步指 出 ， 嫉妒 的 根 源 往往 是我 們 把 自 己 否 認 的 部分 「 投 射 」 到 別 人 身 上</p>\n<p>——那個 敢於 冒 險 的 自 己 、 那 個 敢 於 爭 取 的 自 己 、 那 個 敢 於 成 功 的 自 己 。</p>\n<p>嫉妒有三 個 層次 。 最表 層 是 「 敵 意 」 —— 你 想 拉 下 對 方 ， 希 望 他 的 成 功只 是 運 氣 ， 希 望 他 遲 早 會 失</p>\n<p>敗。這一 層 很痛 ， 因 為 它 讓 你 感 覺 自 己 是 一 個 「 壞 人 」 。中 間 層 是 「 渴 望 」 —— 你其 實 不 想 成 為</p>\n<p>他，你想成 為 的是 「 擁 有 那 種 特 質 的 自 己 」 。 也 許 你 嫉妒 的 不是 他 的 升 遷 ， 而 是 他 敢 於 爭 取 的 勇</p>\n<p>氣。最底 層是 「 線 索 」 —— 嫉妒 是 一 張 地 圖 ， 標 示 著 你 內 心最 真 實 的 渴 望 。</p>\n<p>我認識一 個工程 師 ， 他 每 次看 見 別 人 創 業 就 會 不 舒 服 。 他 以 為 自 己 是 「 務 實 」 ， 看不 起 那些 「 不 切</p>\n<p>實際」的人 。 但在 一 次 深 度 對 話 中， 他 終 於 承 認 ： 「 我其 實 也想 試試 看 ， 但 我 怕 失 敗 。 」 他 的 嫉妒</p>\n<p>不是針對 創 業者 ， 是 他 把 自 己 「 想 冒 險 」 的 那 部分 壓 抑 得 太深 ， 深 到 只 能用 「 看不 起 」 來 防 衛 。</p>\n<p>嫉妒的問題不在於 它 存 在 ， 而 在 於 我 們 不 承 認 它 。 當 你 把 嫉妒 推 開 ， 你 也 推 開 了 它 想 告 訴 你 的</p>\n<p>事。當你 願意看著 它 ， 問 ： 「 我 嫉妒 他 什 麼 ？ 」 你 就 開 始 了 一 場 自我 對 話 。</p>\n<p>如果你也被 嫉妒 纏 身 ， 我 想 邀 請 你 做 一 個 「 嫉妒 解 碼 」 。 寫 下三 個 步 驟 。 第 一 步 ： 「 我 嫉妒 他 什</p>\n<p>麼？」具體 寫出 來 ， 不是 「 他 運 氣 好 」 ， 而 是 「 他 敢 於 在 會 議 上表 達 不同意 見 」 。 第二 步 ： 「 這 代 表</p>\n<p>我在乎什 麼？ 」也 許 你在 乎 的 不是 「 表 達 意 見 」 這 件事 ， 而 是 「 被 聽 見 的 感 覺 」 或 是 「 敢 於 冒 險</p>\n<p>的自己」 。第三 步 ： 「 我可以在 哪 裡 開 始 ？ 」 不 需 要 立 刻 創 業 或 升 遷 ， 也 許 是下 週 會 議 上 說 一 句</p>\n<p>話，也許是 報名 一 個 你 一 直感 興 趣 的 課 程 。</p>\n<p>嫉妒不是 敵人 ， 它 是你最 誠 實 的 指 南 針 。 當 你 學 會 讀 懂 它 ， 你 就 會發 現 ： 每 一 次 嫉妒 ， 都 是 一 次</p>\n<p>認識自己 的機會 。 那些 你以 為 的 「 負 面情 緒 」 ， 其 實 都 是 內 在 的 訊 號 ， 指向 你 還沒 活出 的 那 個 自</p>\n<p>己。</p>\n<p>擴容不是 讓自 己 沒 有 嫉妒 ， 而 是 讓 嫉妒 成 為 你 的 朋 友 。 當 你 再 次 感 到 那 種 酸 澀 的 時 候 ， 不要 急著</p>\n<p>壓下去。 停下 來 ， 問問 自 己 ： 「 這 一 次 ， 它 在告 訴 我 什 麼 ？ 」 你 會發 現 ， 嫉妒 的 盡 頭 ， 不是 別 人 的</p>\n<p>成功，是你自 己 的 可能性 。</p>\n<p>【80 字摘要】 嫉妒 不是 敵 人 而 是自我 揭 露 的 線 索 ， 反 映 了我 們 壓 抑 的 渴 望 。 透 過 「 嫉妒 解 碼 」 三 步 驟 —— 辨 識 嫉</p>\n<p>妒的對象 、發 現內 在在 乎 的 價 值 、 找 到 開 始 行 動 的 起 點 —— 將 嫉妒 轉 化 為 自我 擴 容 的 地 圖 。</p>\n<p>【五個關 鍵字】 嫉妒 、 Søren Kierkegaard 、 Melanie Klein 、 自我 揭 露 、 投 射 認 同</p>\n<p>16</p>"},
  {id:7, dim:"dim2", title:"當 「 夠好了 」 成 為 詛 咒 ： 完 美主 義 者 的 低 壓 擴 容", summary:"第 7 篇： 當 「 夠好了 」 成 為 詛 咒 ： 完 美主 義 者 的 低 壓 擴 容 凌晨兩點 十 七分 ， 你 的 檯 燈 還 亮 著 。 那 份 明天要 交 的 簡 報 ， 已 經 改 了 第 七 版 。 第 三版 的 時 候 ，...", content:"<p>第 7 篇： 當 「 夠好了 」 成 為 詛 咒 ： 完 美主 義 者 的 低 壓 擴 容</p>\n<p>凌晨兩點 十 七分 ， 你 的 檯 燈 還 亮 著 。 那 份 明天要 交 的 簡 報 ， 已 經 改 了 第 七 版 。 第 三版 的 時 候 ， 主</p>\n<p>管說「可以了 」 ； 第 五 版 的 時 候 ， 你自 己 覺 得 「 差 不多了 」 ； 但 你 的 手 指 還 在 鍵 盤 上 遊 走 ， 調 整 著</p>\n<p>一個圖表 的 間距 ——0.3 公分 改 成  0.25 公分 ， 再改 成  0.28 公分 。</p>\n<p>你其實知道 沒 有人 會 注意到 那  0.03 公分 的 差 異 。 但 你 就 是 停 不下 來 。 因 為 在你 的 腦 海 裡 ，有一 個</p>\n<p>聲音在說 ： 「如果不 做 到 完 美 ， 就代 表你不 夠 好 。 」</p>\n<p>這個聲音 從 哪 裡 來 的 ？也 許 是 國 中 時 那 次 考 了 九 十 八 分 ， 父 親 問 「 那 兩 分 去 哪 裡 了 」 ； 也 許 是 第 一</p>\n<p>次工作簡 報 時 ，某 個 前 輩 隨 口 說 「 這 個 顏 色 配 得 不 太 對 」 ； 也 許 只 是你 從 小 就 學 會 了 ， 只 有 「 完</p>\n<p>美」才能 換 來愛與 安全 。</p>\n<p>完美主義不是 追求 卓 越 。 完 美主 義 是 一 種 「 條 件 式自我接 納 」 —— 我 只 有 在 做 到 一 百 分 的 時 候 ， 才</p>\n<p>允許自己存在 。</p>\n<p>心理學家  Brené Brown 說 過 一 句 很 重 的 話 ： 「 完 美主 義 不是自我提 升 的 工 具 ， 它 是自我 毀 滅 的 工</p>\n<p>具。」她花了二 十 年 研究 那些 「 看 起 來 很 完 美 」 的 人 ， 發 現 一 個 驚 人 的 共 同 點 ： 完 美主 義 者其 實</p>\n<p>並不追求卓 越 ，他 們 追 求 的 是 「 避 免被 批 評 」 。 每 一 個 反 覆 修改 的 深 夜 ， 每 一 次 「 還 不 夠 好 」 的 自</p>\n<p>我否定， 背後 的 動 機 都 不是 「 我 想做得 更好 」 ， 而 是 「 我不 想被 發 現 我不 夠 好 」 。</p>\n<p>這是一種 防 禦機制 。 我 們 用 完 美主 義 築 起 一 道 牆 ， 以 為 牆 內 就 安全了 。 但  Brown 發 現 ， 那 道 牆 同</p>\n<p>時也擋住了 創意 、 擋 住 了 效 率 、 擋 住 了人 與 人之 間 真 實 的 連 結 —— 因 為 沒 有 人能 靠 近 一 個 「 永 遠 正</p>\n<p>確」的人 。</p>\n<p>我認識一 個 設 計 師 ， 叫 她 小安 。 小安 的 作品 永 遠 精 緻 ， 客 戶滿 意度 極 高 ， 但 她 從 不 準 時 交件 。 每</p>\n<p>次專案截 止前 ， 她 都 會 消 失 兩 天 ， 把 自 己 關 在工作 室 裡 ， 反 覆 調 整 一 個 客 戶 根 本不 會 注意到 的 細</p>\n<p>節。有一次 ， 她 因 為 延 遲 交件 失 去 了 一 個 大客 戶 。 她 哭 著 跟 我 說 ： 「 我知道我 應 該 準 時 ， 但 我 就 是</p>\n<p>做不到讓 它不 夠好 。 」</p>\n<p>我問她：「如果這 個 作品是 別 人 做 的， 你 會 覺 得 它 不 夠 好 嗎 ？ 」</p>\n<p>她愣了一下 ， 說 ： 「 不 會 ， 我 會 覺 得 很 棒 。 」</p>\n<p>你看，我 們對自 己 殘 忍 的 程 度 ， 遠 超 過 對 任何 人 的 標 準 。</p>\n<p>完美主義在職 場 裡 有 三 個 偽 裝 ， 讓 人 很 難 察 覺 。 第 一 個 偽 裝 是 「 我 只 是要 求 高 」 。 但 要 求 高是 對 事</p>\n<p>的標準，完美主 義 是 對 人 的 懲 罰 。 你 會 因 為 別 人 沒 做 到 一 百 分 而 憤 怒 ， 也 會 因 為 自 己 沒 做 到 一 百</p>\n<p>分而羞恥 。要求高 讓 事 情更好 ， 完 美主 義 讓 人更 瘦 、 更 累 、 更 孤 獨 。</p>\n<p>17第二個偽裝是 「 細 節 決 定成 敗 」 。 細 節 確 實 重 要 ， 但 完 美主 義 者不是在 抓 「 關 鍵 細 節 」 ， 而 是在 抓</p>\n<p>「所有細 節 」 。你 花 了三小 時 調 整 頁 尾 的 字型 ， 卻 沒 有 時 間 確 認 數 據 的 正 確 性 。 這 不是 細 節 決 定成</p>\n<p>敗，這是 逃避 —— 用 低 風 險 的 瑣 事 ， 迴 避 高 風 險 的 決 策 。</p>\n<p>第三個偽裝是 「如果我 放 鬆 標 準 ， 就 會 變 爛 」 。 這 是 完 美主 義 者最大 的 恐 懼 。 但 真 相是 ： 當 你 允 許</p>\n<p>自己「夠好就好 」 ， 你 反而 會發 現 更多力 氣 去 處 理 真 正 重 要 的 事 。 擴 容 不是 把每 件事 塞 到 極 限 ， 而</p>\n<p>是讓容器 有 「 餘 裕 」 去 承 載 意外 。</p>\n<p>我後來給小安 一 個 練 習 ， 叫 做 「 80 分 實 驗 」 。 我 請 她 下 週選 一 件 「 不 會 影 響 生 死 」 的 工作 任 務 ，</p>\n<p>強迫自己在做到  80 分 的 時 候 就交 出 去 。 不是  90 分 ， 不是  95 分 ， 是  80 分 。</p>\n<p>她選了一個內部 報告 。 交 出 去 那 天 ， 她 焦 慮 到 胃 痛 ， 每 隔 半 小 時 就 檢 查 郵 件 ， 看 有 沒 有 人 批 評</p>\n<p>她。但什 麼事都 沒 有 發 生 。 主 管 回了 「 收到 」 ， 同 事 沒 有 異 議 ， 世界 沒 有 崩 塌 。</p>\n<p>三天後，她告 訴我 ： 「 我 發 現 ， 那  20 分 的 差 距 ， 只 有 我自 己 看 得 見 。 」</p>\n<p>這個實驗的目 的不是 讓 你 變 得 隨 便 ， 而 是 讓 你 的 神 經 系 統 習 慣 「 不 完 美 的 安全 」 。 就 像 肌 肉 需 要 適</p>\n<p>度的撕裂才能 長大 ， 你 的 自我接 納 也 需 要 適 度 的 「 失 誤 」 才 能 擴 容 。</p>\n<p>如果你也是 那 個 凌 晨 兩 點 還 在 調 整 間 距 的 人 ， 我 想 邀 請 你 試試 看 。 下 週 ， 選 一 件 小 事 ， 80 分 就放</p>\n<p>手。交出去之後 ， 記 錄 你 的 焦 慮 指 數 ， 觀 察 別 人 的 反 應 。 你 會發 現 ， 大多 數 人 根 本看不出 那  20 分</p>\n<p>的差異；而 那些看出 來 的 人 ， 往往 會 給 你 「 比 預 期 更 有 空 間 」 的 回 饋 —— 因 為  80 分 留 出 的 彈 性 ，</p>\n<p>反而讓協作成 為可能 。</p>\n<p>完美不是擴容 的 終點 ， 而 是 擴 容 的 障 礙 。 當 你 允 許 自 己 「 夠 好 就 好 」 ， 你 才真 正 騰 出了 空 間 ， 去容</p>\n<p>納那些不完美 但真 實 的 東 西 —— 創 意 、 失 敗 、 連 結 ， 以 及 成 長 。</p>\n<p>【80 字摘要】  完美主 義 不是 追 求 卓 越 ， 而 是用高 標 準 懲 罰 自 己 的 防 禦 機 制 。 透 過 「 80 分 實 驗 」 ， 讓 神 經 系 統 習 慣</p>\n<p>不完美的安全 ，在 餘 裕 中 騰 出 空 間 容 納 創 意 與 真 實 的 成 長 。</p>\n<p>【五個關鍵字】  完美主 義 、 Brené Brown 、 條 件 式自我接 納 、 80 分 實 驗 、 餘 裕</p>\n<p>18</p>"},
  {id:8, dim:"dim2", title:"你不是 懶 ， 你 只 是 還沒 找 到 值 得 燃 燒 的 事", summary:"第 8 篇：你不是 懶 ， 你 只 是 還沒 找 到 值 得 燃 燒 的 事 下午三點 十 七分 ， 辦 公 室 的 冷 氣 發 出 規 律 的 低 頻 聲 響 。 你 的 螢 幕 上 開 著 三 個  Excel 視 窗 、 兩 個 Po...", content:"<p>第 8 篇：你不是 懶 ， 你 只 是 還沒 找 到 值 得 燃 燒 的 事</p>\n<p>下午三點 十 七分 ， 辦 公 室 的 冷 氣 發 出 規 律 的 低 頻 聲 響 。 你 的 螢 幕 上 開 著 三 個  Excel 視 窗 、 兩 個</p>\n<p>PowerPoint 、一 個 還沒 回 覆 的  Email 。 滑 鼠 游 標 在 桌 面上 游 移 ， 像 一 隻 找 不到出 口 的 昆 蟲 。</p>\n<p>你其實不 累 。 昨 晚 睡 了 七 小 時 ， 午 飯 也 吃 了 ， 咖 啡 還 是 熱 的。 但 你 的 身 體 裡 有一 種 更 深 的 倦 怠 ——</p>\n<p>不是肌肉 的 痠痛 ， 是 某 種 「 做 什 麼 都 沒 有 意 義 」 的 沈 重 。 你 打 開 手 機 ， 滑 了 十 分 鐘 社 群 ， 看 見 別</p>\n<p>人曬專案成果 、 曬 升 遷 、 曬 週 末 的 登 山照 。 你 關 掉 螢 幕 ， 發 現 自 己 的  Excel 還 停 留 在同 一 格 。</p>\n<p>這種狀態 ，我 們通 常 稱 之 為 「 懶 」 。 但 真 的 是 嗎 ？</p>\n<p>我認識一 個年 輕人 ， 叫 他 阿 傑 好了 。 阿 傑 在 一 家 電 商 公司 做 營 運 ， 每 天 處 理 訂 單 、 回 覆 客 訴 、 優</p>\n<p>化報表。他 的主管 說 他 「 很 穩 定 」 ， 同 事 說 他 「 好相 處 」 ， 但 他 自 己 知道 ， 每 天下 班 走 進 捷 運 站 的</p>\n<p>那一刻，他會在 月 台 邊 緣 站 很 久 ， 看 著 軌 道 發 呆 ， 心 裡 想 著 ： 「 如果我 跳 下 去 ， 明天是不是 就 不用</p>\n<p>上班了？ 」</p>\n<p>他沒有憂 鬱 症 ， 至 少 醫 生 這 麼 說 。 他 只 是 「 什 麼 都 不 想做 ， 卻 什 麼 都 不 敢 不 做 」 。 他 試 過 早 起 運</p>\n<p>動、試過 番 茄 鐘工作法 、 試 過 斷 舍 離 ， 甚 至 試 過 把 辦 公 桌 換 成站 立 式 。 但那些 方法 都 像 貼 在 漏 氣</p>\n<p>輪胎上的 膠 帶 —— 暫 時 黏 住 了 ， 氣 還 是 慢慢 漏 。</p>\n<p>直到有一天 ，他在公司 倉 庫 看 見 一 個 老 師 傅 。 那 個 老 師 傅 負責 包 貨 ， 做 了 二 十 年 ， 每 天 把 同 樣 的</p>\n<p>商品放進同 樣 的 紙 箱 。 但 阿 傑 注意到 ， 老 師 傅 包 貨 的 時 候 會 哼 歌 。 不是 隨 便 哼哼 ， 是 完 整 的 旋</p>\n<p>律，有節 奏 、有 轉 音 。 他 問 老 師 傅 ： 「 你不 覺 得 無 聊 嗎 ？ 」 老 師 傅 說 ： 「 我在 比 賽 啊 。 看 今 天能不</p>\n<p>能比昨天快 兩 箱 ， 而 且 箱 子 折 得 更 漂 亮 。 」</p>\n<p>那一刻阿 傑 突然 哭 了 。 他 發 現 自 己 不是 懶 ， 他 只 是 從 來 沒 有 在 這 份 工作 裡 找 到 「 值 得 燃 燒 的 點 」 。</p>\n<p>他的身體 沒 有 壞掉 ， 他 的 心 只 是 迷 路 了 。</p>\n<p>心理學家  Daniel Pink 在 《 動 機 ， 單 純 的 力 量 》 裡 提出 一 個 後 來 被反 覆 驗 證 的 觀 點 ： 人 類 的 深 層</p>\n<p>動機來自三 個元 素 —— 自主（ Autonomy ） 、 專 精 （ Mastery ） 、 目 的 （ Purpose ） 。 當 這 三 個 元 素</p>\n<p>同時缺席 ，人會 陷 入 一 種 「 功 能性 麻 痺 」 ： 身 體 能 動 ， 但 靈 魂 不在 場 。</p>\n<p>這不是懶惰 ，這是 動 機 系 統 的 斷 電 。 而 斷 電 的 原 因 ， 往往 不是我 們 不 夠 努 力 ， 而 是我 們 努 力 的 方</p>\n<p>向，與內在 的 羅 盤 背 道 而 馳 。</p>\n<p>我特別喜 歡  Pink 說 的一 句 話 ： 「 獎 勵 與 懲 罰 能 讓 人 『 服 從 』 ， 但只 有 自主 、 專 精 與 目 的 能 讓 人 『 投</p>\n<p>入』。」當你發 現自 己 「 什 麼 都 不 想做 」 的 時 候 ， 其 實 是你 的 靈 魂 在 抗 議 —— 它 在 說 ： 「 你 給 我 的 任</p>\n<p>務，不值得我 燃 燒 。 」</p>\n<p>19後來我幫阿 傑做了 一 個 練 習 ， 叫 做 「 能 量 日 誌 」 。 不是 記 待 辦 事 項 ， 是 記 「 情 緒 溫 度 」 。 在 每 天 結</p>\n<p>束前，用 一句 話 寫 下 ： 「 今 天 哪 一 件事 讓 我 感 覺 時 間過 得 很 快？ 哪 一 件事 讓 我 感 覺 每 一 分 鐘 都 是 煎</p>\n<p>熬？」</p>\n<p>連續記錄兩 週 。你會發 現 ， 那些 「 時 間過 得 很 快 」 的 時 刻 ， 往往 具 備 某 個 共 同 的 元 素 —— 也 許 是 與</p>\n<p>人連結、也 許是解 決 難 題 、 也 許 是 創 造 某 個 具 體 的 東 西 。 那 個 元 素 ， 就 是你 的 「 燃 燒 點 」 。</p>\n<p>阿傑記了兩 週 ，發 現 他 唯 一 感 到 興 奮 的 時 刻 ， 是 幫 新 進 同 事解 答 問題 。 他 說 ： 「 我 發 現 我 喜 歡 教 別</p>\n<p>人，但我 的工作 裡 幾 乎 沒 有 這 個 部分 。 」</p>\n<p>接下來的三 個 月，他 沒 有 辭 職 。 他 在 現 有 工作 裡 ， 每 週 偷 五 個 小 時 ， 去做 那 件 「 燃 燒 點 」 相 關 的</p>\n<p>事。他主 動 申請 帶 新 人 、 主 動 整 理 一 份 內 部知 識 庫 、 主 動 在部 門 會 議 上分 享 一 個 小技 巧 。 他 要 的</p>\n<p>不是立刻 變大 ，而 是 讓 內 在 的 容 器 ， 習 慣 「 被 注入 熱 情 」 的 感 覺 。</p>\n<p>半年後，他 轉 調到教 育 訓 練 部 門 。 不是 因 為 他 「 找 到天 職 」 這 種 戲 劇 化 的 轉 折 ， 而 是 因 為 他 終 於</p>\n<p>承認：「我不是 懶 ， 我 只 是 需 要不同 的 燃 料 。 」</p>\n<p>如果你現在也 處於 那 種 「 什 麼 都 不 想做 卻 什 麼 都 不 敢 不 做 」 的 狀 態 ， 我 想 邀 請 你 做 一 件事 ： 這 個</p>\n<p>月，開始 寫能量 日 誌 。 不要 急著 轉 職 ， 不要 急著 報 名 什 麼 課 程 ， 就 只 是 記 錄 。 讓 數 據 告 訴 你 ， 你</p>\n<p>的靈魂在 哪 些 時刻 偷偷 亮 了 起 來 。</p>\n<p>你不是懶。你是 太 久 沒 有 被 點 燃 ， 以 至 於 忘 記 自 己 原 來 是可以 燃 燒 的。</p>\n<p>那個什麼都不想做 卻 什 麼 都 不 敢 不 做 的 午 後 ， 其 實 是你 的 靈 魂 在 輕 聲 說 ： 「 請 幫 我 換 一 個 燃 料 ， 好</p>\n<p>嗎？」</p>\n<p>【80 字摘要】  當你 陷 入 「 什 麼 都 不 想做 」 的 倦 怠 ， 別 急著 責 備 自 己 懶惰 。 這 可能是 動 機 系 統 的 斷 電 ， 而 非 意 志</p>\n<p>力的潰敗 。 透 過能 量 日 誌 辨 認 你 的 「 燃 燒 點 」 ， 在 現 有 崗 位 中 偷 時 間 實 驗 ， 讓 靈 魂 重 新 找 到 值 得投 入 的 燃 料 。</p>\n<p>【五個關鍵字】  職 涯 迷 惘 、 動 機 斷 電 、 低 壓 擴 容 、 能 量 日 誌 、 Daniel Pink</p>"},
  {id:9, dim:"dim2", title:"比 較心 態 ： 為 什 麼 我 們 總 是用 別 人 的 尺 量 自 己", summary:"社 群媒 體 讓 比 較 變 成 二 十 四 小 時 的 運動 。 但 比 較 心 態 偷 走 的 不 只 是 快 樂 ， 還 有 你 的 獨 特", content:"<p>第 9 篇： 比 較心 態 ： 為 什 麼 我 們 總 是用 別 人 的 尺 量 自 己</p>\n<p>社 群媒 體 讓 比 較 變 成 二 十 四 小 時 的 運動 。 但 比 較 心 態 偷 走 的 不 只 是 快 樂 ， 還 有 你 的 獨 特</p>\n<p>座標。透 過 「 座 標 校 準 」 練 習 ， 拿 回定 義 自 己 價 值 的 權 力 。</p>\n<p>睡前，你滑著手機 。 同 學 創 業 三年公司 估 值 破 億 ， 同 事 升 遷 為 部 門 主 管 ， 網 紅 朋 友 又 去 了 冰 島 看</p>\n<p>極光。你 往下 拉 ， 越 看 越 覺 得 自 己 的 人生 很 爛 。 你 關 掉 手 機 ， 閉 上 眼 睛 ， 心 裡 有一 個 聲 音 說 ： 「 為</p>\n<p>什麼他們都這 麼 厲 害 ， 而 我 …… 」</p>\n<p>這個場景 ， 每天都 在上 演 。 社 群媒 體 讓 比 較 從 「 偶 爾 」 變 成 「 二 十 四 小 時 全年 無 休 」 。 以前你 只 知</p>\n<p>道隔壁鄰 居 買了 新 車 ， 現 在你知道全 世界 的 人 過 得 多 精 彩 。 而 且 ， 他 們 只 讓 你看 見 精 華 —— 創 業 的</p>\n<p>榮耀，不 讓你看 見 半 夜 發 不出 薪 水 的 焦 慮 ；升 遷 的 光 環 ， 不 讓 你看 見 犧 牲 的 家 庭 時 間 ； 極 光 的 美</p>\n<p>照，不讓你看 見刷 爆 的 信用 卡 。</p>\n<p>21社會心理 學家  Leon Festinger 在 1954 年提出 「 社 會 比 較 理 論 」 ， 他 說 人 類 天生 就 有 比 較 的 傾 向 ，</p>\n<p>透過與他人比 較 來 評 估 自 己 的 能力和 觀 點 。 這 本 來 是 一 種 適 應 機 制 ， 但 在社 群媒 體 時 代 ， 這 個 機</p>\n<p>制被放大了 千百 倍 。 哲 學 家  Bertrand Russell 說 得 更 精 準 ： 「 乞 丐 不 會 嫉妒 富 翁 ， 但 會 嫉妒 收入</p>\n<p>更高的乞 丐 。 」我 們 只 跟 「 差 不多 」 的 人 比 ， 而 且 永 遠 往 上 比 。</p>\n<p>比較心態 有三 個 陷 阱 。 第 一 個 是 「 向 上 比 較 的 偏 誤 」 —— 你 只 跟 比 你好 的 人 比 ， 從 來 不看 比 你 差 的</p>\n<p>人。你三 十 歲 跟二 十五 歲 的 創 業 家 比 成 就 ， 跟 四 十 歲 的 執 行 長 比 歷 練 ， 你 永 遠 輸 。 第二 個 是 「 社</p>\n<p>群媒體的 策展幻 覺 」 —— 你看 見 的 都 是 別 人 精 心 挑 選 的 精 華 ， 不是 真 實 的 生活 。 第 三 個 是 「 把 不同</p>\n<p>當成不如 」 ——他 走 他 的 路 ， 你 走 你 的 路 ， 但 你以 為 他 的 路才 是 「 正 確 」 的 路 。</p>\n<p>我認識一 個 設 計 師 ， 她 每 次看到 別 人 的 作品 集就 覺 得 自 己 不 夠 好 。 她 說 ： 「 他 們 的 排 版好 有 創 意 ，</p>\n<p>我的作品看起 來好 普 通 。 」 但 當 我 請 她 列 出自 己 這 三年 的 成 長 ， 她 說 ： 「 我 學 會 了 動 態 設 計 、 帶 了</p>\n<p>一個實習生 、客 戶滿 意度 從 七 分提 升 到 九 分 。 」 那些 ， 都 是 無 法 被 「 比 較 」 的 獨 特 價 值 。</p>\n<p>比較偷走 的不 只是 快 樂 ， 還 有 你 對 自 己 的 認識 。 當 你 一 直 用 別 人 的 尺 量 自 己 ， 你 會 忘 記 自 己 本 來</p>\n<p>的形狀。你可能 很 會 傾 聽 ， 可能 很 會 整 合 ， 可能 很 會 把 複 雜 的 事 情 變 簡 單 —— 這 些 都 不 會 出 現 在 別</p>\n<p>人的履歷上 ， 但這 些 是你 的 獨 特 座 標 。</p>\n<p>如果你也 受困於比 較 ， 我 想 邀 請 你 做 一 個 「 座 標 校 準 」 。 拿 出 紙 筆 ， 寫 下 兩 個 清 單 。 第 一 個 ： 「 我</p>\n<p>的三個獨特 優 勢 」 —— 不是 跟 別 人 比 的 優 勢 ， 是 「 只 有 我 做得 來 」 的 事 。 第二 個 ： 「 我 這 一 年 學 會</p>\n<p>了什麼」 —— 哪怕 是 很 小 的 事 ， 像 是 「 學 會 了 拒 絕 」 、 「 學 會 了在 會 議 上表 達 意 見 」 、 「 學 會 了不 再 熬</p>\n<p>夜加班」。這 些 ， 是你 真 正 的 成 長 軌 跡 。</p>\n<p>比較不會消 失 。 但 當 你 有 了自 己 的 座 標 ， 你 就 不 會 輕 易 被 別 人 的 地 圖 帶 偏 。 擴 容 不是 變 得比 別 人</p>\n<p>好，是認清 「好 」 的 定 義 有 千 百 種 ， 而 你正在 走 屬 於 自 己 的 那 一 種 。</p>\n<p>你的價值 ，不 需要 透 過 比 較 來 證 明 。 你 的 容 器 ， 本 來 就 不 需 要 跟 別 人 的一 樣 大 。 它 只需 要 足 夠 容</p>\n<p>納你正在成 為 的 那 個 人 。</p>\n<p>【80 字摘要】社 群媒 體 放 大社 會 比 較 ， 導 致向 上 比 較 偏 誤 與 自我 價 值 迷 失 。 透 過 「 座 標 校 準 」 練 習 ， 發 掘 個 人 獨</p>\n<p>特優勢與年度成 長 軌 跡 ， 拿 回定 義 自 己 價 值 的 權 力 ， 停 止 用 別 人 的 尺 量 自 己 的 人生 。</p>\n<p>【五個關 鍵字】比 較 心 態 、 Leon Festinger 、 社 群媒 體 、 座 標 校 準 、 自我 價 值</p>"},
  {id:10, dim:"dim2", title:"限制性信 念 ： 那些 你以 為 的 「 不可能 」 ， 只 是 還沒 試 過", summary:"「我不 適 合 帶 人 」 、 「 我 沒 有 創 意 」 、 「 我年 紀 太 大 學 不 動 了 」 —— 這 些 聲 音 不是 事 實 ， 是信", content:"<p>第 10 篇： 限制性信 念 ： 那些 你以 為 的 「 不可能 」 ， 只 是 還沒 試 過</p>\n<p>「我不 適 合 帶 人 」 、 「 我 沒 有 創 意 」 、 「 我年 紀 太 大 學 不 動 了 」 —— 這 些 聲 音 不是 事 實 ， 是信</p>\n<p>念。透過 「信 念 審 查 」 三 步 驟 ， 拆 掉 內 在 的 柵 欄 ， 讓 擴 容 從 質 疑 一 個 「 不可能 」 開 始 。</p>\n<p>22主管在會 議上問 ： 「 這 個 新 專 案 ， 誰 有 興 趣 帶 ？ 」 你 的 心 跳 漏 了 一 拍 。 腦 海 裡 閃 過 一 個 念 頭 ： 「 我</p>\n<p>可以試試看 。 」 但 下 一 秒 ， 另 一 個 更大 的 聲 音 蓋 過 了 它 ： 「 我不行 ， 我 沒 有 帶 過 團 隊 。 」 你 低 下</p>\n<p>頭，假裝在看 筆 記 。 會 議 結 束 後 ， 你 聽 見 被 指 派 的 那 個 同 事 興 奮 地 討 論 計 畫 ， 心 裡 有一 個 小小 的</p>\n<p>聲音說：「其 實 ， 我 也想 試試 看 。 」</p>\n<p>這就是限制性信 念 的 運 作方式 。 它 不是你 經 過 深 思 熟 慮 的 結 論 ， 是你 腦 海 裡 自 動 播 放 的 背 景音 。</p>\n<p>心理學家  Carol Dweck 在 《 心 態 致 勝 》 中 區 分了 「 成 長 型 思 維 」 與 「 固 定 型 思 維 」 ： 固 定 型 思 維</p>\n<p>認為能力是與生俱 來 的， 成 長 型 思 維 相信能力可以 透 過 努 力 發 展 。 限 制性信 念 ， 就 是 固 定 型 思 維</p>\n<p>的聲音 —— 「我天生 就 不 會 」 、 「 我 這 個 年 紀 來 不 及 了 」 、 「 我不 適 合 」 。</p>\n<p>認知行為 療法 稱這 些 為 「 自 動 化 思 考 」 —— 它 們 來 得 又 快 又 隱 蔽 ， 你 甚 至 來 不 及 質 疑 就已 經 相信</p>\n<p>了。但它 們 從 哪 裡 來 的 ？ 通 常 有 三 個來 源 。 第 一 個 是 「 童 年 標 籤 」 —— 「 你 數 學 不好 」 、 「 你 很 內</p>\n<p>向」、「你不 適合 當 領 導 」 。 這 些 話 可能 來 自 父 母 、 老 師 ， 你小 時 候 聽 進 去 了 ， 長 大 後 還 在 腦 海 裡 重</p>\n<p>播。第二 個是 「 過 去 失 敗 的 過 度推 論 」 —— 你 有一 次 簡 報 搞 砸 了 ， 就 推出 「 我不 適 合公 開 說 話 」 。</p>\n<p>但一次失 敗 ，不等 於 永 遠 失 敗 。 第 三 個 是 「 他 人 的 無 心 評 價 」 —— 某 個 前 輩 隨 口 說 「 你 比 較 適 合 做</p>\n<p>執行」，你就 把這 句 話 當 成了人生 劇 本 。</p>\n<p>我認識一 個 財 務分 析 師 ， 她 從 來 不 申 請 管 理 職 ， 因 為 她 「 確 定 」 自 己 不 適 合 帶 人 。 但 當 我 們 做 了</p>\n<p>一次「信 念 審查 」 ， 她 發 現 這 個 信 念 來 自高 中 時 導 師 的一 句 話 ： 「 妳 比 較 適 合 一 個 人 做事 。 」 那 句</p>\n<p>話她記了 十五年 ， 從 來 沒 有 質 疑 過 。 她 後 來 申 請 了 一 個 小 專 案 的 小 組 長 ， 三 個 月 後 告 訴 我 ： 「 我 發</p>\n<p>現我其實 很喜 歡 帶 人 ， 我 只 是 從 來 沒 有 給 自 己 機 會 試試 看 。 」</p>\n<p>限制性信 念最可怕 的 地方 ， 不是 它 限 制了你 做 什 麼 ， 是 它 限 制了你 「 想 」 什 麼 。 當 你相信自 己</p>\n<p>「不可能 」 ，你就 不 會 嘗 試 ； 當 你不 嘗 試 ， 你 就 不 會 有 反 證 ； 當 你 沒 有 反 證 ， 你 的 信 念 就 越 來 越 堅</p>\n<p>固。這是 一 個自我 實 現 的 預 言 。</p>\n<p>如果你想拆掉這 些 柵 欄 ， 我 想 邀 請 你 做 一 個 「 信 念 審 查 」 。 步 驟 一： 寫 下你 的 限 制性信 念 。 哪 一 句</p>\n<p>話你經常對自 己 說 ？ 「 我不 適 合 帶 人 」 、 「 我 沒 有 創 意 」 、 「 我年 紀 太 大 學 不 動 了 」 。 步 驟 二 ： 找 反</p>\n<p>證。有沒 有任何人 、 任何 時 刻 、 任何 證 據 ， 證 明 這 個 信 念 是 錯 的 ？也 許 你 曾 經 帶 過 實 習 生 而 且 做</p>\n<p>得很好，也 許你 曾 經 提出 一 個 被 採 納 的 創 意 點 子 ， 也 許 你 去 年 學 會 了 一 個 新 軟 體 。 步 驟 三 ： 問 自</p>\n<p>己「如果這 個信 念 是 錯 的， 我 會 怎 麼 做？ 」 如果 「 我不 適 合 帶 人 」 是 錯 的， 你 會 申 請 那 個 專 案</p>\n<p>嗎？如果 「我 沒 有 創 意 」 是 錯 的， 你 會 開 始 寫 部 落 格 嗎 ？</p>\n<p>你以為的 「不可能 」 ， 只 是你 的 容 器 還沒 撐 到 那 裡 。 擴 容 ， 從 質 疑 一 個 你 從 未 懷 疑 過 的 信 念 開 始 。</p>\n<p>【80 字摘要】限制性信 念 源 自 童 年 標 籤 、 失 敗 過 度推 論 與 他 人 評 價 ， 形 成自 動 化 的 「 不可能 」 思 維 。 透 過 「 信 念</p>\n<p>審查」三 步 驟 —— 寫 下信 念 、 尋 找 反 證 、 假 設 信 念 為 錯 —— 拆 掉 內 在 柵 欄 ， 讓 擴 容 從 質 疑 開 始 。</p>\n<p>【五個關 鍵字】限 制性信 念 、 Carol Dweck 、 成 長 型 思 維 、 自 動 化 思 考 、 信 念 審 查</p>\n<p>23</p>"},
  {id:11, dim:"dim2", title:"冒 牌者 症 候群 ： 當 你 覺 得 自 己 「 不 配 」 擁 有 現 在 的 位 置", summary:"當你 升 遷 後 覺 得 「 遲 早 會 被 拆 穿 」 ， 當 你 覺 得 成 功只 是 運 氣 ， 你可能 有 冒 牌 者 症 候群 。 這", content:"<p>第 11 篇： 冒 牌者 症 候群 ： 當 你 覺 得 自 己 「 不 配 」 擁 有 現 在 的 位 置</p>\n<p>當你 升 遷 後 覺 得 「 遲 早 會 被 拆 穿 」 ， 當 你 覺 得 成 功只 是 運 氣 ， 你可能 有 冒 牌 者 症 候群 。 這</p>\n<p>不是謙虛 ，是 認知 扭 曲 。 透 過 「 證 據 相 簿 」 重建 自我 認 同 ， 把 「 我不 配 」 轉 化成 「 這 是我 應 得 的 」 。</p>\n<p>你被升遷 為主管三 個 月 了 。 團 隊 運 作 順 利 ， 專 案 如 期交 付 ， 老 闆 在 會 議 上公 開 表 揚 你 。 但 你心 裡</p>\n<p>有一個聲 音 ，一天 比 一 天大 聲 ： 「 他 們 什 麼 時 候 會發 現 我不 夠 格？ 」 你 把 自 己 的 成 功 歸 功 於 「 運 氣</p>\n<p>好」、「團 隊 強 」 、 「 時 機對 」 ， 從 來 不 願 意 承 認 「 也 許 ， 是我 做得 好 」 。</p>\n<p>這就是「 冒 牌者 症 候群 」 。 1978 年 ， 心理 學 家  Pauline Clance 與  Suzanne Imes 首次提出 這 個 概</p>\n<p>念。她們發 現 ， 許 多高成 就 者 無 法 將 自 己 的 成 功 歸 因 於 能力 ， 而 是 歸 因 於 運 氣 、 時 機 或 欺 騙 。 他</p>\n<p>們活在持 續 的恐 懼 中， 害 怕 被 「 拆 穿 」 。</p>\n<p>冒牌者症 候群 有三 個 典 型 的 思 維 模 式 。 第 一 個 是 「 歸 因 偏 誤 」 —— 成 功 歸 運 氣 ， 失 敗 歸 能力 。 專 案</p>\n<p>成功了，你 說 「是 團 隊 的 功 勞 」 ； 專 案 失 敗 了 ， 你 說 「 是我 領 導 無 方 」 。 第二 個 是 「 完 美主 義 補 償 」</p>\n<p>——你覺得自 己 「 不 配 」 ， 所以用 過 度 的 準 備 來 彌 補 。 升 遷 後 的 第 一 場 簡 報 ， 你 改 了 十 七 版 ， 不是</p>\n<p>因為它需要 十 七版 ， 是 因 為 你 害 怕 任何 一 點 不 完 美 都 會 「 證 明 」 你不 夠 格 。 第 三 個 是 「 恐 懼 被 評</p>\n<p>價」 ——你 拒 絕 新的 挑 戰 ， 因 為 「 如果我 失 敗 了 ， 他 們 就 會 知道我是 冒 牌 貨 」 。</p>\n<p>我認識一 個 產品 總 監 ， 她 在 業 界十五 年 ， 帶 過 無 數 成 功 專 案 。 但 她 告 訴 我 ： 「 我 每 天 都 在等 ， 等 有</p>\n<p>人走進來 說 『 妳其 實 不 懂 對 吧 』 。 」 她 把 所 有 獎 項 藏在 抽 屜 裡 ， 從 不 掛 在 牆 上 ， 因 為 「 看了 會 覺 得</p>\n<p>自己是騙子 」 。這 不是 謙 虛 ， 這 是 一 種 認 知 扭 曲 —— 你 的 大 腦 選 擇 性 忽 略 了所 有 證 明你能力 的 證</p>\n<p>據，只放大 那些 讓 你自我 懷 疑 的 時 刻 。</p>\n<p>冒牌者症 候群最 諷 刺 的 是 ， 它往往 發 生在 「 真 正 有 能力 」 的 人 身 上 。 無 能 的 人不 會 懷 疑 自 己 ， 他</p>\n<p>們覺得自 己無所不能 。 會 自我 懷 疑 的， 恰恰 是 那些 在意 、 那些 努 力 、 那些 對 自 己 有 要 求 的 人 。 你</p>\n<p>的自我懷 疑 ，某 種 程 度上 證 明了你在 乎 。</p>\n<p>如果你也 覺得自 己 是 個 冒 牌 者 ， 我 想 邀 請 你 做 一 個 「 證 據 相 簿 」 。 不是收 集 別 人 的 讚 美 ， 是收 集</p>\n<p>「客觀證 據 」 。 寫 下 「 我 完 成了 什 麼 」 、 「 我 解 決 了 什 麼 問題 」 、 「 我 帶 領 團 隊 達 成了 什 麼 目 標 」 。 不</p>\n<p>是「我運 氣好 」 ， 是 「 我 每 天 早 上 六 點 起 床 準 備 簡 報 」 、 「 我在客 戶 發 飆 的 時 候 穩 住 了 場 面 」 、 「 我 花</p>\n<p>了三週研究 那 個 數 據 模 型 」 。 這 些 ， 都 是 事 實 ， 不是 運 氣 。</p>\n<p>每當自我 懷 疑 來 襲 的 時 候 ， 打 開 這 本相 簿 。 不是 為 了自 誇 ， 是 為 了在 「 我不 配 」 的 聲 音 響 起 時 ，</p>\n<p>你有證據可以反 駁 它 。</p>\n<p>你不是冒 牌者 ，你 只 是 還 不 習 慣 承 認 自 己 夠 好 。 擴 容 不是 讓 你 變 得 更 厲 害 ， 是 讓 你 終 於 相信 —— 你</p>\n<p>已經夠厲 害了 。</p>\n<p>24【80 字摘要】 冒 牌 者 症 候群 讓 高成 就 者 將 成 功 歸 因 於 運 氣 而 非 能力 ， 活在 被 拆 穿 的 恐 懼 中。 透 過 「 證 據 相 簿 」 收</p>\n<p>集客觀成就 證 據 ， 對 抗 歸 因 偏 誤 與 認 知 扭 曲 ， 重建 「 這 是我 應 得 的 」 自我 認 同 。</p>\n<p>【五個關 鍵字】 冒 牌 者 症 候群 、 Pauline Clance 、 歸 因 偏 誤 、 證 據 相 簿 、 自我 認 同</p>"},
  {id:12, dim:"dim2", title:"決 策 疲 勞 ： 為 什 麼 小 事 會 耗 盡 你 的 意 志 力", summary:"為 什 麼 你 早 上可以 做 出 重 大 策 略 ， 下 午 卻 連 晚 餐 吃 什 麼 都 無 法 決 定 ？ 因 為 意 志 力是 有 限", content:"<p>第 12 篇： 決 策 疲 勞 ： 為 什 麼 小 事 會 耗 盡 你 的 意 志 力</p>\n<p>為 什 麼 你 早 上可以 做 出 重 大 策 略 ， 下 午 卻 連 晚 餐 吃 什 麼 都 無 法 決 定 ？ 因 為 意 志 力是 有 限</p>\n<p>資源。透 過 「 決 策 減 量 」 策 略 ， 把 日 常 選 擇 自 動 化 ， 保 留 意 志 力 給 真 正 重 要 的 事 。</p>\n<p>下午五點 ，主管 走 過來 問 你 ： 「 這 個 新 專 案 ， 你要不要接 ？ 」 你 腦 袋 一 片 空 白 。 三 個 月 前 ， 你 還 可</p>\n<p>以在晨會上提出 改 變 整 個 產 品方 向 的 策 略 ， 但 現 在 ， 連 「 要不要接 一 個 專 案 」 這 種 問題 都 讓 你 無</p>\n<p>法思考。你 說 ： 「 我明天 再 回 答 你 。 」 然 後 你 坐 在位子上 ， 發 現 自 己 連 晚 餐 要 吃 什 麼 都 決 定不了 。</p>\n<p>這不是你不 夠聰明 ， 這 是 「 決 策 疲 勞 」 。 心理 學 家  Roy Baumeister 提出 「 自我 損 耗」 理 論 ， 他 說</p>\n<p>人的意志力就 像 肌 肉 ， 用多了 會 疲 勞 。 你 早 上 做 的 每 一 個 決 定 —— 穿 什 麼 、 先 回 哪 封 Email 、 會 議</p>\n<p>上要不要發言 —— 都 在 消 耗 你 的 意 志 力 存 量 。 到了下 午 ， 你 的 「 決 策 肌 肉 」 已 經 痠 軟 無 力 。</p>\n<p>這也是為 什 麼  Steve Jobs 幾 乎 每 天 都 穿 同 一 套 衣 服 ， 為 什 麼  Mark Zuckerberg 的 衣 櫃 裡 只 有 灰</p>\n<p>色T恤。他 們不是 沒 有 品 味 ， 是 他 們 知道 ： 每 個 小 決 定 都 在 偷 走 你 做 大 事 的 力 氣 。 與 其在 早 上 決 定</p>\n<p>「穿什麼 」 ，不如 把 這 個 決 定 從 人生 中 刪 除 。</p>\n<p>決策疲勞 有三 個 跡 象 。 第 一 個 是 「 下 午 變 得 優 柔 寡 斷 」 —— 早 上果 斷 的 你 ， 下 午 變 成 「 都 可以 」 、</p>\n<p>「你決定 」 、 「我 沒 意 見 」 。 第二 個 是 「 對 小 事 過 度 反 應 」 —— 同 事 問 你 「 這 個 用 紅 色 還 是 藍 色 」 ， 你</p>\n<p>突然發火 ： 「這 種 小 事 不要 來 問 我！ 」 第 三 個 是 「 選 擇 後 悔 」 —— 你 終 於 做 了 一 個 決 定 ， 然 後 反 覆</p>\n<p>質疑自己 「是不是 選 錯 了 」 。</p>\n<p>我認識一 個 創 業者 ， 他 每 天 早 上 五 點 起 床 ， 第 一 件事 是 決 定 當 天最 重 要 的 三 件事 。 然 後 他 發 現 ，</p>\n<p>到了下午 ，他 連 「 要不要回 這 封 Email 」 都 無 法 決 定 。 他 開 始 實 施 「 決 策 減 量 」 計 畫 ： 固 定 週 一 到</p>\n<p>週三的午餐 、固定 每 天 穿 同 一 套 工作服 的 變 化版 、 把 Email 分成 「 需 要 決 定 」 和 「 只需 要回 覆」 兩</p>\n<p>類。兩週後他告 訴 我 ： 「 我 發 現 我 的 腦 袋 在下 午 變 清 楚 了 ， 因 為 我不 再 浪 費 力 氣 在 無 關 緊 要 的 事 情</p>\n<p>上。」</p>\n<p>你的意志力 像手機電 池 ， 早 上 滿 格 ， 晚 上 紅 色 警 戒 。 問題 是 ， 大多 數 人在 早 上 就 把 電 量 浪 費 在</p>\n<p>「要不要加燕 麥奶 」 這 種 事 上 。</p>\n<p>如果你也 受困於 決 策 疲 勞 ， 我 想 邀 請 你 做 一 個 實 驗 。 下 週 ， 選 擇 三 件 「 每 天 重 複 的 小 事 」 ， 把 它 們</p>\n<p>自動化。固定你 的 早 餐 、 固 定你 的 上 班穿 搭 、 固 定你回 覆 Email 的 時 間 。 然 後 觀 察 ： 當 你 把 這 些 小</p>\n<p>25決定從人生 中 移 除 ， 你 的 下 午 會發 生 什 麼 變 化 ？</p>\n<p>擴容不是 讓你 變得 更 會 做 決 定 ， 是 讓 你 學 會 保 護 做 決 定 的 能 量 。 把 意 志 力 留 給 真 正 重 要 的 事 —— 那</p>\n<p>些會改變你職涯 的 選 擇 ， 而 不是 「 今 天 吃 什 麼 」 。</p>\n<p>【80 字摘要】意 志 力是 有 限 資 源 ，日 常 小 決 策 會 消 耗 做 大 事 的 能 量 。 透 過 「 決 策 減 量 」 策 略 —— 固 定 日 常 選 擇 、</p>\n<p>建立自動化流程 —— 保 護 下 午 的 決 策 品 質 ， 讓 擴 容 發 生在 把 意 志 力 留 給 重 要 抉 擇 的 過 程 中。</p>\n<p>【五個關 鍵字】 決 策 疲 勞 、 Roy Baumeister 、 自我 損 耗 、 決 策 減 量 、 意 志 力 管 理</p>\n<p>26</p>"},
  {id:13, dim:"dim3", title:"深 夜 辦公 室 的 燈 ， 照 亮 的 不是你 的 前 途 ， 而 是你 的 恐 懼", summary:"第 13 篇： 深 夜 辦公 室 的 燈 ， 照 亮 的 不是你 的 前 途 ， 而 是你 的 恐 懼 晚上十點 半 ， 辦公大 樓 的 電 梯 只 剩 下你 。 你 按 下  B2 ， 走 進 停 車 場 ， 發 現 自 己 的 車 旁...", content:"<p>第 13 篇： 深 夜 辦公 室 的 燈 ， 照 亮 的 不是你 的 前 途 ， 而 是你 的 恐 懼</p>\n<p>晚上十點 半 ， 辦公大 樓 的 電 梯 只 剩 下你 。 你 按 下  B2 ， 走 進 停 車 場 ， 發 現 自 己 的 車 旁 邊 已 經 沒 有 幾</p>\n<p>輛車了。你 拍了 一 張 夜 景 的 照 片 ， 發 到社 群媒 體 ， 配 文 ： 「 又 是 充 實 的一 天 。 」 然 後 坐 在 駕駛 座</p>\n<p>上，發呆了 十五分 鐘 ， 才 發 動 引 擎 。</p>\n<p>這樣的場 景 ，你重 複 了多 少 次 ？</p>\n<p>我認識一 個 中 階主 管 ， 叫 他老 陳 。 老 陳 每 天工作 十 二 小 時 ， 週 末 也 來 公司 。 他 的 桌 上 擺 著 「 最 佳</p>\n<p>員工」的 獎 牌 ，他 的 主 管 在 會 議 上公 開 稱 讚 他 「 以 身 作 則 」 。 但 老 陳 私 下 跟 我 說 ， 他 最 怕 的 不是工</p>\n<p>作，是「回家 」 。</p>\n<p>回家之後 ，他面對 的 是 妻 子 的 抱 怨 、 孩 子 的 冷 漠 、 以 及 一 種 巨 大 的 空 虛 感 —— 「 如果不工作 ， 我是</p>\n<p>誰？」所以他 選 擇 留 在 辦 公 室 。 辦 公 室 的 燈 是 暖 的， 電 腦 的 待 辦 清 單 是 具 體 的， 同 事 的 訊 息是 即</p>\n<p>時的。這 裡 讓他感 覺 「 被 需 要 」 。</p>\n<p>但這種被 需要 ，是 一 種 成 癮 。</p>\n<p>104 人力 銀行  2025 年 的 調 查 顯 示 ， 許 多工作者 聲 稱 追 求 「 工作 與 生活平 衡 」 ， 但 同 時 也 發 現 ， 不</p>\n<p>少人用加 班 來 逃避 生活 的 空 洞 。 這 是 一 種 「 假 性 勤 奮 」 —— 我 們 用工作 的 忙 碌 ， 來 合理化自 己 對 親</p>\n<p>密關係、對自我探 索 、 對 人生意 義 的 逃 避 。</p>\n<p>管理學者  Peter Drucker 說 過 ： 「 效 率 是 把 事 情 做 對 ； 效 益 是 做 對 的 事 情 。 」 當 你加 班 到 深 夜 ， 你</p>\n<p>可能很有 效 率 ， 但 你正在 做 的， 真 的 是 對 的 事 嗎 ？ 還 是 只 是 「 容 易 衡 量 」 的 事？</p>\n<p>我發現， 習 慣性加 班 的 人 ， 心 裡 通 常 藏 著 三 種 動 機 ， 只 是 他 們 自 己 沒 有 意 識 到 。</p>\n<p>第一種動機是 「 存 在 感 成 癮 」 。 你 害 怕 不 被 看 見 ， 所以用 「 最 後 一 個 走 」 來 證 明自 己 的 重 要性 。 但</p>\n<p>這種存在感是借 來 的 —— 它 來 自 辦 公 室 的 燈 、 來 自主 管 的 稱 讚 ， 而 不是 來 自你 內 在 的 價 值 感 。 當 燈</p>\n<p>熄了、稱 讚 停了 ， 你 就 什 麼 都 不是了 。</p>\n<p>第二種動機是 「 控 制 感 替 代 」 。 生活 裡 有 太 多 無 法 控 制 的 事 —— 伴 侶 的 情 緒 、 孩 子 的 成 績 、 自 己 的</p>\n<p>健康。但工作是可以 控 制 的： 你 只 要多 花 一 個 小 時 ， 報 表 就 會 多 一 頁 。 這 種 「 可 控 的 成 就感 」 讓</p>\n<p>人上癮， 因 為 它比 生活 的 混 亂 安全多了 。</p>\n<p>第三種動機是 「身 份 綁 架 」 。 你 已 經 把 自 己 和 「 職 位 」 綁 得 太 緊 ， 以 至 於 「 不工作 」 等 於 「 不 存</p>\n<p>在」。這是最危 險 的一 種 ， 因 為 它 讓 你 逐 漸 失 去 「 工作之外 」 的 自 己 。 你 變 成 一 個 只 會 用  KPI 定 義</p>\n<p>自己的人 ，而  KPI 是 別 人 給 的。</p>\n<p>老陳後來做了 一 個 實 驗 ， 我 稱 之 為 「 強 制下 班 」 。 他 給 自 己 設 了 一 個 「 硬 停 止 」 時 間 —— 晚 上 七</p>\n<p>點。七點 一到 ，不 管做 到 哪 裡 ， 關電 腦 、 離 開 辦 公 室 。</p>\n<p>27離開前，他做了 一件 很 重 要 的 事 ： 寫 下 「 明天 第 一 件 要 做 的 事 」 。 這 是 為 了安 撫 他 的 焦 慮 —— 讓 大</p>\n<p>腦知道，這件事不 會 被 遺 忘 ， 只 是 被 「 暫 停 」 。</p>\n<p>然後，他去 一 個 「 非 工作 」 的 地方 。有 時 候 是公 園 ，有 時 候 是 健 身 房 ，有 時 候 只 是在家 附 近 的 便</p>\n<p>利商店坐 半小 時 。 那 一 小 時 的 目 的 不是 放 鬆 ， 是 「 重 新 建立 存 在 感 」 —— 讓 他 的 身 體 記 住 ， 沒 有 工</p>\n<p>作，他依然 存在 。</p>\n<p>第一週他很焦 慮 ，感 覺 像 戒 斷 。 第二 週 他 開 始 發 現 ， 妻 子 會 跟 他 說 話 了 ， 孩 子 會 跑 過來 抱 他 了 。</p>\n<p>第三週，他告 訴我 ： 「 我 發 現 ， 原 來 我不用 那 麼 努 力 ， 也 值 得被 愛 。 」</p>\n<p>深夜辦公室 的 燈 ， 照 亮 的 不是你 的 前 途 ， 是你不 敢 面 對 的 空 洞 。 真 正 的 擴 容 ， 從 你 願 意 關 掉 那 盞</p>\n<p>燈開始。</p>\n<p>如果你也習 慣用最後 一 個 離 開 辦 公 室 來 證 明自 己 的 價 值 ， 我 想 邀 請 你 ， 下 週選 一 天 ， 設 一 個 硬 停</p>\n<p>止時間。 七點 ，或 者 八 點 ， 或 者 任何 你 覺 得 「 還 太 早 」 的 時 間 。 關 掉 電 腦 ， 寫 下明天 的 事 ， 然 後</p>\n<p>去一個沒 有工作 的 地方 。</p>\n<p>你會發現， 世界 沒 有 崩 塌 。 而 你 的 靈 魂 ， 終 於 有 機 會 呼 吸 。</p>\n<p>【80 字摘要】  習 慣性加 班 往往 不是 勤 奮 ， 而 是 對 生活 空 洞 的 逃 避 與 存 在 感 成 癮 。 透 過 「 強 制下 班 」 儀 式 與 硬 停</p>\n<p>止時間，重 新建立 工作之外 的 自我 存 在 感 ， 讓 擴 容 從 關 掉 那 盞 燈 開 始 。</p>\n<p>【五個關鍵字】  加 班成 癮 、 存 在 感 、 工作 與 生活平 衡 、 強 制下 班 、 假 性 勤 奮</p>"},
  {id:14, dim:"dim3", title:"拖 延不是 時 間 管 理 問題 ， 是情 緒 調 節 問題", summary:"你以 為 拖 延 是 因 為 懶 或 沒 計 畫 ， 但 心理 學 研究 發 現 ， 拖 延 是 「 情 緒 調 節 」 的 失 敗 —— 你", content:"<p>第 14 篇： 拖 延不是 時 間 管 理 問題 ， 是情 緒 調 節 問題</p>\n<p>你以 為 拖 延 是 因 為 懶 或 沒 計 畫 ， 但 心理 學 研究 發 現 ， 拖 延 是 「 情 緒 調 節 」 的 失 敗 —— 你</p>\n<p>在逃避與任 務相 關 的 負 面情 緒 。 透 過 「 五 分 鐘 啟 動 法 」 ， 繞 過 情 緒 的 封 鎖 線 ， 讓 擴 容 從 「 先 做 五 分</p>\n<p>鐘」開始 。</p>\n<p>截止日三天前 ，你明知 該 動 工了 。 報 告 的 框 架 在 腦 海 裡 已 經 轉 了 兩 週 ， 但 你 就 是 無 法 坐 下 來 開</p>\n<p>始。你滑了 兩小 時 手 機 ， 整 理了 從 來 不 整 理 的 桌 面 ， 回 覆 了所 有 無 關 緊 要 的 Email ， 甚 至把 去 年相</p>\n<p>簿翻了一 遍 。然後 你 對 自 己 說 ： 「 明天 一 定 開 始 。 」</p>\n<p>這個場景你重 複了多 少 次 ？ 你以 為 拖 延 是 因 為 懶 、 因 為 沒 計 畫 、 因 為 時 間 管 理 太 差 。 但 心理 學 家</p>\n<p>Tim Pychyl 研究 了 數 十 年 的 拖 延 行 為 ， 發 現 一 個 驚 人 的 結 論 ： 拖 延 不是 時 間 管 理 問題 ， 是情 緒 調</p>\n<p>節問題。 Fuchsia Sirois 更 進 一 步指 出 ， 我 們 拖 延 不是 因 為 任 務 太 難 ， 是 因 為 任 務 引 發 的 情 緒 太</p>\n<p>不舒服 ——對 失 敗 的 恐 懼 、 對 完 美 的 焦 慮 、 對 無 聊 的 抗 拒 。</p>\n<p>28拖延的三 個情 緒 根 源 。 第 一 個 是 「 對 失 敗 的 恐 懼 」 —— 你不 開 始 ， 就 不 會 失 敗 。 只 要不 交 出 去 ， 你</p>\n<p>的報告永 遠 「 有 潛 力 」 ； 一 交 出 去 ， 就 可能 被 批 評 。 第二 個 是 「 對 完 美 的 焦 慮 」 —— 你 腦 海 裡 有一</p>\n<p>個「完美版本 」 ， 但 你不知道 怎 麼 達 到 ， 所以 乾 脆 不 開 始 。 第 三 個 是 「 對 無 聊 的 抗 拒 」 —— 這 個 任</p>\n<p>務讓你感 覺無 趣 、 沒 意 義 ， 你 的 大 腦 在 說 「 我不 想做 這 個 」 ， 但 你不能 說 「 我不 想 」 ， 所以你 說</p>\n<p>「我晚點 再做 」 。</p>\n<p>我認識一 個行 銷 經 理 ， 她 每 次 寫 年度 計 畫 都 會 拖 到最 後 一 刻 。 她 以 為 自 己 是 「 需 要 壓 力 才 能 產</p>\n<p>出」，但後 來 她發 現 ： 「 我 害 怕 的 是 寫 出 來 的 計 畫 不 夠 好 ， 會 被老 闆 打 槍 。 」 她 的 拖 延 不是 時 間 問</p>\n<p>題，是情 緒問題 —— 她 在 逃 避 「 被 評 價 」 的 恐 懼 。</p>\n<p>理解這一點 很重要 ， 因 為當 你 把 拖 延 當 成 「 時 間 管 理 問題 」 ， 你 會 買 更多行 事 曆 、 下更多 App 、 做</p>\n<p>更細的計 畫 。 但 當 你明 白 拖 延 是 「 情 緒 調 節 問題 」 ， 你 就 會 知道 ： 你 需 要 管 理 的 不是 時 間 ， 是你面</p>\n<p>對這個任 務 時 的情 緒 。</p>\n<p>我想邀請你 試試 「 五 分 鐘 啟 動 法 」 。 原 理 很 簡 單 ： 告 訴 自 己 ， 我 只 做 五 分 鐘 。 不是 「 我要 完 成 這 份</p>\n<p>報告」，是 「我 只 寫 五 分 鐘 」 。 這 個 方法之所以 有 效 ， 是 因 為 它 繞 過 了你大 腦 的 情 緒 封 鎖 線 。 你不</p>\n<p>需要「準 備好 」 ， 不 需 要 「 有 靈 感 」 ， 不 需 要 「 心情 對 」 —— 你 只需 要 開 始 。 而 神 奇 的 是 ，一 旦 開 始</p>\n<p>了五分鐘 ，你通常 會 繼續 下 去 。 因 為 最 難 的 從 來 不是 「 做 」 ， 是 「 開 始 」 。</p>\n<p>拖延不是 時 間不 夠 ， 是情 緒 太 滿 。 擴 容 不是 管 理 時 間 ， 是 管 理情 緒 。 當 你下 一 次 發 現 自 己 在 逃 避</p>\n<p>某個任務 的 時 候 ， 不要 問 「 我 為 什 麼 沒 時 間 」 ， 問 「 我在 害 怕 什 麼 」 。 然 後 ， 對 自 己 說 ： 「 我 只 做 五</p>\n<p>分鐘。」 五分 鐘後 ， 你可以 停 下 來 。 但 你可能 會發 現 ， 你 已 經 停 不下 來 了 。</p>\n<p>【80 字摘要】 拖 延 根 源 在 於 逃 避 任 務 引 發 的 負 面情 緒 而 非 時 間 管 理不 當 。 透 過 「 五 分 鐘 啟 動 法 」 降 低 開 始 門 檻 ，</p>\n<p>繞過情緒 封 鎖 線 ， 讓 擴 容 從 理 解 拖 延 的 情 緒 本 質 與 「 先 做 五 分 鐘 」 的 微小行 動 開 始 。</p>\n<p>【五個關 鍵字】 拖 延 、 Tim Pychyl 、 情 緒 調 節 、 五 分 鐘 啟 動 法 、 完 美 焦 慮</p>"},
  {id:15, dim:"dim3", title:"你的專業正在偷偷過期：科技人的「認知邊界」坍塌警報", summary:"2026年AI讓技術技能半衰期縮短至2.5年，科技業技術快速迭代使「資深」可能變為包袱。職場人應從「深度轉向跨度」、「正確轉向試錯」、「個人轉向網絡」，建立認知擴容策略，在認知邊界坍塌前主動重建能力。", content:"<p>早上八點，你走進辦公室。今天和昨天一樣，你調整著熟悉的參數，監控著熟悉的系統曲線。主管說你「很穩定」，同事說你「很資深」。你以為這是「專業」，但你有沒有想過，這可能是「認知邊界坍塌」的前兆？</p>\n<p>科技業有一個殘酷的規律：技術每推進一代，上一代的核心能力就貶值一半。當公司從舊系統轉向新架構，再衝向雲端與AI整合，那些花了十年學會的調校技巧、那些你引以為傲的經驗直覺，可能在一夜之間變成「遺產技能」——不是完全沒用，但市場不再為它付高價。根據2026年的產業觀察，科技業技術迭代速度遠超教育體系更新速度，企業對「具備實戰迭代經驗」的人才需求占比達75%，但許多資深者掌握的卻是「上一代系統的深層知識」。這意味著什麼？意味著「資深」不再是護身符，可能是包袱。</p>\n<p>我提出一個概念，叫做「認知邊界的坍塌」。舒適圈聽起來太溫柔了，像是你窩在裡面不想出來。但現實更殘酷：你的認知邊界不是被你自己縮小的，是被技術迭代「壓垮」的。當AI開始寫程式、當新架構取代舊方法、當客戶開始要求你聽不懂的規格，你的邊界不是「縮水」，是「坍塌」——你以為自己還站在平地上，其實腳下的土已經被抽走了。</p>\n<p>我認識一位在科技公司做了十二年的資深工程師，叫他阿宏。阿宏是某個舊系統的「神手」，什麼異常都難不倒他。但當公司導入AI輔助的預測性決策系統時，阿宏發現他「感覺系統不對勁」的直覺，開始輸給演算法的數據判讀。更可怕的是，新進工程師不需要學會「感覺」，他們只需要學會「解讀AI的建議」。阿宏的十二年經驗，突然變成一種「昂貴的過時技能」。</p>\n<p>這不是阿宏的錯，這是技術半衰期的必然。專家估計，2026年技術技能的半衰期可能短至2.5年。2.5年！這意味著你大學四年學的東西，畢業時已經過期了一半。這意味著「學會一項技能就可以吃三十年」的時代，徹底結束了。</p>\n<p>那麼，如何對抗認知邊界的坍塌？不是去上更多課、考更多證。傳統的「學習」假設知識是穩定的，你只要不斷累積就好。但技術半衰期時代，知識是「流動的」——你累積的同時，它也在蒸發。你需要的是「認知擴容」，不是「知識堆疊」。</p>\n<p>我從科技業的殘酷迭代中，歸納出三個「認知擴容」策略：</p>\n<p>第一，「從深度轉向跨度」。舊時代要求你「在一個點上鑽到最深」，新時代要求你「在多個點之間建立連結」。阿宏後來的做法是：他不再只鑽研舊系統參數，開始學習「數據如何轉化為決策」。他學會了看AI的預測報告，並且用他的現場經驗去「驗證」演算法的盲點。他沒有變成數據科學家，他變成了「能跟數據科學家對話的系統專家」。這個「跨度」讓他的經驗從「過時」變成「稀缺」。</p>\n<p>第二，「從正確轉向試錯」。大企業的SOP文化讓我們相信「不要犯錯」。但技術半衰期時代，「不犯錯」等於「不嘗試」，等於「不學習」。你需要建立一個「低成本試錯系統」：每個月選一個小範圍，嘗試一個新方法、新工具、新流程。失敗了，損失可控；成功了，你就比別人早一步建立新認知。這就是擴容——不是讓自己變得無所不知，是讓自己變得「不怕不知道」。</p>\n<p>第三，「從個人轉向網絡」。當知識半衰期縮短到2.5年，你個人學習的速度一定追不上。你需要的是「學習網絡」——一群在不同領域前沿的人，彼此交換「現在什麼正在過期、什麼正在興起」。阿宏後來加入了一個跨公司的技術社群，裡面有軟體商、顧問、甚至競爭對手的工程師。他說：「我學到最多的，不是誰教我的，是誰『提到』了什麼我聽不懂的東西，然後我回去查。」</p>\n<p>最後，我想對所有「資深科技人」說一句殘酷的話：你的經驗不是你的資產，你的「學習速度」才是。當技術半衰期短於你的學習週期，經驗就會變成負債——因為它讓你誤以為自己已經夠好了。</p>\n<p>認知邊界的坍塌不會提前通知你。它不會像主管一樣給你警告信，它只會在某個平常的早上，突然讓你發現：你聽不懂會議上的新術語、你看不懂新專案的架構圖、你回答不了客戶的新問題。</p>\n<p>擴容不是讓你離開舒適圈。是讓你在舒適圈被壓垮之前，先學會在廢墟上蓋新房子。</p>"},
  {id:16, dim:"dim3", title:"習 慣 的力 量 ： 如 何 讓 擴 容 變 成自 動 化 流程", summary:"擴容不 應 該 每 次 都 靠 意 志 力 。 當 你 把 擴 容 的 行 為 變 成 「 習 慣 」 ， 它 就 會 像 刷 牙 一 樣 自 然 。", content:"<p>第 16 篇： 習 慣 的力 量 ： 如 何 讓 擴 容 變 成自 動 化 流程</p>\n<p>擴容不 應 該 每 次 都 靠 意 志 力 。 當 你 把 擴 容 的 行 為 變 成 「 習 慣 」 ， 它 就 會 像 刷 牙 一 樣 自 然 。</p>\n<p>30透過「習慣 堆 疊 」 與 「 環 境 設 計 」 ， 讓 成 長 自 動 發 生 ， 不 再需 要 與 自 己 談 判 。</p>\n<p>每天晚上 十 一點 ， 你 躺 在 床 上 ， 對 自 己 說 ： 「 明天 開 始 ， 我要 早 起 閱 讀 三 十 分 鐘 。 」 你 設 了 六 點 的</p>\n<p>鬧鐘，心 裡 充 滿 希 望 。 第二 天 早 上 六 點 ， 鬧 鐘 響 了 。 你 按 掉 了 。 然 後 再 響 ， 再 按 掉 。 七 點 半 ， 你</p>\n<p>終於醒來 ， 帶著 罪 惡 感 開 始 一 天 。 這 個 循 環 重 複 了多 久 ？</p>\n<p>問題不在你 的 動機 ， 在你 的 方法 。 你以 為 擴 容 需 要意 志 力 ， 需 要 決 心 ， 需 要 「 再 努 力 一 點 」 。 但 行</p>\n<p>為科學告 訴我 們 ： 意 志 力是 有 限 的， 習 慣 是 無 限 的。 Charles Duhigg 在 《 習 慣 的 力 量 》 中 揭 示 了</p>\n<p>習慣迴路 ：提示 、 慣 性行 為 、 獎 勵 。 James Clear 在 《 原 子 習 慣 》 中 進 一 步 提出 ： 讓 好 習 慣 變 得</p>\n<p>顯而易見 、有吸 引 力 、 簡 單 易 行 、 令人 滿 足 ， 壞 習 慣 就 會 自 然消 退 。</p>\n<p>為什麼習 慣 勝 過意 志 力 ？ 有 三 個 原 因 。 第 一， 習 慣 自 動 化 ， 減 少 決 策 疲 勞 。 你不 需 要 每 天 早 上 問</p>\n<p>自己「要不要刷牙 」 ， 你自 動 就 刷 了 。 同 樣 的， 如果你 每 天 早 上自 動 讀 三 十 分 鐘 書 ， 你不 需 要 「 決</p>\n<p>定」要做 ，你就是 做 了 。 第二 ， 環 境 提 示 觸 發 行 為 。 當 你 把 運動 鞋 放 在 床 邊 ， 早 上看到 它 就 會 自</p>\n<p>動穿上。 當你 把 書 放 在 枕 頭 旁 ， 睡 前 就 會 自 動 翻 開 。 第 三 ， 微小 累 積 產 生 複 利 。 每 天 讀 三 十 分</p>\n<p>鐘，一年就是 一百 八 十 二 個 小 時 。 這 相 當 於 讀 了三 十 本 書 。 不是 因 為 你 某 天特 別 努 力 ， 是 因 為 你</p>\n<p>每天都做了 一點點 。</p>\n<p>我認識一 個工程 師 ， 他想 學 習 產 品 管 理 ， 但每 天下 班 後 都 說 「 太 累 了 ， 明天 再 說 」 。 他 後 來 做 了 一</p>\n<p>個「習慣堆 疊 」 ： 「 每 天 吃 完 晚 餐 後 ， 我 會 坐 在 書 桌 前 讀 十五 分 鐘 產 品 管 理 的 書 。 」 他 沒 有 改 變 生</p>\n<p>活節奏， 只是 把 新 行 為 「 接在 」 舊 行 為 後 面 。 三 個 月 後 ， 他 讀 完 了 四 本 書 ， 還 主 動 向 主 管 要 求 參</p>\n<p>與一個產品 規 劃 的 專 案 。 他 說 ： 「 我以 為 我 需 要 的 是更多 時 間 ， 其 實 我 需 要 的 是 一 個 不 會 失 敗 的 系</p>\n<p>統。」</p>\n<p>擴容不是 一次性 的 大 躍 進 ， 是 每 天 的 小 重 複 。 就 像 樹 木 不 會 一 夜 長 高 ， 但每 天 都 在 長 。 你不 需 要</p>\n<p>「變成一 個 新的人 」 ， 你 需 要 「 設 計 一 個 讓 好行 為 自 動 發 生 的 環 境 」 。</p>\n<p>如果你想 讓 擴容自 動 化 ， 我 想 邀 請 你 做 兩 件事 。 第 一 件 ： 「 習 慣 堆 疊 」 。 選 一 個 你 已 經 每 天 做 的 行</p>\n<p>為，把你想 培 養 的新 習 慣 接在 後 面 。 例 如 「 喝 完 咖 啡 後 ， 我 會 讀 十 分 鐘 書 」 、 「 下 班 搭捷 運 時 ， 我</p>\n<p>會聽一集 podcast 」 。 第二件 ： 「 環 境 設 計 」 。 讓 好 習 慣 變 得容 易 ， 讓 壞 習 慣 變 得 困 難 。 想 讀 更多</p>\n<p>書？把書放在 枕 頭 旁 ， 把 手 機 放 在客 廳 充 電 。 想 減 少 滑 手 機 ？ 把 社 交 媒 體 App 移 到 資 料 夾 的 最 深</p>\n<p>處，把螢 幕 調成 黑白模 式 。</p>\n<p>擴容不是 一次性 的 大 躍 進 ， 是 每 天自 動 發 生 的 小 重 複 。 當 你 把 成 長 變 成 習 慣 ， 你 就 會發 現 ： 擴 容</p>\n<p>不再需要意 志力 ， 它 變 成了你 的 生活方式 。</p>\n<p>【80 字摘要】意 志 力 有 限而 習 慣 無 限 ， 透 過 「 習 慣 堆 疊 」 將 新 行 為 接在 舊 行 為 後 面 ， 配 合 「 環 境 設 計 」 讓 好 習 慣</p>\n<p>自動觸發 ， 讓 擴容 從 一 次性 的 大 躍 進 轉 變 為 每 天自 動 發 生 的 小 重 複 ， 產 生 複 利 效 應 。</p>\n<p>【五個關 鍵字】 習 慣 、 Charles Duhigg 、 James Clear 、 原 子 習 慣 、 習 慣 堆 疊</p>\n<p>31</p>"},
  {id:17, dim:"dim3", title:"從 「 想 」 到 「 做 」 ： 啟 動 力 的 三 個 開 關", summary:"為 什 麼 我 們 總 是 「 想 很 多 ， 做 很 少 」 ？ 因 為 大 腦 的 「 預 設 模 式 網 絡 」 熱 衷 於 規 劃 ， 但 迴", content:"<p>第 17 篇： 從 「 想 」 到 「 做 」 ： 啟 動 力 的 三 個 開 關</p>\n<p>為 什 麼 我 們 總 是 「 想 很 多 ， 做 很 少 」 ？ 因 為 大 腦 的 「 預 設 模 式 網 絡 」 熱 衷 於 規 劃 ， 但 迴</p>\n<p>避行動。 透 過 「三 秒 開 關 」 與 「 實 施 意 向 」 ， 把 想 法 變 成 動 作 ， 讓 擴 容 從 動 得 更 早 開 始 。</p>\n<p>週日晚上 ，你坐在 書 桌 前 ， 筆 記 本上 寫 滿 了下 週 的 計 畫 。新的 學 習 目 標 、 運動 計 畫 、 工作 專 案 ，</p>\n<p>每一項都排得 井井 有 條 。 你看 著 那 張 清 單 ， 心 裡 充 滿動 力 ： 「 下 週 會 是 改 變 的一 週 。 」 週 一 早 上 ，</p>\n<p>鬧鐘響了 。你 按掉 它 ， 翻 個 身 。 連 第 一 項 「 早 起 跑 步 」 都 沒 開 始 。</p>\n<p>為什麼我 們 總是 「 想 很 多 ， 做 很 少 」 ？ 神 經 科 學 提 供 了 一 個 答 案 ： 大 腦 有 兩 個網 絡 。一 個 是 「 預</p>\n<p>設模式網 絡 」 ， 負責 想 像 、 規 劃 、 思 考 「 如果 」 。 另 一 個 是 「 執 行 控 制 網 絡 」 ， 負責 行 動 、 專 注 、 做</p>\n<p>決定。問題是 ， 預 設 模 式 網 絡 太 活 躍 了 —— 它 讓 你 熱 衷 於 規 劃 ， 但 迴 避 行 動 。 規 劃 讓 你 感 覺 良 好 ，</p>\n<p>因為它給了你 「我 已 經 在 做 」 的 錯 覺 ， 但 其 實 你 什 麼 都 還沒 做 。</p>\n<p>啟動力有三 個 障 礙 。 第 一 個 是 「 啟 動 成本 太 高 」 —— 你 望 著 那 座 山 ， 覺 得 永 遠 爬 不上 去 ， 所以 連 第</p>\n<p>一步都不 願意踏出 。 第二 個 是 「 目 標 太模 糊 」 —— 「 我要 變 健康 」 是 一 個 願 望 ， 不是 一 個 行 動 。 你</p>\n<p>的大腦不知道 「 健康 」 是 什 麼 ， 所以 它 什 麼 都 不 做 。 第 三 個 是 「 情 緒 門 檻 太 高 」 —— 你 覺 得 「 沒 準</p>\n<p>備好」、「 沒 靈感 」 、 「 沒 心情 」 ， 所以你等 待 一 個 「 完 美 時 機 」 。 但 完 美 時 機 不 存 在 。</p>\n<p>心理學家 研究 「 實 施 意 向 」 理 論 發 現 ， 把 「 我要 做 什 麼 」 轉 化成 「 如果 什 麼 時 候 ， 我 就做 什 麼 」 ，</p>\n<p>可以大幅提高行 動 率 。 不是 「 我要多 運動 」 ， 是 「 如果下 午 六 點 下 班 ， 我 就去 健 身 房 三 十 分 鐘 」 。</p>\n<p>不是「我要 讀更多 書 」 ， 是 「 如果 睡 前 躺 上 床 ， 我 就 讀 十 分 鐘 」 。 這 個 「 If-Then 」 計 畫 的 魔 力在</p>\n<p>於，它把 決定 權 從 你 的 「 心情 」 轉 移 到了你 的 「 設 計 」 。</p>\n<p>但我想分享 一 個更 簡 單 的 方法 ： 「 三 秒 開 關 」 。 當 你 想 到要 做 某 件事 的 時 候 ， 倒 數 三 秒 ， 然 後 立 刻</p>\n<p>行動。三 、二 、一， 站 起 來 。 三 、 二 、一， 打 開 電 腦 。 三 、 二 、一， 穿 上 運動 鞋 。 這 個 方法之所</p>\n<p>以有效，是 因 為 它切 斷 了你大 腦 的 「 猶 豫 迴 路 」 。 你 的 大 腦 來 不 及 找 藉 口 ， 你 的 身 體 已 經 開 始 行 動</p>\n<p>了。</p>\n<p>我認識一 個作家 ， 她 說 她 每 次 寫 作前 都 會 掙 扎 三 十 分 鐘 。 「 我不 夠 好 」 、 「 我 沒 靈 感 」 、 「 我 還沒 準 備</p>\n<p>好」。後來 她發 現 ， 只 要 強 迫 自 己 坐 下 來 寫 「 第 一 句 」 ， 不 管 寫 得 多 爛 ， 十五 分 鐘 後 她 就 會進 入 狀</p>\n<p>態。她說 ： 「 靈感 不是等 來 的， 是 開 始 之 後 才 來 的。 」</p>\n<p>想像是免 費 的，行 動 才 是 貨 幣 。 擴 容 不是 想得 更 清 楚 ， 是 動 得 更 早 。 當 你下 一 次 發 現 自 己 在 「 準</p>\n<p>備」的時 候 ，問自 己 ： 「 如果我现在 就 開 始 ， 最 壞 的 結 果是 什 麼 ？ 」 通 常 你 會發 現 ， 最 壞 的 結 果 ，</p>\n<p>也沒有你想 的 那 麼 糟 。</p>\n<p>32擴容不是 讓你 把 計 畫 做得 更 完 美 ， 是 讓 你在 計 畫 做 到 六 十 分 的 時 候 就 開 始 行 動 。 因 為 在行 動 中 修</p>\n<p>正，永遠比在 計 畫 中 追 求完 美 ， 來 得 更 有 效 。</p>\n<p>【80 字摘要】大 腦 預 設 模 式 網 絡 熱 衷 規 劃 卻 迴 避 行 動 ， 導 致 「 想 多 做少 」 。 透 過 「 三 秒 開 關 」 切 斷 猶 豫 迴 路 ， 配</p>\n<p>合「實施意 向 」 的 If-Then 計 畫 ， 把 想 法 變 成 動 作 ， 讓 擴 容 從 動 得 更 早 開 始 。</p>\n<p>【五個關 鍵字】 啟 動 力 、 實 施 意 向 、 三 秒 開 關 、 預 設 模 式 網 絡 、 行 動 偏 誤</p>"},
  {id:18, dim:"dim3", title:"能 量管理 ： 你不是 沒 時 間 ， 你是 沒 力 氣", summary:"當你 說 「 我 沒 時 間 」 ， 真 正 的 意 思往往 是 「 我 沒 能 量 」 。 時 間 是 固 定 的， 但 能 量 可以 管", content:"<p>第 18 篇：能 量管理 ： 你不是 沒 時 間 ， 你是 沒 力 氣</p>\n<p>當你 說 「 我 沒 時 間 」 ， 真 正 的 意 思往往 是 「 我 沒 能 量 」 。 時 間 是 固 定 的， 但 能 量 可以 管</p>\n<p>理。透過 「能量 審 計 」 ， 找 出你 的 充 電與 耗 電 源 ， 讓 擴 容 從 保 護 能 量 開 始 。</p>\n<p>週末，你排 滿了進 修 、 健 身 、 社 交 ， 每 一 個 時 段 都被 善 用 。 週 日 晚 上 ， 你 累 到 想 請 病假 。 你 坐 在</p>\n<p>沙發上，看著 週末 的 行 事 曆 ， 心 想 ： 「 我明明 有 時 間 做 這 些 事 ， 為 什 麼 我 感 覺 這 麼 累 ？ 」 因 為 你 管</p>\n<p>理的不是 時 間 ，是行 程 。 而真 正 決 定你能 做 多 少事 的， 不是 時 間 ， 是能 量 。</p>\n<p>Jim Loehr 與  Tony Schwartz 在 《 能 量管 理 》 中 提出 一 個 核 心 觀 點 ： 時 間 是 有 限 的， 但 能 量 是可</p>\n<p>以管理的。他 們說 ， 能 量 有 四 個 維 度 —— 身 體 能 量 （ 吃 、 睡 、 動 ） 、 情 緒 能 量 （安全 感 、 自信心） 、</p>\n<p>心智能量（ 專注 、 創 意） 、 精 神 能 量 （ 目 標 感 、 意 義 感 ） 。 大多 數 人 只 管 理 時 間 ， 不 管 理能 量 。 所</p>\n<p>以你安排了 十 個會 議 ， 卻 沒 有 安 排 休 息 ； 你 排 滿 了 週 末 ， 卻 沒 有 給 自 己 充 電 的 時 間 。</p>\n<p>心流理論 的 創 始人  Mihaly Csikszentmihalyi 說 ， 當 你 處 於 「 心 流 」 狀 態 —— 挑 戰 與 能力 匹 配 的</p>\n<p>時刻 —— 時 間會消 失 ， 能 量 會 湧 現 。 相 反 地 ， 當 你 處 於 「 無 聊 」 或 「 焦 慮 」 的 狀 態 ， 時 間 會 變 得 漫</p>\n<p>長，能量會被快 速 耗 盡 。 問題 是 ， 大多 數 人 的 工作 日 裡 ， 心 流 時 刻 太 少 了 ， 能 量 耗 損 時 刻 太 多</p>\n<p>了。</p>\n<p>能量管理不是 時 間 管 理 。 時 間 管 理 問 「 我 有 多 少 小 時 」 ， 能 量管 理 問 「 我 有 多 少 力 氣 」 。 你可以 有</p>\n<p>八小時的 時 間 ， 但只 有 兩 小 時 的 高品 質 能 量 。 關 鍵 是 ： 你 把 這 兩 小 時 用在 哪 裡 ？</p>\n<p>我認識一 個高 階主 管 ， 他 每 天 早 上 的 第 一 個 小 時 只 做 一 件事 —— 思 考 。 不看 Email 、 不接 電 話 、 不</p>\n<p>開會。他 說 ： 「 那 是我 一 天 中 能 量 最高 的 時 候 ， 我 把 它 留 給 最 重 要 的 事 。 」 下 午 兩 點 到 四 點 ， 他 安</p>\n<p>排不需要 深度 思 考 的 行 政 工作 ， 因 為 他 知道 那 時 候 他 的 能 量 最 低 。 他管 理 的 不是 時 間 表 ， 是能 量</p>\n<p>曲線。</p>\n<p>如果你也 覺得 「 沒 時 間 」 ， 我 想 邀 請 你 做 一 個 「 能 量 審 計 」 。 連 續 三天 ， 記 錄 你 做 的 每 一 件事 ， 然</p>\n<p>後標註：這件事 讓 我 「 充 電 」 還 是 「耗 電 」 ？ 不是 「 喜 歡 」 或 「 討 厭 」 ， 是 「 做完 之 後 我更 有 精</p>\n<p>神」還是 「做完之 後 我 想 躺 下 」 。 你 會發 現 ，有 些 你以 為 「 放 鬆 」 的 事 （ 比 如 刷 手 機 兩 小 時 ）其 實</p>\n<p>很耗電，有 些你以 為 「 工作 」 的 事 （ 比 如 跟 同 事 腦 力 激 盪 ）其 實 很 充 電 。</p>\n<p>33時間是公平 的， 每 個 人 一 天 都二 十 四 小 時 。 能 量 是不公平 的，有 人 精 力 充 沛 ，有 人 容 易 疲 累 。 擴</p>\n<p>容不是爭取更多 時 間 ， 是 保 護 你 的 能 量 。 當 你 學 會 管 理能 量 ， 你 就 會發 現 ： 你不 需 要更多 時 間 ，</p>\n<p>你只需要在對 的 時 間 ， 做 對 的 事 。</p>\n<p>【80 字摘要】 時 間 固 定 但 能 量 可 管 理 ， 透 過 「 能 量 審 計 」辨 識 充 電與 耗 電 活 動 ， 配 合 個 人能 量 曲 線 安 排 工作 ， 讓</p>\n<p>擴容從保 護高品 質 能 量 開 始 ， 在 對 的 時 間 做 對 的 事 ， 而 非 追 求 更多 時 間 。</p>\n<p>【五個關 鍵字】能 量管 理 、 Jim Loehr 、 心 流 、 能 量 審 計 、 時 間 管 理</p>"},
  {id:19, dim:"dim4", title:"害 怕 老 闆 的 三 種 可能 ： 你 怕 的 從 來 不是 那 個 人", summary:"當老 闆 已 讀 不回 讓 你 煎 熬 三小 時 ， 你不是 怕 老 闆 ， 你是 怕 權 力 、 怕 評 價 、 怕 那 個 還 在等", content:"<p>第 19 篇： 害 怕 老 闆 的 三 種 可能 ： 你 怕 的 從 來 不是 那 個 人</p>\n<p>當老 闆 已 讀 不回 讓 你 煎 熬 三小 時 ， 你不是 怕 老 闆 ， 你是 怕 權 力 、 怕 評 價 、 怕 那 個 還 在等</p>\n<p>別人說「你 夠好 」 的 自 己 。 透 過 「 老 闆 去 魅 化 」 與 「 自我 評 價 清 單 」 ， 將 價 值 判 斷 權 收回自 己 手 中。</p>\n<p>下午四點 ，你 傳了 一 封 Email 給 老 闆 。 已 讀 。 三小 時 四 十 二 分 鐘 過 去 了 ， 沒 有 回 覆 。 你 腦 海 開 始 上</p>\n<p>演連續劇 ： 「他是不是 對 我不 滿 意 ？ 」「 我是不是 說 錯 話 了 ？ 」「 這 個 專 案 會 不 會 被 砍 掉 ？ 」 你 每 隔 十</p>\n<p>分鐘就檢查 一次手 機 ， 每 一 次 沒 有 回 覆 ， 你 的 焦 慮 就 上 升 一 格 。 晚 上 十 一 點 ， 你 終 於 睡 著 了 ， 但</p>\n<p>夢裡老闆在 質問你 ： 「 為 什 麼 還沒 做 好 ？ 」</p>\n<p>104獵才顧問 Seven 觀 察 過 數 千 個 職 場 個 案 ， 他 說 ： 「 怕 上 級 的 經 驗 裡 ， 恐 懼 的 對 象往往 不是 『 那</p>\n<p>個人』，而是 『 那 個 位 置 』 所 代 表 的 權 力 與 不 確 定性 。 」 加 州 大 學 心理 學 家 Dacher Keltner 研究</p>\n<p>權力與情 緒 ，他發 現 低 權 力者 會 過 度 解 讀 上 級 的 每 個 表情 、 每 句 話 、 每 個 已 讀 不回 。 不是 因 為 上</p>\n<p>級在恐嚇你 ，是 因 為 你 的 大 腦 在 「 權 力 差 距 」 中 自 動 進 入 警 戒 狀 態 。</p>\n<p>怕老闆有三 個真 實 來 源 。 第 一 個 是 「 童 年 權 威 的 投 射 」 。 你 對 老 闆 的 反 應 ， 可能不是 針 對 老 闆 這 個</p>\n<p>人，是針對你內心 那 個 「 嚴 厲 的 父 親 」 或 「 苛 求 的 老 師 」 。 老 闆 沒 有 回你 Email ， 你 感 覺 像 小 時 候</p>\n<p>父親忽視你 一 樣 。 第二 個 是 「 自我 價 值 的 外 包 」 。 你 把 「 我 夠 不 夠 好 」 的 判 斷 權 交 給 了 老 闆 ， 他 的</p>\n<p>每一個表情都 變成你 的 成 績 單 。 第 三 個 是 「 災 難 化 想 像 」 —— 已 讀 不回等 於 「 我要 被 開 除 了 」 ，一</p>\n<p>個批評等於 「我 永 遠 升 不了 遷 」 。 你 的 大 腦 在 零 點 幾 秒 內 ， 就 從 一 個 小 事件 編 出了 一 部 末 日 電 影 。</p>\n<p>我認識一 個行 銷 專 員 ， 她 每 次看到 老 闆 走 過來 就 心 跳 加 速 。 後 來 她 做 了 一 個 「 老 闆 去 魅 化 」 練</p>\n<p>習：她開 始 觀察老 闆 作 為 「 一 個 人 」 的 細 節 —— 他 喝 咖 啡 會 皺 眉 、 緊 張 時 會 摸 後 頸 、 開 完 長 會 也 會</p>\n<p>打哈欠。 她 說 ： 「 當 我看 見 他也 會 累 、 也 會 緊 張 、 也 會 不知道 怎 麼 辦 的 時 候 ， 他 突 然 變 得 不 那 麼 可</p>\n<p>怕了。他不是 神 ， 他 只 是 一 個 也 有 壓 力 的 人 。 」</p>\n<p>如果你想收回對老 闆 的 恐 懼 ， 我 想 邀 請 你 做 兩 件事 。 第 一 件 ： 「 老 闆 去 魅 化 」 。 下 週 ， 觀 察 老 闆 的</p>\n<p>三個「人 類 時刻 」 —— 他 什 麼 時 候 會 累 、 會 猶 豫 、 會 犯 錯 ？ 寫 下 來 。 這 不是 為 了 批 評 他 ， 是 為 了 讓</p>\n<p>你的大腦知道 ：他 不是 權 力 的 化 身 ， 他 是 一 個 人 。 第二件 ： 建立 「 自我 評 價 清 單 」 。 每 週 五 ， 寫 下</p>\n<p>34三件你這週做得好 的 事 。 不是等 老 闆 說 你 做得 好 ， 是你自 己 說 。 當 你 有 了自我 評 價 的 能力 ， 老 闆</p>\n<p>的評價就會 變成 「 參 考 」 ， 而 不是 「 判 決 」 。</p>\n<p>你怕的不是老 闆 。 你 怕 的 是 那 個 還 在等 別 人 說 「 你 夠 好 」 的 自 己 。 擴 容 不是 讓 老 闆 變 溫 柔 ， 是 讓</p>\n<p>你變堅定 。 當你收回 價 值 判 斷 的 權 力 ， 你 就 會發 現 ： 老 闆 只 是 老 闆 ， 而 你 ， 是你自 己 最好 的 評 價</p>\n<p>者。</p>\n<p>【80 字摘要】怕老 闆 的 根 源 在 於 童 年 權 威 投 射 、 自我 價 值 外 包 與 災 難 化 想 像 。 透 過 「 老 闆 去 魅 化 」 觀 察 老 闆 的 人</p>\n<p>性時刻， 配合 「自我 評 價 清 單 」 每 週 記 錄 三 件做得 好 的 事 ， 收回 價 值 判 斷 權 ， 讓 擴 容 發 生在自我 肯 定 中。</p>\n<p>【五個關 鍵字】 害 怕 老 闆 、 Dacher Keltner 、 權 力 研究 、 老 闆 去 魅 化 、 自我 評 價</p>"},
  {id:20, dim:"dim4", title:"當同 事 準 時 下 班 ， 你 卻 在加 班 ：一 場 關 於 選 擇 權 的 內 戰", summary:"當你加 班 到 深 夜 看 見 同 事 準 時 離 開 ， 你 氣 的 不是 他 ， 是你自 己 不 敢 選 擇 的 自 由 。 透 過", content:"<p>第 20 篇： 當同 事 準 時 下 班 ， 你 卻 在加 班 ：一 場 關 於 選 擇 權 的 內 戰</p>\n<p>當你加 班 到 深 夜 看 見 同 事 準 時 離 開 ， 你 氣 的 不是 他 ， 是你自 己 不 敢 選 擇 的 自 由 。 透 過</p>\n<p>「邊界實 驗 」 ，重 新 校 準準 時 下 班 的 安全 感 ， 讓 擴 容 從 選 擇 權 的 練 習 開 始 。</p>\n<p>晚上七點 十五分 ， 辦 公 室 的 燈 還 亮 著 三分之 一。 隔壁 小 林 哼 著 歌 走向 電 梯 ， 背 包已 經 背 好 ， 腳 步</p>\n<p>輕快。你 低 頭看著 還沒 跑 完 的 報 表 ， 心 裡 湧 起 一 陣 酸 澀 ： 「 憑 什 麼 ？ 」 憑 什 麼 他 可以 準 時 下 班 ， 我</p>\n<p>卻要在這 裡加 班？ 憑 什 麼 他 看 起 來 那 麼 輕 鬆 ， 我 卻 這 麼 累 ？ 憑 什 麼 ？</p>\n<p>職涯諮詢 師說 過 一 個 洞 察 ： 當 我 們 因 「 別 人 過 得 輕 鬆 」 而 生 氣 ， 往往 不是 因 為 那 個 人 ， 是 因 為 我</p>\n<p>們覺得自 己 「 沒 有 選 擇 」 。 你不是 嫉妒 小 林 的 輕 鬆 ， 你是 嫉妒 他 的 「 選 擇 自 由 」 —— 他 可以 選 擇 準</p>\n<p>時下班，而你 覺得 自 己 「 不能 」 。 但 真 的 是不能 ， 還 是不 敢 ？</p>\n<p>加班羨慕 有三 個真 相 。 第 一 個 ： 你 羨 慕 的 不是 輕 鬆 ， 是 選 擇 。 小 林 準 時 下 班 不是 因 為 工作 少 ， 是</p>\n<p>因為他設了 邊 界 。 你加 班 不是 因 為 工作多 ， 是 因 為 你 沒 有 說 「 這 個 我明天 再 做 」 。 第二 個 ： 加 班 可</p>\n<p>能是一種 角色 扮 演 。 你用最 後 一 個 離 開 辦 公 室 來 證 明 「 我 很 努 力 」 ， 但 努 力不是用 時 間 衡 量 的， 是</p>\n<p>用成果衡量 的。第 三 個 ： 其 實 你 有 選 擇 ， 只 是不 敢 承 擔 後 果 。 你 怕 準 時 下 班 會 被 認 為 「 不 認 真 」 ，</p>\n<p>所以你用加 班 來 換 取 安全 感 。 但 這 個 交 易 ， 真 的 值 得 嗎 ？</p>\n<p>我認識一 個會 計 師 ， 她 連 續 三年 都 是 辦 公 室 最 後 一 個 離 開 的 人 。 她 以 為 這 會 換 來 升 遷 ， 但 年度 考</p>\n<p>核時主管 說 ： 「 妳 很 認 真 ， 但 妳 的 效 率 需 要提 升 。 」 那 一 刻 她 才 意 識 到 ， 加 班 不是 勳 章 ， 是 警 訊 ——</p>\n<p>她沒有管理好 時 間 ， 她 在用加 班 來 掩 蓋 這 個 問題 。</p>\n<p>如果你也 卡在 「想 準 時 下 班 但 不 敢 」 的 困 境 裡 ， 我 想 邀 請 你 做 一 個 「 邊 界 實 驗 」 。 下 週 ， 選 一 天 ，</p>\n<p>強迫自己 準 時下 班 。 不是 「 盡 量 」 ， 是 「 強 迫 」 。 不 管 報 表 還沒 跑 完 ， 不 管 Email 還沒 回 完 ， 六 點</p>\n<p>關電腦，離 開 辦公 室 。 然 後 記 錄 三 件事 ： 你 的 焦 慮 指 數 、 你 擔 心 會發 生 的 事 、 以 及 三天 後 檢 視 ：</p>\n<p>那些擔心 的事 ，有 多 少真 的 發 生了 ？</p>\n<p>35你會發現 ， 世界 沒 有 崩 塌 。 報 表 隔 天 早 上 跑 完 了 ， Email 隔 天回 也 沒 有 人 抗 議 ， 主 管 甚 至 可能 根 本</p>\n<p>沒注意到你 準 時下 班 。 你 擔 心 的 後 果 ， 絕 大多 數 都 不 會發 生 。 而真 正 發 生 的 是 ： 你 發 現 自 己 「 可</p>\n<p>以」選擇 。這 個發 現 ， 會 慢慢 瓦 解 你 對 加 班 的 依 賴 。</p>\n<p>你羨慕的不是同事 的 輕 鬆 ， 是你自 己 不 敢 選 擇 的 自 由 。 擴 容 不是 讓 你 變 成 準 時 下 班 的 人 ， 是 讓 你</p>\n<p>知道 ——你 永 遠 有 選 擇 。 而 選 擇 的 勇 氣 ， 就 像 肌 肉 ， 越 練 越 強 。</p>\n<p>【80 字摘要】加 班 羨 慕 的 根 源 在 於 感 覺 自 己 沒 有 選 擇 權 。 透 過 「 邊 界 實 驗 」 強 迫 自 己 準 時 下 班 一 天 ， 記 錄 焦 慮 與</p>\n<p>實際後果 ，發 現 世界 並 未 崩 塌 ， 重 新 練 習 選 擇 的 自 由 ， 讓 擴 容 從 邊 界 設 定 開 始 。</p>\n<p>【五個關 鍵字】加 班 、 選 擇 權 、 邊 界 實 驗 、 職 場 比 較 、 時 間 管 理</p>"},
  {id:21, dim:"dim4", title:"會 議 室 裡 的 沈 默 ， 是你 放 棄 話 語 權 的 證 據", summary:"當你明明 有 想 法 卻 選 擇 沈 默 ， 你不是在 保持 禮 貌 ， 你是在 一 點 一 點 讓 出自 己 的 領 地 。 透", content:"<p>第 21 篇：會 議 室 裡 的 沈 默 ， 是你 放 棄 話 語 權 的 證 據</p>\n<p>當你明明 有 想 法 卻 選 擇 沈 默 ， 你不是在 保持 禮 貌 ， 你是在 一 點 一 點 讓 出自 己 的 領 地 。 透</p>\n<p>過「最小發聲 」 練 習 ， 從 一 句 話 開 始 重建 話 語 權 ， 讓 擴 容 從 有 聲 音 開 始 。</p>\n<p>主管在白 板上 畫 策 略 ， 你心 裡 有一 個 擔 憂 。 你注意到 一 個 漏 洞 ，一 個 可能出 問題 的 地方 ，一 個 更</p>\n<p>好的做法 。你 的 嘴 唇 動 了 一 下 ， 但 看了 周 圍 點 頭 的 同 事 ， 又低 下 頭 假 裝 記 筆 記 。 三 個 月 後 策 略 出</p>\n<p>問題，主管問 ： 「 當 初 為 什 麼 沒 人提出 來 ？ 」 你 低 下 頭 ， 心 裡 說 ： 「 我 有， 但 我 沒 說 。 」</p>\n<p>社會心理 學家  Solomon Asch 在 1951 年 做 了 著 名 的 從 眾 實 驗 。 他 讓 一 群 人 判 斷 線 段 的 長 度 ， 其 中</p>\n<p>只有一個是真正 的 受 試 者 ， 其 他都 是 演 員 。 當 演 員 們 故 意 給 出 錯 誤 答 案 時 ， 75% 的 受 試 者 至 少 會</p>\n<p>有一次跟 隨多 數人 的 錯 誤 判 斷 。 即使 明知 答 案 是 錯 的， 他 們 還 是 選 擇 沈 默 ， 只因 不 想 與 眾 不同 。</p>\n<p>組織行為學 把這 稱 為 「 話 語 權 讓 渡 」 —— 你明明 有 權 利 說 話 ， 但 你 選 擇 把 這 個 權 利交 了出 去 。</p>\n<p>沈默有三 個 偽 裝 。 第 一 個 是 「 我在 觀 察 」 —— 你 說 服自 己 「 我 還 在 聽 ， 還 在 想 」 ， 但 會 議 結 束 後 ，</p>\n<p>你的觀點 從 來 沒 有 被 聽 見 。 第二 個 是 「 我不 想 當 出 頭 鳥 」 —— 你 怕 別 人 覺 得 你 愛 表 現 、 難 相 處 、 破</p>\n<p>壞和諧。 但你不知道 ，有 時 候 「 和 諧 」 只 是 「 沒 人 說 真 話 」 的 代 名 詞 。 第 三 個 是 「 我 說 了 也 沒 用 」</p>\n<p>——你假 設自 己 的 想 法不 會 被 採 納 ， 所以你 連 試 都 不 試 。 但 這 個 假 設 ，有 沒 有 可能 只 是你 給 自 己 的</p>\n<p>藉口？</p>\n<p>我認識一 個 產品 經 理 ， 她 在 會 議 裡 從 不 發 言 。 「 我 只 是 比 較 內 向 」 ， 她 這 樣 說 。 但 後 來 她 發 現 ， 她</p>\n<p>的不發言 讓 團 隊 錯 過 了好 幾 個 重 要 的 風 險 提 醒 。 她 開 始 練 習 「 最小 發 聲 」 ： 會 議 前 寫 下三 個 「 如果</p>\n<p>是我，我會問 的問題 」 ， 會 議 中 至 少 說 一 句 話 。 她 說 ： 「 第 一 次 說 話 的 時 候 ， 我 的 聲 音 在 抖 。 但 當</p>\n<p>我發現沒 有人嘲 笑 我 ， 主 管 甚 至 說 『 這 個 問題問 得 好 』 的 時 候 ， 我 開 始 相信 ： 我 的 聲 音 有 價 值 。 」</p>\n<p>如果你也想在會 議 室 裡 找 回 話 語 權 ， 我 想 邀 請 你 做 兩 件事 。 第 一 件 ： 會 議 前 ， 寫 下三 個 問題 。 不</p>\n<p>是評論，是問題 。 例 如 「 這 個 策 略 的 風 險 是 什 麼 ？ 」「 我 們 有 考 慮 過 B 方 案 嗎 ？ 」「 數 據 支持 這 個 假 設</p>\n<p>36嗎？」問題比評論安全 ， 但 同 樣 有 效 。 第二件 ： 會 議 中， 說 一 句 話 。 不用多 ，一 句 就 好 。 也 許 是</p>\n<p>「我補充 一 個 數 據 」 、 「 我 有一 個 擔 心 」 、 「 這 個 方 向 我 支持 」 。 最小 發 聲 的 目 的 不是 讓 你 變 成 話 最多</p>\n<p>的人，是 讓你 的大 腦 習 慣 「 在 群 體 中 表 達 」 這 件事 。</p>\n<p>會議室裡 的 沈默 ， 是你 一 塊 一 塊 讓 出 的 領 地 。 擴 容 不是 讓 你 變 成大 聲 的 人 ， 是 讓 你成 為 「 有 聲 音 」</p>\n<p>的人。因 為你 的 觀 點 有 價 值 ， 你 的 想 法 值 得被 聽 見 ， 而 你 ， 值 得 在 這 個 房 間 裡 佔 有一 席 之地 。</p>\n<p>【80 字摘要】會 議 沈 默 源 於 從 眾 壓 力 與 話 語 權 讓 渡 ， 讓 有 價 值 的 觀 點 無 法 被 聽 見 。 透 過 「 最小 發 聲 」 練 習 —— 會</p>\n<p>議前準備三 個問題 、 會 議 中 至 少 說 一 句 話 —— 從 小 處 開 始 重建 話 語 權 ， 讓 擴 容 從 有 聲 音 開 始 。</p>\n<p>【五個關 鍵字】會 議 沈 默 、 Solomon Asch 、 從 眾 實 驗 、 最小 發 聲 、 話 語 權</p>"},
  {id:22, dim:"dim4", title:"辦公 室 沒 有 朋 友 ， 但 你 需 要 弱 連 結", summary:"當你 說 「 同 事 只 是同 事 」 ， 你可能正在 切 斷 職 場 裡 最 重 要 的 養 分 來 源 。 透 過 「 弱 連 結 地", content:"<p>第 22 篇： 辦公 室 沒 有 朋 友 ， 但 你 需 要 弱 連 結</p>\n<p>當你 說 「 同 事 只 是同 事 」 ， 你可能正在 切 斷 職 場 裡 最 重 要 的 養 分 來 源 。 透 過 「 弱 連 結 地</p>\n<p>圖」，讓關 係 從 封 閉 擴 容 為 開 放 網 絡 ， 發 現 那些 「 不 太 熟 」 的 人是最意外 的 扶 手 。</p>\n<p>茶水間裡 ， 咖啡機 發 出 規 律 的 運 轉 聲 。 同 事 走 進 來 ， 你 們 點 頭 微 笑 ， 各 自 盯 著 咖 啡 機 ， 三 十 秒 沈</p>\n<p>默像三十分 鐘 。你心 想 「 快 點 泡 完快 點離 開 」 ， 卻 不知道 他 掌 握 著 另 一 個 部 門 正在 徵 人 的 消 息 ， 而</p>\n<p>那個職位 ，可能是你 夢 寐 以 求 的 轉 機 。</p>\n<p>社會學家  Mark Granovetter 在 1973 年 發 表了 著 名 的 「 弱 連 結 理 論 」 。 他 發 現 ， 真 正 帶 來 新 機 會</p>\n<p>的，往往是 「 偶 爾 聯 繫 」 的 人 ， 而 非 親 密 好友 。 這 個 發 現 顛 覆 了我 們 的 直 覺 —— 我 們 以 為 關 係 的 價</p>\n<p>值在於「 深度 」 ， 但 Granovetter 證 明 ， 關 係 的 價 值 也 在 於 「 廣 度 」 。 你 的 摯 友知道 的 事 情 跟 你 差 不</p>\n<p>多，但那些 「 認識 但 不 太 熟 」 的 人 ， 連 結 著 你 從 未 接 觸 過 的 世界 。</p>\n<p>弱連結有三 個 誤解 。 第 一 個 ： 「 弱 連 結 等 於 假 掰 社 交 」 。 不是 。 假 掰 社 交 是 交 換 名片 後 再 也 不 聯</p>\n<p>絡，弱連 結是真 誠 的、有 質 量 的 「 偶 爾 互 動 」 。 第二 個 ： 「 需 要 共 同 興 趣 才 能 建立 」 。 不 需 要 。 職 場</p>\n<p>裡的弱連 結可以 只 是 「 每 週 五 在 電 梯 裡 聊 兩 句 天 氣 」 或 「 偶 爾 在 走 廊 上 問 一 句 『 那 個 專 案 還 順 利</p>\n<p>嗎』」。第三 個 ： 「 同 事 會 搶 功 勞 」 。 這 個 恐 懼 讓 很 多人 封 閉 自 己 ， 但 研究 顯 示 ， 開 放 的 職 場 網 絡 反</p>\n<p>而會增加你 的可 見 度 與機 會 ， 而 不是 減 少 。</p>\n<p>我認識一 個工程 師 ， 他 在公司 五 年 ， 認識 的 人不到 十 個 。 他 說 「 我不 需 要 朋 友 ， 我 來 工作 的 」 。 但</p>\n<p>當他部門被 裁 撤 的 時 候 ， 他 發 現 自 己 不知道 該 找 誰 打 聽 其 他 部 門 的 機 會 。 反 觀 另 一 個 同 事 ， 平 時</p>\n<p>跟各部門 的人都 有 「 點 頭 之 交 」 ， 轉 調 通知 一 出 ， 他就 透 過 弱 連 結 找 到了 新 位 置 。 工 程 師 後 來 說 ：</p>\n<p>「我以為人 際關 係 是成本 ， 但 原 來 它 是 保 險 。 」</p>\n<p>如果你想 讓職 場關 係 擴 容 ， 我 想 邀 請 你 做 一 個 「 弱 連 結 地 圖 」 。 拿 出 紙 筆 ， 列 出 十 個 「 認識 但 不 太</p>\n<p>熟」的人 ——也 許 是其 他 部 門 的 同 事 、 偶 爾 合作 的 專 案 夥 伴 、 在 電 梯 裡 會 打 招 呼 的 人 。 然 後 寫 下 兩</p>\n<p>37件事：「你知道 但 別 人可能不知道 」 的 事 （你 的 專 長 、 你 的 經 驗 ） ， 以 及 「 你 想 從 他 那 裡 知道 」 的</p>\n<p>事（他的部門在做 什 麼 、 他 怎 麼 解 決 那 個 問題 ） 。 最 後 ， 選 三 個 人 ， 發 一 封 簡 短 的 訊 息 ： 「 嗨 ， 最</p>\n<p>近有個問題想請教 你 的 看法 …… 」</p>\n<p>辦公室不 需要 朋友 ， 但需 要 橋樑 。 那些 「 不 太 熟 」 的 人 ， 往往 是你 職 場 擴 容 時 ， 最意外 的 扶 手 。</p>\n<p>因為機會不會 從天上 掉 下 來 ， 它 是 透 過 人 ，一 個 一 個 傳 到你面前 的。</p>\n<p>【80 字摘要】 弱 連 結 是 職 場 機 會 的 重 要 來 源 ， 透 過 「 弱 連 結 地 圖 」辨 識 十 個 認識 但 不 太 熟 的 對 象 ， 發 掘 彼 此 可 交</p>\n<p>換的知識 與 經 驗 ， 主 動 發 出三 封 請 教 訊 息 ， 讓 擴 容 從 關 係 網 絡 的 開 放 開 始 。</p>\n<p>【五個關 鍵字】 弱 連 結 、 Mark Granovetter 、 職 場 人 脈 、 關 係 擴 容 、 機 會 網 絡</p>"},
  {id:23, dim:"dim4", title:"被主 管 批 評 後 ， 如 何 不 讓 一 句 話 摧 毀 一 整 天", summary:"當主管 一 句 「 重做 」 讓 你 反 覆 回 放 六 小 時 ， 你不是 太 脆 弱 ， 你 只 是 還沒 學 會 「 批 評 拆", content:"<p>第 23 篇： 被主 管 批 評 後 ， 如 何 不 讓 一 句 話 摧 毀 一 整 天</p>\n<p>當主管 一 句 「 重做 」 讓 你 反 覆 回 放 六 小 時 ， 你不是 太 脆 弱 ， 你 只 是 還沒 學 會 「 批 評 拆</p>\n<p>解」。透過分 離 、萃 取 、 歸檔 三 步 驟 ， 把 批 評 變 成 數 據 ， 讓 擴 容 從 情 緒 隔 離 開 始 。</p>\n<p>主管指著你 的 報告 說 ： 「 這 個 數 據 呈 現 不 對 ， 重做 。 」 語 氣 平 淡 ， 沒 有 生 氣 ， 沒 有 責 備 。 但 你 的 臉</p>\n<p>瞬間發燙 ， 像被 當 眾 打 了 一 巴 掌 。 接下 來 六 個 小 時 ， 你 無 法 專 心 。 那 句 話 在 腦 海 裡 自 動 播 放 ， 語</p>\n<p>調、表情 、 每 個 細 節 都放 大 檢 視 。 晚 上 躺 在 床 上 ， 你 還 在 想 ： 「 他 是不是 覺 得 我 很 爛 ？ 」「 我是不是</p>\n<p>不適合這 個工作？ 」「 他 會 不 會後 悔 升 遷 我 ？ 」</p>\n<p>Brené Brown在 研究 脆 弱 與 勇 氣 時 發 現 ， 讓 人最 痛苦 的 往往 不是 批 評 本 身 ， 是我 們 對 批 評 的 「 解</p>\n<p>讀」。認知行 為 療 法 的 核 心 觀 點 是 ： 事件 本 身 不 會 傷 害 你 ， 你 對 事件 的 解 讀 才 會 。 主 管 說 「 數 據 呈</p>\n<p>現不對」，這是 一 個 事 實 ； 但 你 的 大 腦 自 動 翻 譯 成 「 你不 夠 好 」 、 「 你 讓 我 失望 」 、 「 你可能 會 被 開</p>\n<p>除」。這些 翻 譯 ， 才 是 讓 你 痛苦 的 原 因 。</p>\n<p>批評有三 個放大 鏡 。 第 一 個 是 「 災 難 化 」 —— 單 一 事件 變 成 整 體 評 價 。 主 管 說 「 這 個 數 據 不 對 」 ，</p>\n<p>你聽成「你是 個 糟 糕 的 分 析 師 」 。 第二 個 是 「 讀 心 術 」 —— 你 假 設 自 己 知道主 管 在 想 什 麼 。 「 他 一 定</p>\n<p>覺得我很 懶 」 、 「他 一 定 後 悔 僱 用我 」 。 但 你 有 沒 有 想 過 ， 他 可能 只 是 覺 得 「 這 個 數 據換 個 方式 呈 現</p>\n<p>會更清楚 」？第三 個 是 「 永 恆 化 」 —— 你 認 為 這 個 批 評 會 永 遠 跟 著 你 。 「 我以 後 都 會 被 這 樣 看 」 。 但</p>\n<p>批評是針對 「這件事 」 ， 不是 針 對 「 你 這 個 人 」 。</p>\n<p>我認識一 個品 牌 經 理 ， 她 每 次 被 批 評 都 會 哭 。 不是 當 場 哭 ， 是回家 哭 。 她 說 ： 「 我知道我不 應 該 這</p>\n<p>麼脆弱， 但我就是 控 制不了 。 」 後 來 她 學 會 了 一 個 方法 ： 「 批 評 拆 解 」 。 當 批 評 來 的 時 候 ， 她 給 自 己</p>\n<p>三十分鐘 的 「情 緒 時 間 」 —— 可以 難 過 、 可以生 氣 、 可以 覺 得 委 屈 。 三 十 分 鐘 後 ， 她拿 出 紙 筆 ， 開</p>\n<p>始拆解。</p>\n<p>38如果你也想 讓 批 評 不 再 摧 毀 你 的一 天 ， 我 想 邀 請 你 練 習 「 批 評 拆 解 」 三 步 驟 。 步 驟 一： 分 離 —— 寫</p>\n<p>下「主管 說了 什 麼 」 （ 事 實 ） ， 和 「 我以 為 他 在 說 什 麼 」 （ 解 讀 ） 。 把 這 兩 個 分 開 。 步 驟 二 ： 萃 取 ——</p>\n<p>在主管的 話 裡 ，有 沒 有 任何 「 可 操 作 的 數 據 」 ？也 許 是 「 數 據 呈 現 不 對 」 可以 轉 化成 「 下次用 圖</p>\n<p>表而不是表格 」 。 步 驟 三 ： 歸檔 —— 把 這 個 可 操 作 的 數 據 放 進 你 的 「 成 長 檔 案 夾 」 ， 把 關 於 「 你 夠 不</p>\n<p>夠好」的解 讀放進 「 垃圾 桶 」 。 批 評 是 職 場 的 常 態 ， 但 讓 它 摧 毀 你 的一 天 ， 是你 的 選 擇 。</p>\n<p>擴容不是 變得刀 槍 不入 ， 是 學 會 讓 批 評 穿 過 你 ， 像 風 穿 過 樹 林 。 你 還 是你 ， 只 是更 堅 定了 一 點 。</p>\n<p>【80 字摘要】 批 評 的 痛苦 來 自 災 難 化 解 讀 而 非 批 評 本 身 。 透 過 「 批 評 拆 解 」 三 步 驟 —— 分 離 事 實 與 解 讀 、 萃 取 可</p>\n<p>操作數據 、 歸檔到成 長 檔 案 夾 —— 將 批 評 轉 化 為 建 設 性回 饋 ， 讓 擴 容 從 情 緒 隔 離與 理性 拆 解 開 始 。</p>\n<p>【五個關 鍵字】 批 評 拆 解 、 Brené Brown 、 認 知行 為 療 法 、 情 緒 調 節 、 職 場 韌 性</p>"},
  {id:24, dim:"dim4", title:"升 遷 的 不是你 ：一 場 關 於 「 時 區 」 的 領 悟", summary:"當同期 升 遷 而 你 沒 有， 你不是 輸 了 ， 你 只 是 還 在 「 自 己 的 時 區 」 裡 。 透 過 「 時 區 日 誌 」 ，", content:"<p>第 24 篇： 升 遷 的 不是你 ：一 場 關 於 「 時 區 」 的 領 悟</p>\n<p>當同期 升 遷 而 你 沒 有， 你不是 輸 了 ， 你 只 是 還 在 「 自 己 的 時 區 」 裡 。 透 過 「 時 區 日 誌 」 ，</p>\n<p>拉回個人成 長 視 角 ， 讓 擴 容 從 停 止 用 別 人 的 時 區 來 懲 罰 自 己 開 始 。</p>\n<p>公司內網公告 欄上 ， 同 期 小 張 的 名 字 出 現 在 升 遷 名 單 裡 —— 資 深 經 理 。 你 笑 著 走 過 去 恭 喜 他 ， 拍 了</p>\n<p>拍他的肩 膀 說 「 太 棒 了 ， 值 得 」 。 他 笑 著 感 謝 。 你 轉 身 走 回 座 位 ， 臉 上 的 笑 容 像 退 潮 一 樣 消 失 。 你</p>\n<p>盯著螢幕 ，發 現看不 見 任何字 。 晚 上回家 ， 你 對 著 鏡 子 問 ： 「 是不是我不 夠 好 ？ 」</p>\n<p>社會心理 學家  Leon Festinger 在 1954 年提出 「 社 會 比 較 理 論 」 ， 他 說 人 類 天生 傾 向向 上 比 較 ——</p>\n<p>我們總是 拿自 己 跟 「 比 我 們 好 的 人 」 比 。 這 個 機 制本 來 是 為 了 激 勵 我 們 進 步 ， 但 在 職 場 裡 ， 它 變</p>\n<p>成了自我 懲 罰 的工 具 。一 個 職 涯 諮詢 師 用 「 時 區 」 比 喻 來 解 釋 這 件事 ：有 人 二 十 二 歲當 總 監 ，有</p>\n<p>人四十歲 創 業成 功 ，有 人三 十 歲 轉 行 從 頭 開 始 。 紐約 時 間 比 加 州 時 間 早 三 個 小 時 ， 但 加 州 時 間 並</p>\n<p>沒有變慢 。 每 個人 都 有 自 己 的 時 區 。</p>\n<p>升遷焦慮 有三 個 錯 覺 。 第 一 個 ： 「 同 期 等 於 同 一 起 跑 線 」 。 你 們 同 一 年 進 公司 ， 但 你 們 的 部 門 不</p>\n<p>同、主管不同 、機 遇 不同 。 他做 了三年 專 案管 理 ， 你在 做 內 部 流程 優 化 —— 這 兩 條 路 怎 麼 可能 比？</p>\n<p>第二個：「 沒 升 遷 等 於 沒 成 長 」 。 升 遷 是 組 織 給 的 標 籤 ， 成 長 是你自 己 的。 也 許 你 沒 有 升 遷 ， 但 你</p>\n<p>學會了帶人 、 學會 了 談 判 、 學 會 了在 壓 力下 保持 冷 靜 。 這 些 ， 都 是 無 法 被 「 職 稱 」 衡 量 的 價 值 。</p>\n<p>第三個：「他 的成 功 是我 的 失 敗 」 。 這 是 零 和 思 維 。 職 場 不是 一 場 只 有一 個 冠 軍 的 比 賽 ， 每 個 人 都</p>\n<p>可以在自 己 的 賽道上 贏 。</p>\n<p>我認識一 個行 銷 專 員 ， 她 看 著 同 期 升 遷 ， 心 裡 很 不是 滋 味 。 她 後 來 做 了 一 個 「 時 區 日 誌 」 ： 「 這 一</p>\n<p>年，我學會了 什 麼 ？ 」「 如果 沒 有 升 遷 這 個 指 標 ， 我如 何 評 價 這 一 年 ？ 」「 五 年 後 的 我 ， 會 如 何 看 待</p>\n<p>39這次沒升遷？ 」 她 寫 著 寫 著 ， 發 現 自 己 這 一 年 學 會 了 數 據 分 析 、 帶 過 一 個 跨 部 門 專 案 、 建立 了三</p>\n<p>個新的客 戶關 係 。 她 說 ： 「 我 突 然 發 現 ， 我不是 沒 有 成 長 ， 我 只 是用 錯 了 尺 。 」</p>\n<p>如果你也在 經 歷 「 升 遷 的 不是我 」 的 時 刻 ， 我 想 邀 請 你 做 一 個 「 時 區 日 誌 」 。 拿 出 紙 筆 ， 回 答 三 個</p>\n<p>問題。第 一：這 一 年 ， 不 論 大小 ， 我 學 會 了 什 麼 ？第二 ： 如果 沒 有 「 升 遷 」 這 個 指 標 ， 我 會 如 何</p>\n<p>評價這一年？第三 ： 五 年 後 的 我 ， 會 如 何 看 待 今 天 這 個 「 沒 升 遷 」 的 時 刻 ？ 這 三 個 問題 的 目 的 不</p>\n<p>是自我安 慰 ，是 幫 你 拉 回 「 自 己 的 時 區 」 。</p>\n<p>職涯不是 一 場 統 一的 賽 跑 ， 是 各 自 的 花期 。 三 十 歲 沒 當 上主 管 ， 不是 輸 了 ， 是 選 了 另 一 種 贏 法 。</p>\n<p>擴容不是 讓你 追上 別 人 ， 是 讓 你在自 己 的 時 區 裡 ， 好好 扎 根 。 因 為 最 後 開 的 花 ， 不 一 定 比 最 早 開</p>\n<p>的花，來得不美 。</p>\n<p>【80 字摘要】 升 遷 焦 慮 源 於 社 會 比 較 與 零 和 思 維 ， 透 過 「 時 區 日 誌 」 反 思 年度 學 習 、 多 元 評 價 指 標 與 長 期 視 角 ，</p>\n<p>發現自己 的成 長 軌 跡 ， 讓 擴 容 從 停 止 用 別 人 的 時 區 懲 罰 自 己 開 始 ， 在 個 人 節 奏 中 扎 根 成 長 。</p>\n<p>【五個關 鍵字】 升 遷 焦 慮 、 Leon Festinger 、 時 區 日 誌 、 社 會 比 較 、 職 涯 節 奏</p>\n<p>40</p>"},
  {id:25, dim:"dim5", title:"跨部 門 合作 ： 當 「 他 們 」 變 成 「 我 們 」", summary:"當你 說 「 那 是 他 們 部 門 的 事 」 ， 當 你 抱 怨 其 他 部 門 不 配 合 ， 你不是在 保 護 自 己 的 領 地 ，", content:"<p>第 25 篇： 跨部 門 合作 ： 當 「 他 們 」 變 成 「 我 們 」</p>\n<p>當你 說 「 那 是 他 們 部 門 的 事 」 ， 當 你 抱 怨 其 他 部 門 不 配 合 ， 你不是在 保 護 自 己 的 領 地 ，</p>\n<p>你是在切 斷自 己 的 影 響 力 。 透 過 「 共 同 敵 人 」框 架 ， 讓 跨 部 門 從 對 立 變 成同 盟 。</p>\n<p>上週三的 跨部門會 議 ， 你 坐 在 會 議 室 裡 ， 聽 著 產 品部 經 理 說 ： 「 這 個 需 求 我 們 排 不 進 去 ， 你 們 行 銷</p>\n<p>自己處理 。 」你心 裡 的 火 瞬 間 竄 上 來 ， 但 臉 上 保持 微 笑 ， 說 ： 「 好 ， 那 我 們 再 想 辦 法 。 」 回到 座 位</p>\n<p>後，你在 群 組 裡打 了 十 行 字 ， 抱 怨 產 品部 「 永 遠 只 顧 自 己 」 ， 然 後 一 個 一 個 刪 掉 ， 最 後 只 發 了 一 個</p>\n<p>無奈的表情符 號 。</p>\n<p>這樣的場 景 ， 每 個 月 重 演 。 行 銷 抱 怨 產 品部不 配 合 ， 產 品部 抱 怨 行 銷 不 懂 技 術 ， 業 務 抱 怨 兩 邊 都</p>\n<p>只會開會不會做事 。 專 案 卡 在 會 議 桌 上三 個 月， 進 度 停 滯 ， 但 沒 有 人 願 意 先 伸 出手 。</p>\n<p>我們習慣用 「他 們 」 來 稱 呼 其 他 部 門 。 「 他 們 」 不 負責 任 ， 「 他 們 」 只 會 推 託 ， 「 他 們 」 永 遠 不 懂 我</p>\n<p>們的難處 。 但你 有 沒 有 想 過 ， 當 你 說 出 「 他 們 」 的 那 一 刻 ， 你 已 經 在心理上 築 起 了 一 道 牆 ？ 這 道</p>\n<p>牆保護了你 的自尊 ， 但 也 隔 絕 了所 有 合作 的 可能 。</p>\n<p>組織行為學 裡 有一 個 概 念 叫 「 內 團 體 偏 誤 」 —— 我 們 自 動 偏 袒 自 己 人 ， 同 時 低 估 外人 的 動 機 。 當 你</p>\n<p>覺得「我 們部門 很 努 力 ， 他 們 部 門 很 懶 散 」 ， 這 不是 事 實 ， 這 是 認 知 偏 誤 。 因 為 你 只 看到自 己 部 門</p>\n<p>的加班， 沒看到他 們 部 門 的 深 夜 排程 ； 你 只 感 受 到自 己 的 壓 力 ， 沒 感 受 到 他 們 的 資 源限 制 。</p>\n<p>Patrick Lencioni 在 《 團 隊 五 大 障 礙 》 裡 說 ， 團 隊 失 敗 的 首要 原 因 不是能力不 足 ， 而 是 「 缺 乏 信</p>\n<p>任」。而跨部門之 間 的 信 任 赤 字 ， 往往 比 部 門 內 部更 嚴 重 —— 因 為 我 們 沒 有 共 同 的 午 餐 、 沒 有 共 同</p>\n<p>的目標、 沒 有共同 的 敵 人 。</p>\n<p>我後來發 現 ， 跨部 門 摩 擦 有 三 個 根 源 ， 像 三 根 釘 子 ， 把 合作 的 門 釘 死 了 。</p>\n<p>第一根釘子是 「目 標 不 一 致 」 。 行 銷 的  KPI 是 曝 光 與 轉 換 ， 產 品 的  KPI 是 穩 定 與 上 線 時 程 ， 業 務</p>\n<p>的 KPI 是 業 績與 客 戶滿 意 。 當 每 個 部 門 各 自 朝 不同 的 山 頭 爬 ， 自 然 會 在 半 山 腰 互 相推 擠 。 你以 為</p>\n<p>對方不配合 ，其 實 對 方 只 是在自 己 的 軌 道上 盡 責 。</p>\n<p>第二根釘子是 「語 言 不通 」 。 行 銷 說 「 我 們 需 要 一 個 爆 點 」 ， 產 品 聽 到 的 是 「 又 要加 需 求 」 ； 產 品 說</p>\n<p>「這個技 術 債要 還 」 ， 業 務 聽 到 的 是 「 又 要 延 期 」 。 我 們 用同 樣 的 字 彙 ， 說 著 完 全不同 的 方 言 ， 然</p>\n<p>後抱怨對方 「聽不 懂 人 話 」 。</p>\n<p>第三根釘子是 「 功 勞 分 配 恐 懼 」 。 跨 部 門 合作最大 的 隱 憂 ， 是 「 做 好了 算 誰 的 」 。 如果 專 案 成 功 ，</p>\n<p>行銷說是 創意好 ， 產 品 說 是品 質 穩 ， 業 務 說 是 管 道 強 。 如果 專 案 失 敗 ， 每 個 部 門 都 急著 劃 清 界</p>\n<p>線。這種 「零和 思 維 」 讓 合作 從 一 開 始 就 帶 著 防 備 。</p>\n<p>41我認識一個 專案 經理 ， 她 負責 一 個 需 要行 銷 、 產 品 、 業 務 三方合作 的 專 案 。 前 兩 個 月， 三方 各 說</p>\n<p>各話，會 議 開了 十 二 場 ， 決 議 零 項 。 她 後 來 做 了 一 件事 ， 改 變 了 整 個 局 勢 。</p>\n<p>她沒有再開 「 協 調會 」 。 她 分 別 找 了三 個 部 門 的 主 管 ， 問 了 一 個 問題 ： 「 如果 這 個 專 案 失 敗 ， 對 你</p>\n<p>部門最痛 的後果是 什 麼 ？ 」 行 銷 說 「 我 們 會 失 去 下 半 年最大 的 檔 期 」 ， 產 品 說 「 我 們 會 被 客 戶 質 疑</p>\n<p>穩定度」， 業 務 說 「 我 們 會 被 競 品 搶 走 大客 戶 」 。 她 把 這 三 個 答 案 寫 在 白 板 上 ， 在下 一 場 會 議 說 ：</p>\n<p>「我們不是 來 協 調 的， 我 們 是 來 一 起解 決 一 個 共 同 的 問題 的。 」</p>\n<p>那一刻，「他 們 」 開 始 變 成 「 我 們 」 。</p>\n<p>這就是「共同 敵人 」框 架 —— 不是 把 另 一 個 部 門 當 敵 人 ， 是 把 「 問題 」 當 敵 人 。 當 三方 都 看 見 「 失</p>\n<p>敗的後果 」是自 己 無 法 獨 自 承 擔 的， 合作 的 動 機 就 會 從 「 被 迫 配 合 」 轉 成 「 主 動 結 盟 」 。</p>\n<p>如果你也正 卡在 跨部 門 的 泥 沼 裡 ， 我 想 邀 請 你 做 一 件事 ： 下次 開 會 前 ， 不要 準 備 「 我 們 部 門 的 需</p>\n<p>求清單」， 準 備 一 個 問題 —— 「 我 們 共 同 的 問題 是 什 麼 ？ 如果 這 個 專 案 失 敗 ， 誰 都 逃 不 掉 的 部分是</p>\n<p>什麼？」</p>\n<p>當你從「我要 什 麼 」 轉 成 「 我 們 怕 什 麼 」 ， 對 方 的 防 備 會 下 降 ， 因 為 你不 再 是 一 個來 索取 的 人 ， 你</p>\n<p>是一個來 並 肩作 戰 的 人 。</p>\n<p>跨部門合作不是 讓對 方 聽 你 的， 是 讓 對 方 發 現 「 聽 你 的 對 我 也 有 利 」 。 擴 容 不是 擴 大自 己 的 領 地 ，</p>\n<p>是讓領地 的 邊 界 變 得 模 糊 ， 讓 資 源流 動 ， 讓 問題 共享 。</p>\n<p>當你說「他 們 」 的 時 候 ， 你 已 經 輸 了 一 半 。 擴 容 ， 從 把 「 他 們 」 變 成 「 我 們 」 開 始 。</p>\n<p>【80 字摘要】  跨部 門 摩 擦 往往 源 於內 團 體 偏 誤 與 目 標 不 一 致 ， 讓 「 他 們 」 成 為 推 卸 責 任 的 代 名 詞 。 透 過 「 共 同</p>\n<p>敵人」框 架 ， 將問題 而 非 部 門視 為 對 手 ， 讓 擴 容 發 生在 邊 界模 糊 、 資 源流 動 的 協 作 中。</p>\n<p>【五個關鍵字】  跨部 門 合作 、 內 團 體 偏 誤 、 共 同 敵 人 、 協 作 擴 容 、 Patrick Lencioni</p>\n<p>42</p>"},
  {id:26, dim:"dim5", title:"給 Z 世 代 的 備 忘 錄 ： 跨 世 代 溝 通不是 戰 爭 ， 是 翻 譯", summary:"Z 世代 帶 著 超 越 薪 酬 的 期 望 進 入 職 場 ， 重 視 彈 性 、 價 值 觀 與 心理 健康 。 當 你 覺 得 「 現 在", content:"<p>第 26 篇： 給  Z 世 代 的 備 忘 錄 ： 跨 世 代 溝 通不是 戰 爭 ， 是 翻 譯</p>\n<p>Z 世代 帶 著 超 越 薪 酬 的 期 望 進 入 職 場 ， 重 視 彈 性 、 價 值 觀 與 心理 健康 。 當 你 覺 得 「 現 在</p>\n<p>的年輕人 很 難管 」 ， 其 實 只 是你 們說 著 不同 的 語 言 。 透 過 「 世 代 翻 譯 器 」 ， 找 到 共 同 的 頻 率 。</p>\n<p>上個月的部門會 議 ， 你 聽 見 一 個 年 輕 同 事 說 ： 「 我 覺 得 這 個 專 案 的 目 標 和我 們 的 核 心 價 值 不 太 一</p>\n<p>致，我能不能 申請 調 到 另 一 個 組 ？ 」 你心 裡 的 警 鈴 大作 。 你 想起 自 己 二 十五 歲 的 時 候 ， 主 管 說 什</p>\n<p>麼就做什 麼 ， 哪 來 這 麼 多 「 價 值 觀 」 的 問題 ？</p>\n<p>會後，你在茶水 間 跟另 一 個 資 深 同 事 抱 怨 ： 「 現 在 的 年 輕 人 真 的 很 難 帶 ， 動 不 動 就 談 意 義 ， 談 心理</p>\n<p>健康，談工作與生活平 衡 。 我 們 以前 哪 有 這 些 ？ 」 對 方 點 頭 如 搗 蒜 ， 你 們 在同 溫 層 裡 互 相 取 暖 ，</p>\n<p>同時把年 輕人推得 更 遠 。</p>\n<p>這個場景 ，在  2025–2026 年 的 職 場 裡 越 來 越 常 見 。 Z 世 代 （ 1997 年 後 出生） 帶 著 明 確 的 期 望 進 入</p>\n<p>職場：他 們重視 彈 性工 時 、 心理 健康 、 多 元包容 ， 以 及 與 個 人 價 值 觀 一 致 的 工作 內 容  。 他 們 不是</p>\n<p>「不耐操 」 ，他 們 只 是不 願 意 為 了 沒 有 意 義 的 事 情 消 耗 自 己 。</p>\n<p>但這不代表 資 深世 代就 「 錯 了 」 。 我 們 只 是 說 著 不同 的 語 言 ， 然 後 互 相 指 責 對 方 「 口 音 不 標 準 」 。</p>\n<p>我後來發 現 ， 跨 世 代 溝 通 有 三 個 常 見 的 誤 解 ， 像 三 堵 牆 ， 把 兩 個 世 代 隔 開 。</p>\n<p>第一個誤解 ： 「 Z 世 代 不 願 意 吃 苦 。 」 不 。 他 們 不 願 意 吃 的 是 「 無 意 義 的 苦 」 。 你可以要 求他 們 加</p>\n<p>班，但你 需要告 訴 他 們 「 為 什 麼 」 。 如果你 說 「 因 為 我 說 的 」 ， 這 在上 一 個 世 代 可能行 得 通 ， 在 這</p>\n<p>個世代會直接 觸發 離 職 警 報 。 他 們 要 的 不是 輕 鬆 ， 是 「 值 得 」 。</p>\n<p>第二個誤解 ： 「 Z 世 代 沒 有 忠 誠 度 。 」 不 。 他 們 對 「 公司 」 沒 有 忠 誠 度 ， 但 他 們 對 「 價 值 觀 」 有 極</p>\n<p>高的忠誠度 。如果 他 們 發 現 公司 的 作 為 與 宣 稱 的 價 值 不 符 ， 他 們 會 毫 不 猶 豫 地 離 開 。 這 不是 薄</p>\n<p>情，是原 則 。上 一 個 世 代 的 忠 誠 是 「 我 留 下 來 」 ， 這 個 世 代 的 忠 誠 是 「 我 配 得 上 」 。</p>\n<p>第三個誤解 ： 「 Z 世 代 需 要 被 哄 。 」 不 。 他 們 不 需 要 被 哄 ， 他 們 需 要 被 理 解 。 當 他 們說 「 我 覺 得 這</p>\n<p>個專案沒 有意 義 」 ， 他 們 不是在 挑 戰 你 的 權 威 ， 他 們 是在 試 圖 理 解 「 為 什 麼 我 們 要 做 這 件事 」 。 如</p>\n<p>果你把這 個問題 當 成 「 頂 撞」 ， 你 就 錯 過 了 一 次 讓 專 案 變 得 更好 的 機 會 。</p>\n<p>我認識一 個 五十 歲 的 部 門 主 管 ， 他 帶 的 團 隊 裡 有一 半 是  Z 世 代 。 他 說 ： 「 一 開 始 我 真 的 受 不了 ， 他</p>\n<p>們動不動就問 為 什 麼 ， 開 會 時 會 直 接 說 『 我 覺 得 這 個 方 向 有 問題 』 。 我以前 的 團 隊 從 來 不 會 這</p>\n<p>樣。」但他後 來做 了 一 個 改 變 ： 每 次部 屬 問 「 為 什 麼 」 ， 他 不 再 回 答 「 因 為 我 說 的 」 ， 而 是 認 真解</p>\n<p>釋決策背後 的脈 絡 。 如果 他也 覺 得 脈 絡 不 夠 好 ， 他 會 說 ： 「 你 說 得 對 ， 我 們 再 想想 。 」</p>\n<p>43三個月後，他告 訴我 ： 「 我 發 現 他 們 不是 難 管 ， 他 們 是 讓 我 變 得 更 誠 實 。 我不能 再 靠 職 稱 壓 人 ， 我</p>\n<p>必須靠邏 輯 說服人 。 這 很 累 ， 但 我 的 決 策 品 質 變 好了 。 」</p>\n<p>這就是「世代 翻 譯 器 」 的 核 心 ： 不是 讓 對 方 學 你 的 語 言 ， 是你 們 一 起 找 到 第 三 種 語 言 。</p>\n<p>如果你也覺得 「 現在 的 年 輕 人 很 難 溝 通 」 ， 我 想 邀 請 你 試 一 個 小 實 驗 ： 下次 當 年 輕 部 屬 提出 一 個 讓</p>\n<p>你不舒服 的 觀點 時 ， 不要 立 刻 反 駁 ， 問 他 ： 「 對 你 來 說 ， 什 麼 叫 『 好 的 工作 』 ？ 」 然 後 聽 。 不要 打</p>\n<p>斷，不要 糾正 ，就 聽 。</p>\n<p>你會發現，他 們 的 答 案 裡 ，有 很 多你年 輕 時 也 曾 經 在 乎 、 但 後 來 忘 記 的 事 。</p>\n<p>跨世代溝通不是 戰 爭 ， 是 翻 譯 。 擴 容 ， 是 學 會 說 對 方 的 語 言 ， 而 不是 堅 持 自 己 的 方 言 。</p>\n<p>【80 字摘要】  Z 世代 與 資 深世 代 的 摩 擦 往往 源 於 語 言 與 價 值 觀 的 差 異 ， 而 非 態 度 問題 。 透 過 「 世 代 翻 譯 器 」 理 解</p>\n<p>對方對「好 的工作 」 的 定 義 ， 讓 擴 容 發 生在相 互 理 解而 非 單 方面 壓 制 的 過 程 中。</p>\n<p>【五個關鍵字】  Z 世代 、 跨 世 代 溝 通 、 世 代 翻 譯 器 、 職 場 價 值 觀 、 協 作 擴 容</p>\n<p>44</p>"},
  {id:27, dim:"dim5", title:"團 隊 裡 的 「 異 類 」 ： 為 什 麼 你 需 要 一 個 唱 反 調 的 人", summary:"當 團 隊 裡 每 個 人 都 點 頭 ， 當 「 和 諧 」 成 為 最高 價 值 ， 你可能正在 失 去 創 新。 透 過 「 魔 鬼", content:"<p>第 27 篇： 團 隊 裡 的 「 異 類 」 ： 為 什 麼 你 需 要 一 個 唱 反 調 的 人</p>\n<p>當 團 隊 裡 每 個 人 都 點 頭 ， 當 「 和 諧 」 成 為 最高 價 值 ， 你可能正在 失 去 創 新。 透 過 「 魔 鬼</p>\n<p>代言人」 機制 ，保 護 團 隊 裡 的 異 類 聲 音 ， 讓 擴 容 發 生在不 舒 服 的 張 力 中。</p>\n<p>三個月前 ，你 們 團 隊 開 了 一 場 腦 力 激 盪 會 議 。 白 板 上 貼 滿 了 便 利 貼 ， 每 個 人 都 笑 得 很 開 心 ， 氣 氛</p>\n<p>融洽。最後大家投 票 選 出 一 個 方 向 ， 主 管 說 ： 「 很 好 ， 我 們 就 這 樣 做 。 」 沒 有 人 反 對 ， 因 為 沒 有 人</p>\n<p>想當那個 掃 興 的人 。</p>\n<p>三個月後 ， 專案上 線 ， 數 字 慘 淡 。 复 盘 會 議 上 ， 每 個 人 都 說 ： 「 我 當 時 就 覺 得 這 個 方 向 有 點 問題 ，</p>\n<p>但大家都同意 ，我 就 沒 說 。 」</p>\n<p>這就是「 團體 迷 思 」 —— 當 和 諧 變 成最高 價 值 ， 異 議 就 會 被消 音 。 心理 學 家  Irving Janis 在 研究 歷</p>\n<p>史上的重大 決 策失 誤 時 發 現 ， 許 多 災 難 性 的 決 定 ， 都 是在 「 沒 有 人 反 對 」 的 氣 氛 中 通 過 的。 因 為</p>\n<p>反對需要 勇 氣 ，而 維 持 和 諧 只需 要 沈 默 。</p>\n<p>我們太喜 歡和 諧了 。 和 諧 讓 會 議 順 利 結 束 ， 讓 聚 餐 氣 氛 愉 快 ， 讓 團 隊 看 起 來 團 結 。 但 和 諧 的 代</p>\n<p>價，往往是 「 沒 有 人 說 真 話 」 。 當 異 議 被 視 為 「 不合作 」 ， 團 隊 就 會 逐 漸 失 去 糾 錯 的 能力 ， 最 後 一</p>\n<p>起走向懸 崖 。</p>\n<p>和諧有三 個 隱 形 的 代 價 。 第 一 個 是 「 盲 點 無 法 被 挑 戰 」 。 當 所 有 人 都 朝 同 一 個 方 向 看 ， 就 沒 有 人看</p>\n<p>後面。專案最大 的 風 險 ， 往往 藏在 「 大家 都 覺 得 沒 問題 」 的 地方 。</p>\n<p>第二個是 「 創 新被 壓 抑 」 。 創 新 來 自 衝 突 ， 來 自 「 如果 這 樣 呢 ？ 」 的 提 問 。 當 這 個 提 問 被 和 諧 的 壓</p>\n<p>力壓下去 ， 團 隊就 會 一 直做 「 安全 但 無 聊 」 的 事 。</p>\n<p>第三個是 「 決 策品 質 下 降 」 。 研究 顯 示 ， 經 過 適 度 爭 辯 的 決 策 ， 品 質 遠 高 於 「 一 致 通 過 」 的 決 策 。</p>\n<p>因為爭辯 逼你 把 邏 輯 說 清 楚 ， 把 漏 洞 補 起 來 。</p>\n<p>我認識一 個 新 創公司 的 執 行 長 ， 他做 了 一 個 很 特 別 的 規 定 ： 每 週 策 略 會 議 的 最 後 十五 分 鐘 ， 是</p>\n<p>「異議時 間 」 。在 這 十五 分 鐘 裡 ， 每 個 人 都 必 須 提出 一 個 「 我 覺 得 這 個 決 定 有 問題 」 的 觀 點 。 不是</p>\n<p>建議，是挑 戰 。如果 沒 有 人提出 異 議 ， 會 議 不能 結 束 。</p>\n<p>他說：「一 開 始很 尷 尬 ， 大家面面相 覷 ， 沒 有 人 想 當 壞 人 。 但 做 了 兩 個 月 後 ， 我 們 發 現 很 多 潛 在 的</p>\n<p>問題在這 十五分 鐘 裡 被 挖 出 來 了 。 更 重 要 的 是 ， 團 隊 裡 那 個 本 來 不 敢 說 話 的 工 程 師 ， 開 始 變 成我</p>\n<p>們最依賴 的 『 警 報 器 』 。 」</p>\n<p>這就是「魔鬼代言 人 」 機 制 的 價 值 —— 它 不是 鼓 勵 無 意 義 的 反 對 ， 是 創 造 一 個 「 安全 的 不 舒 服 」 空</p>\n<p>間，讓異
