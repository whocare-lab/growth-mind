議成 為制度 的一 部分 ， 而 不是 個 人 的 冒 險 。</p>\n<p>45如果你也擔心自 己 的 團 隊 太 「 和 諧 」 ， 我 想 邀 請 你 做 一 件事 ： 下次 會 議 ， 指 定 一 個 人 當 「 魔 鬼 代言</p>\n<p>人」。他的任 務不是 反 對 一 切 ， 是 認 真 問 ： 「 這 個 決 定 的 反 面是 什 麼 ？ 我 們 忽 略 了 什 麼 ？ 」</p>\n<p>你會發現， 當反對 變 成 「 角 色 」 而 不是 「 個 人 攻 擊 」 ， 大家 反而 更能 聽 進 去 。 因 為 大家知道 ： 他 不</p>\n<p>是針對我 ，他是在 盡 他 的 職 責 。</p>\n<p>和諧的團隊 讓人 舒服 ， 但 有一 點 不和 諧 的 團 隊 才 會進 步 。 擴 容 ， 是 允 許 不同 的 聲 音存 在 。</p>\n<p>【80 字摘要】  團 體 迷 思 讓 和 諧 成 為 創 新的 敵 人 ， 當 異 議 被 視 為 不合作 ， 團 隊 便失 去 糾 錯 能力 。 透 過 「 魔 鬼 代言</p>\n<p>人」機制 ， 將反 對 制度化 為 角 色而 非 個 人 攻 擊 ， 讓 擴 容 發 生在不 舒 服 但必 要 的 張 力 中。</p>\n<p>【五個關鍵字】  團 體 迷 思 、 Irving Janis 、 魔 鬼 代言 人 、 異 議 時 間 、 協 作 擴 容</p>\n<p>46</p>"},
  {id:28, dim:"dim5", title:"當 團 隊 陷 入 「 共 識 陷 阱 」 ： 和 諧 的 代 價 是 創 新", summary:"當 團 隊 花 三小 時 達 成 共 識 ， 最 後 的 決 定 卻 是所 有 人 都 不 滿 意 的 妥 協 ， 你 陷 入了 「 共 識 陷", content:"<p>第 28 篇： 當 團 隊 陷 入 「 共 識 陷 阱 」 ： 和 諧 的 代 價 是 創 新</p>\n<p>當 團 隊 花 三小 時 達 成 共 識 ， 最 後 的 決 定 卻 是所 有 人 都 不 滿 意 的 妥 協 ， 你 陷 入了 「 共 識 陷</p>\n<p>阱」。透過 「 異 議 時 間 」 機 制 ， 讓 創 新有 機 會 長 出 來 。</p>\n<p>上週五的 策 略會 議 ， 你 們 討 論 了 兩 個 小 時 。 A 方 案 大 膽 但 有 風 險 ， B 方 案保 守 但 安全 。 團 隊 分成</p>\n<p>兩派，各 執 己 見 。 眼 看 會 議 要 超 時 ， 主 管 說 ： 「 那 我 們 折 衷 一 下 ， 取  A 的 創 意加上  B 的 穩 健 ， 做</p>\n<p>一個  C 方案 。 」大家 點 頭 ， 會 議 結 束 。</p>\n<p>但你心裡知道 ， C 方 案 既 不是  A 的 精 華 ， 也 不是  B 的 優 點 ， 它 是 一 個 「 沒 有 人 反 對 但 也 沒 有 人 興</p>\n<p>奮」的妥 協 。這就 是 「 共 識 陷 阱 」 —— 我 們 花 了大 量 時 間 追 求 「 沒 有 人 反 對 」 ， 結 果 得 到 一 個 「 沒</p>\n<p>有人滿意 」 的 決 議 。</p>\n<p>組織心理 學 研究發 現 ， 共 識 決 策 有一 個 隱 藏 的 缺 陷 ： 它 傾 向 於 選 擇 「 最安全 」 的 選 項 ， 而 不是</p>\n<p>「最好」 的 選 項 。 因 為 安全 的 選 項 最 容 易 獲 得 多 數 同意 ， 而 最好 的 選 項 往往 需 要 說 服 、 需 要 爭</p>\n<p>辯、需要 承 擔 風 險 。</p>\n<p>Amazon 有一 個著 名 的 文化 ： 「 不同意 但 執 行 」 （ Disagree and Commit ） 。 他 們 鼓 勵 在 決 策 前 充</p>\n<p>分爭辯，甚 至要求反 對 者 把 反 對 意 見 寫 下 來 。 但 一 旦 決 策 形 成 ， 即使反 對 者 也 必 須 全力 執 行 。 這</p>\n<p>個文化的精髓是 ： 爭 辯 發 生在 決 策 前 ， 而 不是 決 策 後 。</p>\n<p>但我們很多 團 隊 的 做 法正好相 反 ： 決 策 前和 諧 一 片 ， 決 策 後 抱 怨 連連 。 因 為 我 們 把 「 共 識 」 誤 解</p>\n<p>為「沒有人反對 」 ， 而 不是 「 每 個 人 都 充 分表 達 後 ， 願 意接 受 最 終 決 定 」 。</p>\n<p>共識陷阱 有三 個特 徵 。 第 一 個 是 「 妥 協 取代 最 佳 解 」 。 為 了 讓 每 個 人 都 點 頭 ， 我 們 把 方 案 削 成最 沒</p>\n<p>有稜角的 形 狀 ， 結 果 它 什 麼 都 沾 到 ， 什 麼 都 不 突 出 。</p>\n<p>第二個是 「 異 議被 視 為 不合作 」 。 當 有 人 說 「 我不同意 」 ， 團 隊 的 反 應 不是 「 說說 看你 的 理 由 」 ， 而</p>\n<p>是「你為 什 麼 總是 唱 反 調 」 。 這 種 氣 氛 會 讓 異 議 者 選 擇 沈 默 ， 然 後 在 執 行 時 消 極 抵 抗 。</p>\n<p>第三個是 「會 議 時 間 與 決 策 品 質 成 反比 」 。 花 越 多 時 間 追 求共 識 ， 決 策 品 質 往往越 差 。 因 為 大家 累</p>\n<p>了，急著 結束 ，最 後 隨 便 找 一 個 「 沒 人 反 對 」 的 選 項 簽 字 。</p>\n<p>我認識一 個 產品 總 監 ， 他 改 變 了 團 隊 的 決 策 流程 。 他取消 了 「 共 識 會 議 」 ， 改 為 「 辯 論 會 」 。 在 辯</p>\n<p>論會上，他會明 確 指 定 兩 個 人分 別 支持  A 和  B ， 讓 他 們 各 用 十 分 鐘 論 述 。 其 他 人 只 能 問問題 ， 不</p>\n<p>能表態。 辯 論 結束 後 ， 主 管做 決 定 ， 然 後問 反 對 者 ： 「 你可以接 受 這 個 決 定 嗎 ？ 如果不能 ， 我 們 再</p>\n<p>討論。」</p>\n<p>47他說：「一開 始 團 隊 很 不 習 慣 ， 覺 得 好 像 在 開 辯 論 賽 。 但 三 個 月 後 ， 我 們 的 決 策 速 度 快 了 一 倍 ， 因</p>\n<p>為大家不 再花 兩小 時 找 一 個 沒 人 反 對 的 妥 協 ， 而 是 花 三 十 分 鐘 把 利 弊 說 清 楚 。 」</p>\n<p>如果你也發 現自 己 的 團 隊 總 是在 「 和 稀 泥 」 ， 我 想 邀 請 你 做 一 個 小 改 變 ： 下次 會 議 ， 在 決 議 前 保 留</p>\n<p>十分鐘「 異 議 時 間 」 。 明 確 說 ： 「 這 十 分 鐘 ， 我 想 聽聽 有 人不同意 嗎 ？ 這 不是 挑 戰 ， 是 幫 我 們 補 漏</p>\n<p>洞。」</p>\n<p>你會發現， 當 異 議被 正式 邀 請 ， 它 就 不 再 是 破 壞 ， 而 是 建 設 。</p>\n<p>共識讓人安全 ， 異 議 讓 人成 長 。 擴 容 ， 是 學 會 在不 舒 服 的 張 力 中 做 決 定 。</p>\n<p>【80 字摘要】  共 識 陷 阱 讓 團 隊 追 求 「 沒 人 反 對 」 卻 得 到 「 沒 人 滿 意 」 的 妥 協 ， 犧 牲 創 新 與 決 策 品 質 。 透 過 「 異</p>\n<p>議時間」 機制 ，在 決 策 前正式 邀 請 反 對 意 見 ， 讓 擴 容 發 生在 充 分 爭 辯 後 的 堅 定 執 行 中。</p>\n<p>【五個關鍵字】  共 識 陷 阱 、 異 議 時 間 、 Amazon 文化 、 決 策 品 質 、 協 作 擴 容</p>"},
  {id:29, dim:"dim5", title:"遠 距工作 的 孤 獨 ： 螢 幕 前 的 我 們 ， 還 算 同 事 嗎", summary:"當你在家工作 一 年 ， 發 現 自 己 連 同 事 的 名 字都快 忘 記 ， 遠 距 工作 的 孤 獨 正在 侵 蝕 你 的 歸", content:"<p>第 29 篇： 遠 距工作 的 孤 獨 ： 螢 幕 前 的 我 們 ， 還 算 同 事 嗎</p>\n<p>當你在家工作 一 年 ， 發 現 自 己 連 同 事 的 名 字都快 忘 記 ， 遠 距 工作 的 孤 獨 正在 侵 蝕 你 的 歸</p>\n<p>屬感。透 過 「 虛 擬 茶 水 間 」 ， 重建 職 場 的 溫 度 。</p>\n<p>週五下午 五點 ，你 關 掉 視 訊 鏡 頭 ， 螢 幕 從 九 宮 格 變 成 桌 面 。 你 發 現 自 己 一 整 天 只 說 了 十 句 話 ， 而</p>\n<p>且都是工作相關 ： 「 收到 」 、 「 好 的 」 、 「 我 補 一 下 」 、 「 沒 問題 」 。 你站 起 來 ， 在 租 屋 處 的 小客 廳 走 了</p>\n<p>三圈，打 開冰 箱 ， 拿 出 一 罐 啤 酒 ， 坐 在 沙 發 上 ， 看 著窗 外 漸 暗 的 天 色 。</p>\n<p>這種安靜 ，一 開 始 是 享 受 。 不用通 勤 、 不用 應 酬 、 不用 假 笑 。 但 三 個 月 後 ， 這 種 安 靜 開 始 變 質 。</p>\n<p>你發現自 己不 再 記 得 同 事 的 名 字 —— 不是全名 ， 是 那 個 「 平 常 會 一 起 吃 午 餐 」 的 名 字 。 你不 再 知道</p>\n<p>誰剛結婚 、 誰 養了 新 貓 、 誰 的 媽媽 住 院 了 。 你 們 的 關 係 被 壓 縮 成 「 功 能性 的 對 話 」 ， 像 兩 台 電 腦 在</p>\n<p>交換檔案 。</p>\n<p>遠距工作 讓我 們高 效 ， 但 也 讓 我 們 變 成 彼 此 的 「 功 能 」 而 非 「 人 」 。</p>\n<p>心理學家 研究 遠距 工作 的 心理 影 響 時 發 現 一 個 矛 盾 的 現 象 ： 遠 距 工作者 報 告更高 的 「 工作 滿 意</p>\n<p>度」，但同 時也 報 告更高 的 「 社 會 孤 立感 」 。 我 們 滿 意 於 彈 性 ， 卻 在不知不 覺 中 失 去 了 「 歸 屬 感 」</p>\n<p>——那種 「我 屬於 某 個 群 體 」 的 踏 實 感 。</p>\n<p>這種孤獨 有三 個 層 次 ， 像 洋 蔥 一 樣 一 層 一 層 剝 開 。</p>\n<p>第一層是 「 資 訊 孤 島 」 。 在 辦 公 室 裡 ， 你 會 在 走 廊 聽 到 「 那 個 專 案 好 像 有 變 化 」 、 在 電 梯 裡 聽 到</p>\n<p>「主管今天心情不 太 好 」 。 這 些非 正式 的 資 訊 流 ， 讓 你 對 組 織 的 脈 動 保持 敏 感 。 但 在 遠 距 環 境 裡 ，</p>\n<p>資訊變成 「會 議 紀 錄 」 和 「 正式 郵 件 」 ， 所 有 灰 色 地 帶 都消 失 了 。 你 只 知道 被 允 許 知道 的 事 ， 而 這</p>\n<p>往往不夠 。</p>\n<p>第二層是 「情感 斷 線 」 。 在 辦 公 室 裡 ， 同 事 會 在你 皺 眉 時 問 「 還 好 嗎 ？ 」 、 會 在你加 班 時 買 一 杯 咖</p>\n<p>啡給你、會在會 議 後 拍拍 你 的 肩 說 「辛 苦 了 」 。 這 些 微小 的 互 動 ， 是 職 場 情 感 存款 。 但 在 遠 距 環 境</p>\n<p>裡，這些存款 停 止 了 。 你 們 的 關 係 帳 戶 裡 ， 只 剩 下提 款 —— 工作 、 工作 、 更多 的 工作 。</p>\n<p>第三層是 「身 份 模 糊 」 。 在 辦 公 室 裡 ， 你是 「 那 個 座 位在三 樓 轉 角 的 行 銷 企 劃 」 、 「 那 個 總 是 穿 格 子</p>\n<p>襯衫的工程 師 」 、 「 那 個 會 在下 午茶 時 間 講 笑 話 的 會 計 」 。 這 些 身 份 標 籤 ， 讓 你在 組 織 裡 有一 個 「 位</p>\n<p>置」。但在 遠距 環 境 裡 ， 你 變 成 一 個 頭 像 、一 個 名 字 、一 個 功 能 描述 。 你 開 始 懷 疑 ： 「 沒 有 辦 公 室</p>\n<p>的我，到 底是 誰？ 」</p>\n<p>我認識一 個 設 計 師 ， 她 遠 距 工作了 兩 年 。 她 說 ： 「 我 效 率 很 高 ， 主 管 很 滿 意 ， 但 有一 次我在 便 利商</p>\n<p>店遇到同事 ，我 們 兩 個 都 愣 了 一 下 ， 因 為 我 們 不 確 定要不要 打 招 呼 —— 我 們 已 經 不 確 定 彼 此 算 不 算</p>\n<p>49『認識』了。 」</p>\n<p>那個瞬間讓 她意 識到 ， 遠 距 工作 偷 走 的 不 只 是通 勤 時 間 ， 還 有 「 人 與 人之 間 的 溫 度 」 。</p>\n<p>後來她做了 一件事 ， 我 稱 之 為 「 虛 擬 茶 水 間 」 。 每 週 五 下 午 四 點 四 十五 分 ， 她 發 一 個 視 訊 連 結 給 團</p>\n<p>隊，標題是 「不 談 工作 的 十五 分 鐘 」 。 規 則 很 簡 單 ： 可以 聊 寵 物 、 聊 天 氣 、 聊 昨 晚 的 劇 、 聊 任何 跟</p>\n<p>工作無關 的事 。一 開 始很 尷 尬 ， 大家不知道要 說 什 麼 。 但 第 三 週 ，有 人 帶 了 一 隻 貓 入 鏡 ，有 人分</p>\n<p>享了自己 烤 的蛋糕 ，有 人 說 「 其 實 我最 近 有 點 焦 慮 」 。 那 個 「 不 談 工作 」 的 空 間 ， 慢慢 變 成了 團 隊</p>\n<p>的情感避 風 港 。</p>\n<p>她說：「我們不是 變 回 辦 公 室 同 事 ， 但 我 們 開 始 變 回 『 人 』 。 」</p>\n<p>如果你也正在 遠距 的 孤 獨 裡 漂 流 ， 我 想 邀 請 你 做 三 件事 。</p>\n<p>第一件，主 動 創 造 「 非 工作接 觸 」 。 不要等 別 人 約 你 。 發 一 個 訊 息 給 某 個 同 事 ： 「 你上次提到 的 那</p>\n<p>部電影，我看了 ， 結 尾 讓 我 想 到你 說 的 話 。 」 這 種 微小 的 連 結 ， 會 在 沙 漠 裡 種 出 一 棵 樹 。</p>\n<p>第二件，在視 訊會 議 前 留 三分 鐘 「 閒 聊 時 間 」 。 不要 一 上 線 就 進 入 議 程 。 問問 「 週 末 過 得 如 何 」 、</p>\n<p>「那個提案後 來 怎 麼 樣 了 」 。 這 三分 鐘 不是 浪 費 ， 是 投 資 —— 投 資 在 關 係 的 溫 度上 。</p>\n<p>第三件，找到你 的 「 實 體 錨 點 」 。 每 個 月 至 少 一 次 ， 和 某 個 同 事 見 面 喝 咖 啡 、 吃 飯 、 散 步 。 螢 幕 前</p>\n<p>的我們需要 像 素 ， 但 人 類 需 要 溫 度 。 那 個 面 對 面 的 瞬 間 ， 會 讓 你 記 起 來 ： 這 個 人不是 一 個 功 能 ，</p>\n<p>是一個會 笑 、會 累 、 會 困 惑 的 生 命 。</p>\n<p>遠距工作讓我 們高 效 ， 但 也 讓 我 們 變 成 彼 此 的 「 功 能 」 而 非 「 人 」 。 擴 容 ， 是在 螢 幕 前 重建 溫 度 。</p>\n<p>【80 字摘要】  遠距工作 帶 來 效 率 卻 侵 蝕 歸 屬 感 ， 形 成 資 訊 孤 島 、 情 感 斷 線 與 身 份 模 糊 三 層 孤 獨 。 透 過 「 虛 擬 茶</p>\n<p>水間」創 造非工作接 觸 、 會 議 前 閒 聊 與 實 體 錨 點 ， 讓 擴 容 發 生在 螢 幕 前 的 溫 度 重建 中。</p>\n<p>【五個關鍵字】  遠距工作 、 職 場 孤 獨 、 虛 擬 茶 水 間 、 歸 屬 感 、 協 作 擴 容</p>\n<p>50</p>"},
  {id:30, dim:"dim5", title:"影 響力不 需 要 職 稱 ： 如 何 在 沒 有 權 力 時 推 動 改 變", summary:"當你 沒 有 主 管 的 頭 銜 ， 卻 想 推 動 一 個 改 變 ， 你 會 不 會 覺 得 「 我 說 了不 算 」 ？ 但 影 響 力 從", content:"<p>第 30 篇： 影 響力不 需 要 職 稱 ： 如 何 在 沒 有 權 力 時 推 動 改 變</p>\n<p>當你 沒 有 主 管 的 頭 銜 ， 卻 想 推 動 一 個 改 變 ， 你 會 不 會 覺 得 「 我 說 了不 算 」 ？ 但 影 響 力 從</p>\n<p>來不是職 稱 的 專利 。 透 過 「 結 盟 地 圖 」 ， 讓 沒 有 權 力 的 你 也 能 移 動 山 脈 。</p>\n<p>上個月的部門會 議 上 ， 你 發 現 了 一 個 流程 漏 洞 。 這 個 漏 洞 讓 每 個 專 案都 多 浪 費 兩 天 時 間 ， 但 已 經</p>\n<p>存在三年了 ， 沒 有 人提 起 。 你 猶 豫 了 十 分 鐘 ， 最 後 舉 手 說 ： 「 我 覺 得 這 個 流程 可以 優 化 。 」 主 管 看</p>\n<p>了你一眼 ， 說 ： 「 這 個 我 們 之 後 再 討 論 。 」 然 後會 議 繼續 ， 你 的 建 議 像 一 顆 石 頭 掉 進 湖 裡 ， 沒 有 漣</p>\n<p>漪。</p>\n<p>會後你對自 己 說 ： 「 算 了 ， 我 又 不是主 管 ， 我 說 了 也 不 算 。 」 然 後 你 繼續 忍 受那 個 漏 洞 ， 繼續 多 浪</p>\n<p>費兩天， 繼續在心 裡 抱 怨 「 為 什 麼 沒 有 人 改 變 」 。</p>\n<p>這個場景 ， 每天都 在 各 個 角落 發 生 。 我 們 以 為 影 響 力是 職 稱 的 專 利 —— 只 有 主 管才 能推 動 改 變 ， 只</p>\n<p>有老闆才能 決定方 向 。 但 這 是 一 個 巨 大 的 誤 解 。 歷 史 上最 重 要 的 改 變 ， 往往 來 自 沒 有 權 力 的 人 。</p>\n<p>因為有權力 的人 忙 著 維 持 現 狀 ， 而 沒 有 權 力 的 人 ， 才 看 得 見 現 狀 的 裂 縫 。</p>\n<p>管理學者  John Kotter 在 研究 變 革 管 理 時 發 現 ， 成 功 的 組 織 變 革 有  70% 來 自 「 非 正式 領 導 者 」</p>\n<p>——那些 沒 有 頭 銜 、 但 有 人 願 意 聽 他 們說 話 的 人 。 他 們 的 影 響 力不是 來 自 職 位 ， 而 是 來 自三 個 更 古</p>\n<p>老的來源 。</p>\n<p>第一個來源是 「 專 業 信用 」 。 當 你在 某 個 領 域 累 積 了 足 夠 的 深 度 ， 人 們 會 自 動 尋 求 你 的 意 見 。 這 種</p>\n<p>信用無法被 頭 銜 賦 予 ， 只 能 被 時 間 證 明 。一 個 工 程 師 可能 沒 有 管 理 職 ， 但 如果 他 是 團 隊 裡 最 懂 資</p>\n<p>料庫的人 ， 當他 說 「 這 個 架 構 有 風 險 」 ， 所 有 人 都 會 停 下 來 聽 。</p>\n<p>第二個來源是 「人 脈 橋樑 」 。 當 你 認識 不同部 門 的 人 、 不同 層 級 的 人 、 不同 背 景 的 人 ， 你 就 成 為 了</p>\n<p>資訊的樞 紐 。這 種 橋樑 角 色 讓 你能 夠 串 連 分 散 的 力 量 ， 把 「 個 別 的 不 滿 」 變 成 「 集 體 的 聲 音 」 。</p>\n<p>第三個來源是 「 故 事 敘 事 」 。 人 類 不是 被 數 據 說 服 的， 是 被 故 事感 動 的。 當 你能 夠 把 一 個 抽 象 的 問</p>\n<p>題，轉化成 一 個具 體 的 畫 面 —— 「 這 個 漏 洞 讓 我 們 每 個 月 多加 班 十 六 小 時 」 —— 你 就 從 「 抱 怨 者 」</p>\n<p>變成了「 喚醒者 」 。</p>\n<p>我認識一 個行 政助 理 ， 她 沒 有 管 理 職 ， 但 她 發 現 公司 的 請 假 流程 極 度 繁 瑣 ， 每 個 人 都 要 填 五 張</p>\n<p>表、跑三 個 簽 核 。 她 沒 有 權 力 改 變 流程 ， 但 她 做 了 一 件事 ： 她 訪 談 了 二 十 個 同 事 ， 記 錄 每 個 人 花</p>\n<p>在請假流程上 的 時 間 ， 算 出 一 個 數 字 ： 「 全公司 每 年 浪 費 在 請 假 流程 上 的 時 間 ， 等 於 一 個 正 職 員 工</p>\n<p>一整年的工 時 。 」</p>\n<p>51她把這個數字做成 一 頁 簡 報 ， 不是 發 給 主 管 ， 是 發 給 所 有 被 她 訪 談 過 的 同 事 。 大家 開 始 在 群 組 裡</p>\n<p>討論、開 始 轉發 、 開 始 有 人  tag 主 管 。一 週 後 ， 主 管 主 動 找 她 ： 「 妳 那 個 數 據 ， 我 們 來 談談 怎 麼 優</p>\n<p>化。」</p>\n<p>她沒有職稱 ， 但 她 有 數 據 、有 故 事 、有 二 十 個 人 的 支持 。</p>\n<p>這就是「結 盟地 圖 」 的 核 心 ： 你不是 一 個 人在推 動 改 變 ， 你是 找 到所 有 也被 這 個 問題 困 擾 的 人 ，</p>\n<p>然後一起推 。</p>\n<p>如果你也有一 個想推 動 的 改 變 ， 但 覺 得 自 己 「 沒 有 權 力 」 ， 我 想 邀 請 你 做 三 件事 。</p>\n<p>第一件，畫出你 的 「 結 盟 地 圖 」 。 誰 也 受 這 個 問題 困 擾 ？ 誰 會 因 為 這 個 改 變 而 受 益 ？ 誰 有 資 源 可以</p>\n<p>幫助你？ 把這 些人 列 出 來 ， 然 後 一 對 一 地 聊 。 不要 一 次 發 群 組 信 ， 那 會 讓 每 個 人 都 覺 得 「 這 不 關</p>\n<p>我的事」。</p>\n<p>第二件，準 備你 的 「 故 事 」 。 不是 準 備  PPT ， 是 準 備 一 個 讓 人 「 啊 」 一 聲 的 畫 面 。一 個 具 體 的 數</p>\n<p>字、一個真 實 的案 例 、一 個 讓 人 感 同 身 受 的 細 節 。 故 事 讓 人 記 住 ， 數 據 讓 人相信 。</p>\n<p>第三件，找到你 的 「 第 一 個 追 隨 者 」 。 改 變 不是 從 領 導 者 開 始 的， 是 從 「 第 一 個 願 意站 起 來 跟 隨 的</p>\n<p>人」開始 的。 當你 有一 個 追 隨 者 ， 你 就 不是 一 個 瘋 子 ， 你是 一 個運動 的 發 起 人 。</p>\n<p>權力讓人服 從 ，影 響 力 讓 人 追 隨 。 擴 容 ， 是 發 現 你不 需 要 職 稱 也 能 改 變 世界 。</p>\n<p>【80 字摘要】  影 響力 並 非 職 稱 專 利 ， 非 正式 領 導 者 透 過 專 業 信用 、 人 脈 橋樑 與 故 事 敘 事 推 動 變 革 。 透 過 「 結 盟</p>\n<p>地圖」找到共同 受 困 者 、 準 備 喚 醒 故 事 、 尋 找 第 一 個 追 隨 者 ， 讓 擴 容 發 生在 無 權 者 的 行 動 中。</p>\n<p>【五個關鍵字】  非 權力 影 響 力 、 結 盟 地 圖 、 John Kotter 、 變 革 管 理 、 協 作 擴 容</p>\n<p>52</p>"},
  {id:31, dim:"dim6", title:"轉 職前 的 三 個 自 問 ： 你是 逃 離 ， 還 是前 往 ？", summary:"當你 每 天 早 上 醒 來 第 一 個 念 頭 是 「 我不 想 上 班 」 ， 當 你 開 始 更 新 履 歷 卻 不知道下 一 步 去", content:"<p>第 31 篇： 轉 職前 的 三 個 自 問 ： 你是 逃 離 ， 還 是前 往 ？</p>\n<p>當你 每 天 早 上 醒 來 第 一 個 念 頭 是 「 我不 想 上 班 」 ， 當 你 開 始 更 新 履 歷 卻 不知道下 一 步 去</p>\n<p>哪裡，你 的 轉職 衝 動 可能不是 「 前 往 」 某 個 目 標 ， 而 是 「逃 離 」 某 個 痛苦 。 透 過 「 轉 職 三 問 」 ， 辨 識</p>\n<p>動機來源 ，避免 從 一 棟 著 火 的 房 子 跳 進 另 一 棟 。</p>\n<p>週日晚上 十 一點 ， 你 打 開  104 人力 銀 行 ， 開 始 更 新 履 歷 。 你上 傳 了大 頭 照 ， 更 新 了工作 經 歷 ， 在</p>\n<p>「自我介 紹 」 欄位 打 了 又 刪 、 刪 了 又 打 。 你 發 現 自 己 寫 不出 「 為 什 麼 我 想 轉 職 」 —— 因 為 你 根 本不</p>\n<p>知道自己想 轉去 哪 裡 。</p>\n<p>你只是知道 ： 「這 裡 ， 待 不下 去 了 。 」</p>\n<p>這種狀態 ，我 稱之 為 「逃 離 型 轉 職 」 。 你不是 被 某 個 新 目 標 吸 引 ， 你是 被 某 個 舊 痛苦 追 趕 。 就 像 一</p>\n<p>個在著火 的 房子 裡 的 人 ， 他 跳 出 窗 戶 ， 不是 因 為 窗 外 有 美 景 ， 是 因 為 屋 內 有 濃 煙 。</p>\n<p>但逃離型 轉職 有一 個 隱 藏 的 風 險 ： 你可能 跳 進 另 一 棟 著 火 的 房 子 。</p>\n<p>職涯研究 顯示 ， 基 於 「逃 避 」 的 轉 職 決 策 ， 滿 意度 往往 低 於 基 於 「 吸 引 」 的 決 策 。 當 你是 為 了</p>\n<p>「離開」而離 開 ， 你 對 新 工作 的 評 估 會 過 度 樂 觀 —— 你 會 放 大 新 公司 的 優 點 ， 忽 略 它 的 缺 點 ， 因 為</p>\n<p>你的大腦急著 找到 一 個 「 安全 島 」 。 這 就 是 為 什 麼 許 多人 轉 職 三 個 月 後 就 後 悔 ： 「 我以 為 這 裡 會 不</p>\n<p>一樣，結果發 現 只 是 換 了 一 種 痛苦 。 」</p>\n<p>我認識一 個人 資 專 員 ， 她 在前公司 被 主 管 壓 榨 了 兩 年 ， 每 天加 班 到 深 夜 ， 週 末 還 要回 訊 息 。 她 終</p>\n<p>於崩潰，裸 辭 ，然 後 在 兩 週 內 接 受 了 第 一 家 給 她  offer 的 公司 。新 公司 的 主 管 不 壓 榨 她 ， 但 同 事</p>\n<p>之間的勾心 鬥 角更 嚴 重 。 她 說 ： 「 我以 為 離 開 那 個 主 管就解 脫 了 ， 結 果 發 現 我 只 是 從 一 個 地 獄 ， 換</p>\n<p>到另一個地 獄 。 」</p>\n<p>她的問題不是 轉職 ， 而 是 她 從 來 沒 有 問 自 己 ： 「 我 真 正 想 要 的 工作 長 什 麼 樣 子 ？ 」</p>\n<p>後來我整理出 一 個 簡 單 的 辨 識 框 架 ： 逃 離與 前 往 ，有 三 個 根 本 的 區 別 。</p>\n<p>第一個區 別 ： 「逃 離 」 關 注 的 是 過 去 ； 「 前 往 」 關 注 的 是 未 來 。 逃 離 型 轉 職 者 會 說 「 我 受 夠 了 這 個</p>\n<p>主管」、「我不要 再 加 班 了 」 ； 前 往 型 轉 職 者 會 說 「 我 想 學 習 那 個 領 域 」 、 「 我 想做 能 影 響 更多人 的</p>\n<p>事」。一個是推 ，一 個 是 拉 。 被 推 著 走 的 人 ， 往往 不知道自 己 在 往哪 裡 去 。</p>\n<p>第二個區 別 ： 「逃 離 」 是情 緒 驅 動 ； 「 前 往 」 是 價 值 驅 動 。 逃 離 型 轉 職 往往 發 生在情 緒 高 峰 —— 被 罵</p>\n<p>後、加班後 、 專案 失 敗 後 。 你在大 腦 最不 清 醒 的 時 候 做 決 定 。 前 往 型 轉 職 則 發 生在平 靜 的 反 思 之</p>\n<p>後，你已 經 處理了情 緒 ， 開 始 規 劃 路 徑 。</p>\n<p>53第三個區別 ： 「逃離 」 需 要 藉 口 ； 「 前 往 」 需 要 計 畫 。 逃 離 型 轉 職 者 往往 對 新 工作 只 有 模 糊 想 像 ：</p>\n<p>「只要不要 像 現在 這 樣 就 好 。 」 前 往 型 轉 職 者 會 有 具 體 的 學 習 目 標 、 產 業 研究 、 甚 至 過 渡 計 畫 。</p>\n<p>他們知道下 一 步 的 風 景 ， 不 只 是知道 現 在 的 牢 籠 。</p>\n<p>如果你正在 考 慮 轉職 ， 我 想 邀 請 你 ， 在 按 下 「 投 遞 履 歷 」 之前 ， 誠 實 回 答 這 三 個 問題 。</p>\n<p>第一個問題 ：如果 現 在 的 主 管 換 了 、 部 門 調 了 、 專 案 結 了 ， 我 還 想 走 嗎 ？</p>\n<p>如果答案是不想了 ， 那 你不是 想 轉 職 ， 你 只 是 想 逃 離 現 在 的 處 境 。 這 時 候 的 解 決 方 案也 許 不是 轉</p>\n<p>職，而是內部 調 動 、 溝 通 、 或 者 給 自 己 一 個 情 緒緩 衝 期 。</p>\n<p>第二個問題 ：我想去 的 下 一 份 工作 ， 具 體 在 做 什 麼 ？ 一 天 的 工作 長 什 麼 樣 子 ？</p>\n<p>如果你說不出具體 的 畫 面 ， 你 的 「 前 往 」 只 是 幻 想 。 具 體 的 意 思 是 ： 你知道 那 份 工作 的日 常任</p>\n<p>務、你知道 它會用到 什 麼 技能 、 你知道 它 的 壓 力 來 源 是 什 麼 。 不是 「 我 想做 行 銷 」 ， 而 是 「 我 想做</p>\n<p>品牌策略 ， 每天分 析 市 場 趨 勢 、 規 劃 季 度活 動 」 。</p>\n<p>第三個問題 ：我 願意 為 這 個 轉 換 ， 承 受至 少 一 年 的 「 不 適 應 期 」 嗎 ？</p>\n<p>沒有完美的 轉職 ， 只 有 願 意 承 擔 代 價 的 轉 職 。新 環 境 、新 人 際 、新 技能 ， 都 需 要 時 間 適 應 。 如果</p>\n<p>你期待「 轉職後立 刻 變 好 」 ， 你 會 失望 。 前 往 型 轉 職 者知道 ， 前 六 個 月 可能 會 更 痛苦 ， 但 他 們 願 意</p>\n<p>為了長期 的目 標 ， 忍 受 短 期 的 混 亂 。</p>\n<p>這三個問題 像三面 鏡 子 ， 逼 你看 見 自 己 真 正 的 動 機 。 它 們 不 會 幫 你 決 定 「 要不要 轉 職 」 ， 但 會 幫 你</p>\n<p>決定「為 什 麼 轉職 」 。</p>\n<p>轉職不是逃離 火 場 ， 是 走向 燈 塔 。 擴 容 不是 讓 你 換 個 地方 喘 氣 ， 是 讓 你 無 論 在 哪 裡 ， 都 有 力 氣 為</p>\n<p>自己的選 擇 負責 。</p>\n<p>【80 字摘要】  轉職 衝 動 往往 混 淆 了 「逃 離 痛苦 」 與 「 前 往 目 標 」 。 透 過 「 轉 職 三 問 」辨 識 動 機 來 源 —— 換 了主 管</p>\n<p>還想走嗎？下 份工作 具 體 做 什 麼 ？ 願 意 承 受 一 年不 適 應 期 嗎 ？ 讓 策 略 擴 容建立 在 價 值 驅 動 而 非 情 緒 逃 離 上 。</p>\n<p>【五個關鍵字】  轉職 決 策 、 逃 離與 前 往 、 職 涯 轉 換 、 動 機 辨 識 、 價 值 驅 動</p>\n<p>54</p>"},
  {id:32, dim:"dim6", title:"大公司是跳板還是牢籠？科技人的「生態位」戰略", summary:"2026年大廠正轉型為創業生態系宿主，職場人應善用「生態位借力」策略，將公司資源、人脈與失敗容錯率轉化為個人市場溢價能力，在體制內完成隱形擴容，而非糾結大小公司之選。", content:"<p>週一晚上十點，你坐在公司會議室裡，對面是從海外回來的技術長。他剛剛宣布一項內部創業計畫：公司撥出三千萬，讓員工提案，做出來的產品歸公司，但團隊可以分紅。你心裡想：「這不就是讓我們用下班時間，幫公司賭新產品嗎？」</p>\n<p>如果你這樣想，你就錯過了2026年職場最重要的擴容機會。</p>\n<p>根據2026年職場趨勢觀察，台灣大型科技廠正瘋狂進行「策略投資新創」與內部創業實驗，大廠不再只是「雇主」，而是逐漸變成「創業生態系的宿主」。這意味著什麼？意味著在大公司工作，本質上已經不是「賣時間換薪水」，而是「借力一個龐大資源庫，偷偷長大」。</p>\n<p>我認識一位在科技大廠待了十五年的資深經理，叫他老周。老周從來沒有離職創業，但他現在擁有三項個人專利、一個業界知名的技術部落格，以及超過兩千人的專業人脈網絡。這些都不是他「下班後」做的，而是他在公司內部「借力」出來的成果。</p>\n<p>他的方法很簡單：每次公司導入新系統，他主動爭取當「跨部門協調人」。這個角色沒有實權，但讓他接觸到設備商、軟體商、客戶端的工程師。他把這些連結記錄下來，不是為了公司，是為了建立他個人的「產業地圖」。三年後，當他想推動一個內部創新專案時，他不需要透過公司採購，直接就能找到對的人。這就是「生態位借力」——你利用公司的平台、預算、品牌，來養大你個人無法被公司收回的能力。</p>\n<p>傳統職場書愛談「大公司學流程，新創學全能」。這是廢話。2026年的現實是，大公司的流程正在僵化，新創的全能正在廉價化。LinkedIn 2026年熱門職業報告指出，「創辦人」首次進入前十，「戰略顧問與獨立專家」排名第七，這標誌著「終身雇用制」正式終結，「超級個體」時代來臨。在這個時代，你待在大公司的唯一正當理由，就是把它當成你的「創業孵化器」。</p>\n<p>我稱這種策略為「生態位擴容」。不是問「大公司好還是新創好」，而是問「這個位置能讓我長出什麼別人拿不走的能力？」</p>\n<p>具體來說，有三種「借力」方式：</p>\n<p>第一種，「資源借力」。大公司有預算買你個人買不起的軟體、請你個人請不起的顧問、參加你個人參不起的展會。重點不是完成公司的KPI，而是把這些資源「內化」為你的認知。你去展會，不要只收集公司需要的資訊，要收集「產業痛點」；你上課，不要只學公司指定的技能，要學「市場上最值錢的技能」。</p>\n<p>第二種，「人脈借力」。大公司的供應鏈、客戶鏈、合作鏈，本質上是一個現成的「人脈金礦」。但多數人只會在離職時才想起來要「維護關係」。聰明的借力者會在職時就建立「個人品牌」——讓供應商知道「老周很專業」，讓客戶知道「找老周比找公司窗口快」。這些人脈不是你的職位附帶的，是你個人專業度累積的。</p>\n<p>第三種，「失敗借力」。大公司最奢侈的資源，是「允許你失敗」。新創失敗一次就倒閉，大公司失敗十次還能活。你應該利用這個緩衝墊，去做那些你個人不敢賭的實驗。提案一個新流程、主導一個跨部門專案、甚至寫一個內部使用的自動化工具。成了，是你的戰功；敗了，是公司的學費。</p>\n<p>當然，借力有倫理邊界。我說的借力，不是偷懶混日子，而是「把公司的資源轉化為個人的認知資本，再把這個資本回饋給公司」。這是一種雙贏的共生，前提是你真的長出了「市場需要的能力」，而不是只長出了「這家公司需要的習慣」。</p>\n<p>老周後來離開了那家科技大廠。不是因為他過得不好，而是因為他發現：「我已經把這家公司能給我的養分吸乾了。」他現在是一家新創的技術顧問，同時還是原公司的外部專家。他沒有背叛任何人，他只是完成了一個完整的「擴容循環」。</p>\n<p>所以，下次當你猶豫要留在舒適的大公司，還是跳去刺激的新創時，問自己一個更精準的問題：「這個位置，是讓我變成更大容器裡的一顆螺絲，還是讓我學會如何建造自己的容器？」</p>\n<p>擴容不是選擇平台，是學會利用平台。當你能在體制內長出體制外的能力，你就真正自由了。</p>"},
  {id:33, dim:"dim6", title:"當 AI 開 始 寫 你 的 報 告 ： 人 類 最 後 的 不可 替 代 性", summary:"當你 發 現  AI 三分 鐘 就 能 完 成你 花 三小 時 做 的 分 析 ， 當 你 開 始 擔 心自 己 的 工作 會 被取", content:"<p>第 33 篇： 當  AI 開 始 寫 你 的 報 告 ： 人 類 最 後 的 不可 替 代 性</p>\n<p>當你 發 現  AI 三分 鐘 就 能 完 成你 花 三小 時 做 的 分 析 ， 當 你 開 始 擔 心自 己 的 工作 會 被取</p>\n<p>代，你的焦 慮不是 沒 有 道理 。 但  AI 取代 的 不是 「 工作 」 ， 而 是 「 工作 的 某 個 版本 」 。 透 過 「 AI 時 代</p>\n<p>擴容計畫 」 ，投 資人 類 專 區 ， 讓 擴 容 發 生在不可 替 代 的 維 度上 。</p>\n<p>你花了整 個下午 ， 整 理市 場 數 據 、 做交 叉 分 析 、 寫 了 一 份 二 十 頁 的 報 告 。 你 覺 得 自 己 做得 不 錯 ，</p>\n<p>甚至有點得意 。然 後 你 聽 見 隔壁 同 事 說 ： 「 我用  ChatGPT 十 分 鐘 就做 好 類 似 的 分 析 了 ， 還 自 動 生</p>\n<p>成了圖表 。 」</p>\n<p>你看了他 的 螢 幕 。 圖 表 很 漂 亮 ， 分 析 邏 輯 也 通 順 。 你 的 二 十 頁 報 告 ， 突 然 變 得 很 重 、 很 舊 、 很 多</p>\n<p>餘。</p>\n<p>那天晚上 ，你 躺在 床 上 ， 心 裡 有一 個 聲 音 在 說 ： 「 我是不是 會 被取代？ 」 這 個 聲 音 不是 杞 人 憂 天 。</p>\n<p>2025 年的職 場 趨 勢 顯 示 ， AI 相 關 職 位 需 求 大 增 ， 但 同 時 也 有 大 量重 複 性工作正在自 動 化 。 你 的 焦</p>\n<p>慮，是時代 的焦 慮 ， 不是你 的 脆 弱 。</p>\n<p>但讓我們 把這 個焦 慮 拆 開 來 看 。 經 濟 學 家提出 一 個 觀 點 ： 技 術 革 命 消 滅 的 不是 「 工作 」 ， 而 是 「 任</p>\n<p>務」。當計 算機發 明 時 ， 它 沒 有 消 滅 會 計 師 ， 它 消 滅 了 「 手工 計 算 」 這 個 任 務 ， 然 後會 計 師 升 級 成</p>\n<p>了「財務分 析 師 」 。 AI 也 是 一 樣 。 它 不 會 消 滅 「 分 析 師 」 ， 它 會 消 滅 「 純 粹 的 資 料 整 理 」 這 個 任</p>\n<p>務。未來 的分 析 師 ， 需 要 會問問題 、 會 解 讀 脈 絡 、 會 說 服 決 策 者 —— 這 些 都 是  AI 做 不好 的 事 。</p>\n<p>問題是：你 現在 的 工作 ，有 多 少比 例 是 「 AI 做 不好 的 事 」 ？</p>\n<p>我認識一 個市 場 研究 員 ， 他 在公司 做 了 五 年 ， 每 天 的 工作 就 是 整 理 問 卷 數 據 、 做 圖 表 、 寫 摘 要 。</p>\n<p>去年公司 導入  AI 工 具 後 ， 他 的 工作 量 減 少 了 七 成 。 他 以 為 自 己 會 被 裁 員 ， 但 主 管 跟 他 說 ： 「 我 們</p>\n<p>不需要人做 圖表了 ， 但 我 們 需 要人告 訴 我 們 『 這 些 數 據 代 表 什 麼 』 。 」</p>\n<p>他花了三 個 月重 新 定位自 己 。 他 開 始 學 習 產 業 趨 勢 分 析 、 開 始 參 與 策 略 會 議 、 開 始 練 習 把 數 據</p>\n<p>「翻譯」成主管能 聽 懂 的 故 事 。 他 說 ： 「 我以前 覺 得 我 的 價 值 在 於 『 做得快 』 ， 現 在 才 發 現 ， 我 的</p>\n<p>價值在於 『看得 深 』 。 」</p>\n<p>這就是擴容 的方 向 。 不是和  AI 比 速 度 ， 而 是 比 深 度 。 不是和 機 器 比 效 率 ， 而 是 比 人性 。</p>\n<p>我觀察到 ，人 類在 職 場 裡 有 三 個 維 度 ， 是  AI 短 期 內 難 以 取代 的。 第 一 個 是 「 脈 絡 理 解 」 。 AI 可以</p>\n<p>整理數據 ， 但 它不 懂 「 為 什 麼 這 個 數 據 在 這 個 產 業 、 這 個 時 機 、 這 個 文化 脈 絡 下 」 代 表 什 麼 。 同</p>\n<p>樣是銷售下滑 ，可能是 景 氣 問題 、 可能是 產 品生 命 週 期 到了 尾 聲 、 可能是 競 爭 對 手 發 動 了 價 格</p>\n<p>戰。這種 「脈 絡化 思 考 」 ， 需 要人 類 的 經 驗 、 直 覺 與 跨 領 域 連 結 能力 。</p>\n<p>57第二個是「情感 勞 動 」 。 AI 可以 寫 一 封 道 歉 信 ， 但 它 無 法在客 戶 憤 怒 時 ， 透 過 語 氣 、 眼 神 、 停 頓</p>\n<p>來重建信任 。 護理 、 教 育 、 領 導 、 銷 售 —— 所 有 需 要 「 與 人 連 結 」 的 工作 ， 都 難 以 被取代 。 因 為 人</p>\n<p>類需要的不是 「正 確 的 答 案 」 ， 是 「 被 理 解 的 感 覺 」 。</p>\n<p>第三個是「 價 值判 斷 」 。 AI 可以 給 你 五 個 選 項 ， 但 它 無 法告 訴 你 「 哪 一 個 符 合公司 的 長 期 價 值 」 。</p>\n<p>這種「在 模 糊 中做 決 定 」 的 能力 ， 需 要 倫 理 思 考 、 需 要 權 衡 取 捨 、 需 要 承 擔 後 果 的 勇 氣 。 這 是人</p>\n<p>類最後的堡 壘 ，也 是最 有 價 值 的 堡 壘 。</p>\n<p>如果你也感 受到  AI 帶 來 的 威 脅 ， 我 想 邀 請 你 做 三 件事 ， 我 稱 之 為 「 AI 時 代 擴 容 計 畫 」 。</p>\n<p>第一件事， 辨 認你 的 「 AI 脆 弱 區 」 。 列 出你工作 中 「 重 複 性高 、 規 則 明 確 」 的 任 務 。 這 些 是  AI 很</p>\n<p>快會取代 的。不要 保 護 它 們 ， 開 始 減 少花 在上面 的 時 間 。 把 它 們 交 給  AI ， 或 者 把 它 們 自 動 化 。</p>\n<p>第二件事，投 資你 的 「 人 類 專 區 」 。 找 出你工作 中 需 要 「 判 斷 、 創 意 、 溝 通 、 情 感 」 的 任 務 。 這 些</p>\n<p>是你的擴容方 向 。 主 動 要 求 參 與 更多 這 類 工作 ， 即使 它 們 一 開 始 讓 你不 舒 服 。</p>\n<p>第三件事， 學會與  AI 協 作 。 把  AI 當 成 助 理 ， 不是 敵 人 。 用  AI 做 初 稿 ， 你 來 做 判 斷 ； 用  AI 做 資</p>\n<p>料，你來 說 故事 。 未 來 最 值 錢 的， 不是 「 會 做 報 告 的 人 」 ， 是 「 會 用  AI 做 出更好 判 斷 的 人 」 。</p>\n<p>AI 不會取代人 類 ， 但 會 取代 「 不 願 意 擴 容 的 人 類 」 。 你 的 焦 慮 不是 敵 人 ， 它 是 靈 魂 的 鬧 鐘 ， 提 醒</p>\n<p>你：該升 級了 。</p>\n<p>【80 字摘要】  AI 焦 慮 源 於 對 工作 取代 的 恐 懼 ， 但 技 術 革 命 消 滅 的 是 任 務 而 非 職 位 。 透 過 辨 識 「 AI 脆 弱 區 」 與 投</p>\n<p>資「人類 專 區 」 ， 將  AI 視 為 協 作 夥 伴 而 非 敵 人 ， 讓 擴 容 發 生在不可 替 代 的 維 度上 。</p>\n<p>【五個關鍵字】  AI 焦 慮 、 職 涯 韌 性 、 不可 替 代 性 、 人 類 專 區 、 與  AI 協 作</p>\n<p>58</p>"},
  {id:34, dim:"dim6", title:"你的薪資單正在騙你：真正該累積的，是「離開這家公司還能帶走」的市場溢價", summary:"2026年高通膨與AI取代標準化勞力下，「純執行力」正在貶值。職場人應建立「認知資本、關係資本、品牌資本」三大職場資本帳戶，將價值感具象化為可隨身攜帶的市場溢價能力，讓擴容真正具備變現力。", content:"<p>每個月十號，你收到薪資入帳通知。那個數字決定了你這個月的心情：高了，覺得被肯定；低了，覺得被虧待。但你很少問另一個問題：「如果明天我被資遣，這個數字還能代表我什麼？」</p>\n<p>答案是：幾乎不能。</p>\n<p>2026年的薪資報告顯示，經營幕僚類碩士年薪中位數達87.9萬，與大學學歷拉開近23萬差距，證明市場對「管理思維」有高度付費意願。但這也暗示另一個殘酷現實：當基層執行工作的薪資因缺工而提升時，「純粹的執行力」正在通膨中貶值。如果你的價值只體現在「這家公司、這個職位、這張薪資單」上，你的擴容就是假的。</p>\n<p>我認識一位財務經理，叫她小敏。小敏在一家公司做了七年，從會計升到財務經理，年薪破百。她覺得自己很穩定，直到公司被併購，新團隊帶來自己的財務長。小敏被資遣時才發現：她引以為傲的「七年經驗」，其實是「同一年的經驗重複七次」。她熟悉這家公司的ERP系統、這家公司的報表邏輯、這家公司的稅務規劃。但離開這家公司，她不知道別的產業怎麼做成本管控，不懂新創的財務預測模型，甚至沒有外部人脈可以幫她介紹工作。</p>\n<p>小敏的問題不是「薪水太低」，也不是「價值感太低」，而是「她的價值被鎖死在這家公司的結構裡」。這是2026年職場最危險的狀態。</p>\n<p>我提出一個概念，叫做「職場資本帳戶」。你的薪資單只是「現金帳戶」，每個月結清。你還需要建立三個「資本帳戶」：</p>\n<p>第一個，「認知資本」。這是你「知道什麼」的價值。不是公司培訓教你的SOP，而是你透過工作「悟出來」的產業洞察。比如，你在科技業學到的專案管理邏輯，能不能抽象成「高變異環境的品質控管方法論」，應用到其他產業？你在電商公司學到的用戶分析，能不能變成「消費者行為預測框架」，賣給傳統零售業？認知資本的關鍵是「可遷移性」——離開這家公司，它還值錢。</p>\n<p>第二個，「關係資本」。這是你「認識誰」的價值。不是公司通訊錄裡的職稱，是「願意在你離職後還接你電話」的人。根據2026年職場趨勢，「專家經濟」正在崛起，企業更傾向雇用「隨取隨用」的高階顧問而非全職高管。這意味著，你的外部人脈不是「社交應酬」，是「未來的收入來源」。</p>\n<p>第三個，「品牌資本」。這是「別人怎麼談論你」的價值。LinkedIn 2026年趨勢強調，「個人品牌」將是未來菁英的核心資產。你不需要有一百萬追蹤，你只需要在特定領域「被需要」。寫技術部落格、在產業論壇發言、甚至只是在內部會議中「總能提出別人沒想到的觀點」，都是在累積品牌資本。</p>\n<p>這三個帳戶的總和，就是你的「市場溢價能力」——你離開這家公司，到市場上能賣多少錢。</p>\n<p>回到「薪水」與「價值感」的辯證。2026年的高通膨環境下，談錢不可恥，但只談錢很危險。如果你的策略是「這家公司不給我夠高的薪水，所以我離職」，你很可能只是從一個「現金帳戶低的宿主」，跳到另一個「現金帳戶高但資本帳戶依然空的宿主」。</p>\n<p>真正的擴容，是讓你的「職場資本帳戶」持續增值，即使現在的「現金帳戶」暫時沒有跟上。因為資本帳戶的複利，遠超過薪資單的線性成長。</p>\n<p>我三十年的觀察是：那些最後拿到市場最高溢價的人，往往不是當年薪水最高的。而是那些在「薪水沒漲」的階段，默默把公司資源轉化為個人資本的人。他們把專案當作品，把職位當學位，把公司當實驗室。</p>\n<p>所以，下次當你覺得「薪水太低」時，問自己三個問題：</p>\n<p>1. 我這個月累積了什麼「可遷移的認知」？</p>\n<p>2. 我認識了什麼「離職後還會聯絡的人」？</p>\n<p>3. 我做了什麼「讓市場上有人開始知道我」的事？</p>\n<p>如果三個答案都是零，那麼問題不是公司虧待你，是你的擴容停滯了。</p>\n<p>薪資單會騙人，但市場不會。當你的職場資本帳戶夠厚，薪水只是它自然溢出的利息。</p>"},
  {id:35, dim:"dim6", title:"海外 職 涯 的 想 像 與 現 實 ： 你 準 備 好 當 異 鄉 人了 嗎", summary:"當你 羨 慕 朋 友在 矽 谷 的 高 薪 與 海 景 辦 公 室 ， 當 你 夢 想 著 跨 國 職 涯 的 國 際 視 野 ， 你 有 沒 有", content:"<p>第 35 篇： 海外 職 涯 的 想 像 與 現 實 ： 你 準 備 好 當 異 鄉 人了 嗎</p>\n<p>當你 羨 慕 朋 友在 矽 谷 的 高 薪 與 海 景 辦 公 室 ， 當 你 夢 想 著 跨 國 職 涯 的 國 際 視 野 ， 你 有 沒 有</p>\n<p>想過，海外工作最 難 的 不是工作 ， 是 「 成 為 異 鄉 人 」 的 孤 獨 ？ 透 過 「 異 鄉 人 擴 容包 」 建立 情 感支</p>\n<p>持、文化 訪 談 與身 份 敘 事 ， 讓 擴 容 在 離 開 舒 適 圈 的 過 程 中 發 生 。</p>\n<p>你終於到了 。你 夢 想 中的 城 市 —— 倫 敦 、新 加 坡 、 舊 金 山 。 第 一 個 月， 你 忙 著 安 頓 、 認識 同 事 、 探</p>\n<p>索新環境 。你 覺得 自 己像 一 部 勵 志 電 影 的 主 角 ， 充 滿 能 量 。</p>\n<p>第二個月，天 氣 變 冷 了 。 你下 班 回到 租 來 的 小公 寓 ， 發 現 沒 有 人可以 說 話 。 你 打 開 視 訊 ， 和 父 母</p>\n<p>聊天，但 時 差 讓你 們 總 是 錯 過 。 你 打 開 社 群 ， 看 見 台 灣 的 朋 友在 聚 餐 ， 你 感 覺 自 己 被 遺 忘 在 一 個</p>\n<p>巨大的空 白 裡 。</p>\n<p>第三個月，工作 開 始 上 軌 道 ， 但 你 的 內 心 開 始 出 現 裂 縫 。 你 發 現 ， 海 外 職 涯 最 難 的 不是 語 言 、 不</p>\n<p>是專業，是 「 沒 有 歸 屬 感 」 。 你是 一 個 永 遠 的 「 外 國 人 」 ， 無 論 你多 努 力 融 入 。</p>\n<p>這種孤獨 ， 跨文化心理 學 家 早 就 描述 過 。 他 們說 ， 海 外工作者通 常 會 經 歷 四 個 階 段 ： 蜜 月 期 、 挫</p>\n<p>折期、調 整期 、 適 應 期 。 大多 數 人在 「 挫 折 期 」 就放 棄 了 ， 因 為 他 們 以 為 「 不 適 應 」 等 於 「 我不</p>\n<p>適合」。但那些 撐 過挫 折 期 的 人 ， 往往 會發 展 出 「 雙 文化能力 」 —— 他 們 能 夠 在不同文化 間 切 換 、</p>\n<p>翻譯、橋接 。這是 一 種 極 其 稀 缺 的 職 涯 資 產 ， 無 法在 單 一 文化 環 境 中 培 養 。</p>\n<p>問題是：你 準 備好 付 出 那 個 代 價 了 嗎 ？</p>\n<p>我認識一 個 軟體工 程 師 ， 他去 了 矽 谷 三年 。 第 一 年 ， 他 興 奮 地分 享 辦 公 室 的 免 費 食 物 、 週 五 的 啤</p>\n<p>酒趴、動 輒百 萬台 幣 的 年 薪 。 第二 年 ， 他 開 始 在 深 夜 傳 訊 息 給 我 ， 說 ： 「 我 這 裡 下 午 三 點 ， 台 灣 早</p>\n<p>上六點，我 找不到人可以 說 話 。 」 第 三年 ， 他 回 台 灣 了 。 不是 因 為 工作不好 ， 是 因 為 他 發 現 自 己</p>\n<p>「無法在美 國建立 深 度 的 關 係 」 。</p>\n<p>他說：「我以 為海 外 職 涯 的 挑 戰 是工作 ， 但 挑 戰 其 實 是 『 沒 有 根 』 的 感 覺 。 你可以 很 成 功 ， 但 同 時</p>\n<p>很飄浮。 」</p>\n<p>海外職涯 有三 個 隱 形 的 成本 ， 很 少 人在出 發 前 真 正理 解 。</p>\n<p>第一個成本是 「社 交重 啟 」 。 在 台 灣 ， 你 有一 個 累 積 了 二 十 年 的 社 交 網 絡 。 在 海 外 ， 你要 從 零 開</p>\n<p>始。這不是 「 認識 新 朋 友 」 那 麼 簡 單 ， 是 「 重 新 證 明自 己 是 誰 」 。 你要 重 新 建立 信 任 、 重 新 找 到 歸</p>\n<p>屬、重新 讓 別人理 解 你 的 幽 默 和 價 值 觀 。 這 個過 程 ， 比任何 工作 專 案都 耗 神 。</p>\n<p>第二個成本是 「文化 翻 譯 」 。 你不 只 要 學 語 言 ， 還 要 學 「 潛 規 則 」 —— 什 麼 時 候 可以 直言 、 什 麼 時</p>\n<p>候需要迂迴 、 什 麼 玩 笑 可以 開 、 什 麼 話 題 要 避 開 。 這 種 「 文化 耗 電 」 是 持 續 的、 隱 形 的。 你可能</p>\n<p>61在工作八小 時後 ， 還 要 花 兩 小 時 「 消 化 」 文化 摩 擦 。</p>\n<p>第三個成本是 「身 份 斷 裂」 。 你在 台 灣 是 「 某 個 領 域 的 專 家 」 ， 在 海 外你可能 只 是 「 那 個 亞 洲 同</p>\n<p>事」。這種身 份落 差 ， 會 衝 擊 你 的 自我 認 同 。 你 會 開 始 懷 疑 ： 「 我到 底 是 誰 ？ 」 這 個 問題 ， 沒 有 履</p>\n<p>歷表可以回 答 。</p>\n<p>如果你正在 考 慮海外 職 涯 ， 我 想 邀 請 你 準 備 三 個 「 擴 容包 」 。 不是行 李 ， 是心理上 的 裝 備 。</p>\n<p>第一個是「情感 擴容 」 。 建立 「 遠 距 支持 系 統 」 。 不是 偶 爾 視 訊 ， 是 固 定 每 週 一 次 的 「 深 度 對 話 」</p>\n<p>對象。這 個對 象要能接 住 你 的 脆 弱 ， 而 不 只 是 交 換 資 訊 。 當 你在 異 鄉 崩 潰 時 ， 你 需 要 一 個 「 懂 你</p>\n<p>的人」，而不是 一 個 「 認識 你 的 人 」 。</p>\n<p>第二個是「文化 擴容 」 。 出 發 前 ， 找 三 個 「 當 地人 」 做 「 文化 訪 談 」 。 問 他 們 ： 「 什 麼 行 為 在 這 裡 會</p>\n<p>被視為冒犯？ 」「 新 來 者最 常 犯 的 錯 誤 是 什 麼 ？ 」 這 比任何 語 言 課 都 實 用 。 你不 需 要 變 成 當 地人 ，</p>\n<p>但你需要知道 「地 雷 在 哪 裡 」 。</p>\n<p>第三個是「身 份 擴容 」 。 準 備 一 個 「 身 份 過 渡 敘 事 」 。 當 被 問 「 你 從 哪 裡 來 」 時 ， 你不 只 是回 答</p>\n<p>「台灣」，而是 說 「 我 從 台 灣來 ， 帶 來 了  XX 的 視 角 ， 正在 學 習  YY 」 。 這 是在主 動 定 義 你 的新 身</p>\n<p>份，而不是被 動等 待 別 人定 義 。</p>\n<p>海外職涯不是 換 個地方上 班 ， 是 換 個 靈 魂 活 一 次 。 擴 容 ， 從 你 願 意成 為 異 鄉 人 開 始 。</p>\n<p>【80 字摘要】  海外職 涯 的 挑 戰 不在 專 業 而 在 跨 文化 適 應 與 身 份 斷 裂 。 透 過 「 異 鄉 人 擴 容包 」 建立 情 感支持 、 文</p>\n<p>化訪談與身 份 敘事 ， 讓 擴 容 在 離 開 舒 適 圈 的 過 程 中 發 生 。</p>\n<p>【五個關鍵字】  海外職 涯 、 跨 文化 適 應 、 異 鄉 人 、 身 份 斷 裂 、 雙 文化能力</p>\n<p>62</p>"},
  {id:36, dim:"dim6", title:"斜 槓不是 逃 離 ， 是 擴 容 ： 多 重身 份 的 整 合之道", summary:"當你 白 天是工 程 師 、 晚 上是 插 畫 家 、 週 末 是部 落 客 ， 你不是在分 裂 ， 你是在 擴 容 。 但 斜", content:"<p>第 36 篇： 斜 槓不是 逃 離 ， 是 擴 容 ： 多 重身 份 的 整 合之道</p>\n<p>當你 白 天是工 程 師 、 晚 上是 插 畫 家 、 週 末 是部 落 客 ， 你不是在分 裂 ， 你是在 擴 容 。 但 斜</p>\n<p>槓的風險是 「 什 麼 都 會 ， 什 麼 都 不 精 」 。 透 過 「 身 份 整 合 盤 點 」 ， 讓 多 重身 份 互 相 餵養 ， 長 成 一 棵 樹</p>\n<p>而非一片 雜 草 。</p>\n<p>你的名片上 有 五 個 身 份 。 白 天 ， 你是科技公司 的 產 品 經 理 。 晚 上 ， 你是 線 上 課 程 的 講 師 。 週 末 ，</p>\n<p>你經營一 個美 食部 落 格 ， 同 時 還 在 學 習 咖 啡 烘 焙 。 朋 友 羨 慕 你 「 好 斜 槓 」 ， 父 母 擔 心你 「 不 務 正</p>\n<p>業」，你自 己 有 時 候 也 會 在 深 夜 問 ： 「 我到 底 是 誰 ？ 」</p>\n<p>這個問題 ，不是 斜 槓 的 錯 ， 是 斜 槓 的 代 價 。</p>\n<p>「斜槓」這 個 詞 來 自 英 文 的  slash ， 指 的 是 一 個 人同 時 擁 有 多 重 職 業 身 份 。 在  2025–2026 年 的 職</p>\n<p>場裡，斜 槓 越 來 越普 遍 ， 因 為 單 一 職 業 的 穩 定性正在下 降 ， 而 多 重 技能 組 合 的 抗 風 險 能力正在上</p>\n<p>升。但斜 槓不是 萬 靈 丹 ， 它 有 風 險 ， 而 且 風 險 往往 被 「 看 起 來 很 酷 」 的 外表 掩 蓋 了 。</p>\n<p>斜槓有三 個常 見 的 陷 阱 。 第 一 個 是 「 身 份 分 散 」 。 當 你 的 時 間 被 切 成 太 多 塊 ， 每 一 塊 都 變 得 很 薄 。</p>\n<p>你以為自 己在 「多 元 發 展 」 ， 其 實 你可能 只 是在 「 淺 嚐 輒 止 」 。 履 歷 上 五 個 身 份 看 起 來 很 豐 富 ， 但</p>\n<p>面試時被問 「你到 底 是 誰 」 ， 你 突 然 答 不出 來 。</p>\n<p>第二個是 「 深度不 足 」 。 每 個 領 域 都 有 它 的 「 一 萬 小 時 定 律 」 。 當 你 把 時 間 分 散 在 五 個 領 域 ， 每 個</p>\n<p>領域只得到 兩 千小 時 ， 你可能是 五 個 領 域 的 「 還 不 錯 」 ， 但 沒 有一 個 領 域 的 「 頂 尖 」 。 在 需 要 專 業</p>\n<p>深度的時刻 ，這會 成 為 你 的 天 花 板 。</p>\n<p>第三個是 「 burnout 加 速 」 。 斜 槓 者 往往 有一 種 「 不能 浪 費 時 間 」 的 焦 慮 。 白 天上 班 、 晚 上 教 課 、</p>\n<p>週末寫稿 ， 連通 勤 都 在 聽  podcast 。 這 種 「 全 時 段 生 產 」 的 狀 態 ， 會 讓 你 的 能 量 帳 戶 快 速 透 支 。</p>\n<p>你以為自 己在 擴容 ， 其 實 你可能 只 是在加 速 漏 氣 。</p>\n<p>我認識一 個 設 計 師 ， 她 白 天在 廣 告公司工作 ， 晚 上接 插 畫 案 ， 週 末 還 開 手作 課 程 。 她 說 ： 「 我以 為</p>\n<p>斜槓讓我更自由 ， 但 後 來 我 發 現 ， 我 變 成 五 個 老 闆 的 員 工 ， 而 且 沒 有一 個 老 闆 給 我年 假 。 」 她 累</p>\n<p>到住院，才 終於 停 下 來 問 ： 「 這 些 身 份 之 間 ， 到 底 有 什 麼 關 係 ？ 」</p>\n<p>這個問題 ，是 她 轉 折 的 開 始 。 她 後 來 做 了 一 個 練 習 ， 我 稱 之 為 「 身 份 整 合 盤 點 」 。 她 列 出所 有 身</p>\n<p>份，然後問自 己 ： 「 這 些 身 份 之 間 ，有 沒 有一 條 共 同 的 主 線 ？ 」</p>\n<p>她發現，無 論是 廣 告 設 計 、 插 畫 、 還 是手作 教 學 ， 她 最 享 受 的 都 是 「 把 抽 象 的 想 法 變 成 具 體 的 畫</p>\n<p>面」。這 條主 線 ， 就 是 她 所 有 身 份 的 「 根 」 。 她 開 始 調 整 ： 減 少 純 粹 為 了 賺 錢 的 接 案 ， 增 加能 夠</p>\n<p>「整合視 覺 敘事 」 的 專 案 。一 年 後 ， 她 開 了 一 個 結 合 插 畫 與 品 牌 策 略 的 工作 室 ， 五 個 身 份 長 成了</p>\n<p>一棵樹。</p>\n<p>63這就是斜槓 的關 鍵 ： 不是 「 做 很 多 件事 」 ， 是 「 讓 很 多 事 指向 同 一 件事 」 。</p>\n<p>如果你也正在 斜 槓 的 路 上 感 到分 散 ， 我 想 邀 請 你 做 三 件事 。</p>\n<p>第一件事， 畫出你 的 「 身 份 地 圖 」 。 列 出你所 有的 身 份 ， 然 後問 ： 它 們 之 間 有 什 麼 共 同 的 主 線 ？ 如</p>\n<p>果找不到 ，也 許某 個 身 份 只 是 「 賺 錢 的 兼 差 」 ， 不是 「 擴 容 的一 部分 」 。</p>\n<p>第二件事， 設定 「主 業 與 副 業 的 邊 界 」 。 斜 槓 不是 「 所 有 事都 一 樣 重 要 」 。 選 一 個 主 業 ， 給 它 最多</p>\n<p>的時間與精力 。其 他身 份 是 「 養 分 」 ， 不是 「 負 擔 」 。 當 副 業 開 始 拖 累 主 業 ， 就 是 重 新 校 準 的 時</p>\n<p>候。</p>\n<p>第三件事， 允 許自 己 「 不是 斜 槓 」 。 斜 槓 是 一 種 選 擇 ， 不是 一 種 義 務 。 如果你 發 現 自 己只 熱 愛 一 件</p>\n<p>事，那就 把這件事做 到 極 深 。 深 度 也 是 一 種 擴 容 —— 不是 橫 向 的， 是 縱 向 的。</p>\n<p>斜槓不是逃離主 業 ， 是 讓 你 的 容 器 有 更多入 口 。 擴 容 ， 是 讓 多 重身 份 長 成 一 棵 樹 ， 而 不是 一 片 雜</p>\n<p>草。</p>\n<p>【80 字摘要】  斜 槓 的 風 險 在 於 身 份 分 散 與 深 度不 足 ， 容 易 讓 人 變 成 「 什 麼 都 會 ， 什 麼 都 不 精 」 。 透 過 「 身 份 整 合</p>\n<p>盤點」找出共同主 線 ， 設 定主 副 業 邊 界 ， 讓 多 重身 份 互 相 餵養 ， 長 成 一 棵 樹 而 非 一 片 雜 草 。</p>\n<p>【五個關鍵字】  斜 槓 、 多 重身 份 、 身 份 整 合 、 深 度  vs. 廣 度 、 策 略 擴 容</p>"},
  {id:37, dim:"dim7", title:"三 十 歲 還沒 當 上主 管 ， 是不是 輸 了 ？", summary:"當你三 十 歲 還 在 基 層 ， 當 你 發 現 同 期已 經 帶 團 隊 而 你 還 在 執 行 ， 你 會 不 會 覺 得 自 己 「 落", content:"<p>第 37 篇：三 十 歲 還沒 當 上主 管 ， 是不是 輸 了 ？</p>\n<p>當你三 十 歲 還 在 基 層 ， 當 你 發 現 同 期已 經 帶 團 隊 而 你 還 在 執 行 ， 你 會 不 會 覺 得 自 己 「 落</p>\n<p>後」了？ 但你 有 沒 有 想 過 ， 職 涯 不是 單 一 賽 道 ， 「 當 主 管 」 只 是其 中一 種 贏 法 ？ 透 過 「 自定 義 贏</p>\n<p>法」，拿回定 義 勝利 的 權 力 。</p>\n<p>國中同學會 ，你坐 在 角落 ， 聽 著 大家 交 換 名片 。有 人 說 「 我 現 在 帶 一 個 十 人 團 隊 」 ，有 人 說 「 我 剛</p>\n<p>升專案總 監 」 ，有 人 說 「 我自 己 創 業 ， 營 收 破 千 萬 」 。 輪 到你 ， 你 說 ： 「 我 還 在 做 工 程 師 。 」</p>\n<p>然後你補了 一句 ： 「 不 過 我 很喜 歡 我 的 工作 。 」 但那 句 話 說 得 很 輕 ， 像 是 一 個為 自 己找 藉 口 的 辯</p>\n<p>護。</p>\n<p>回家路上 ，你反 覆 想 ： 「 三 十 歲 了 ， 還沒 當 上主 管 ， 是不是 輸 了 ？ 」 這 個 問題 ， 像 一 根 刺 ， 扎 進 你</p>\n<p>的自尊。你打 開社 群媒 體 ， 看 見 同 齡 人 的 光 鮮 亮 麗 ， 然 後 默默 把 自 己 的 履 歷 設 成不公 開 。</p>\n<p>這種焦慮 ，我 們 太 熟 悉 了 。 在 東 方文化 裡 ， 三 十 歲 像 是 一 個 隱 形 的  deadline 。 你 應 該 要 結 婚 、 應</p>\n<p>該要買房 、 應 該要 當 上主 管 。 這 些 「 應 該 」 像 一 張 網 ， 把 我 們 套 進 一 個 統 一的 時 間 表 裡 。 但 這 個</p>\n<p>時間表是 誰 寫 的？ 為 什 麼 我 們 要 照 著 別 人 的 劇 本 演 自 己 的 人生 ？</p>\n<p>組織心理 學 研究發 現 ， 職 涯 發 展 有 兩 種 模 式 ： 「 階 梯 式 」 與 「 螺 旋 式 」 。 階 梯 式是 傳 統 路 徑 ： 基 層</p>\n<p>→主管→ 經理→ 總 監 ，一 路 向 上 。 螺 旋 式 則 是 ： 在不同 領 域 間 移 動 ，有 時 候 甚 至向 下 或 橫 向 ， 但</p>\n<p>累積出獨特 的 組合能力 。 未 來 的 職 場 ， 「 螺 旋 式 」 越 來 越 常 見 。 因 為 產 業 變 化 太 快 ， 單 一 領 域 的 專</p>\n<p>精，不如 跨 領 域 的 整 合 。 三 十 歲 還 在 基 層 ， 不 代 表你 慢 ； 也 許 你在 累 積 別 人 沒 有的 深 度 。</p>\n<p>但我們心 裡 有三 個 「 主 管 迷 思 」 ， 讓 這 個 道理 進 不 去 。</p>\n<p>第一個迷 思 ： 「 當 主 管 等 於 成 功 。 」 這 是工 業 時 代 的 遺 毒 。 在工 業 時 代 ， 管 理 職 是 唯 一 向 上 流 動 的</p>\n<p>管道。但在知 識 經 濟 時 代 ， 「 專 業 職 」 的 價 值 越 來 越 高 。 頂 尖 工 程 師 、 設 計 師 、 分 析 師 的 薪 資 與 影</p>\n<p>響力，往往超 過 中 階 主 管 。 你不是 「 沒 升 遷 」 ， 你是 選 了 另 一 條 路 。</p>\n<p>第二個迷 思 ： 「 沒 當 主 管 等 於 沒 領 導 力 。 」 領 導 力不是 職 稱 ， 是 影 響 力 。 你可以 沒 有 部 屬 ， 但 透 過</p>\n<p>專業、透 過 協作 、 透 過  mentoring ， 影 響 整 個 團 隊 的 走向 。 這 是 「 無 職 領 導 」 —— 你 沒 有 名片上</p>\n<p>的權力， 但你 有 實 質 的 影 響 力 。</p>\n<p>第三個迷 思 ： 「三 十 歲 是  deadline 。 」 誰 說 的 ？ 職 涯 研究 顯 示 ， 許 多人 的 「 高 峰 」 出 現 在 四 十</p>\n<p>歲、五十 歲 ，甚 至 六 十 歲 。 三 十 歲 只 是 第 一 幕 的 結 尾 ， 不是全 劇 的 終 點 。 你以 為 的 「 落 後 」 ， 可能</p>\n<p>只是「還在 鋪 陳 」 。</p>\n<p>65我認識一個 資料科 學 家 ， 他 在同 一 家公司 做 了 十 年 ， 職 稱 從 「 分 析 師 」 變 成 「 資 深 分 析 師 」 ，中 間</p>\n<p>從未帶過人 。他 的 同 期 有 人 已 經 是 副 總 裁 。 三 十五 歲 那 年 ， 他 一 度 懷 疑 自 己 是不是 「 不 夠 有 企 圖</p>\n<p>心」。但後 來他發 現 ， 他 這 十 年 累 積 的 產 業 知 識 與 技 術 深 度 ， 讓 他 成 為 業 界 極 少 數 「 既 懂 技 術 又 懂</p>\n<p>商業」的人 。四 十 一 歲 ，一 家 新 創 公司以技 術 合 夥 人 的 身 分 邀 請 他 加入 ， 給 的 股 權 比 當 年 那些</p>\n<p>「主管」同期 的 總 年 薪 還 高 。</p>\n<p>他後來跟我 說 ： 「如果我三 十 歲 的 時 候 為 了 當 主 管而 轉 管 理 職 ， 我 現 在可能是 一 個 平 庸 的 經 理 ， 而</p>\n<p>不是一個 頂 尖 的 專 家 。 我 很 慶 幸 我 那 時 候 選 擇 了 繼續 往 下 挖 ， 而 不是 往 上 爬 。 」</p>\n<p>這不是說「 當主管不好 」 。 而 是 說 ， 「 當 主 管 」 只 是 眾 多 贏 法 中的一 種 。 如果你 真 心 喜 歡 帶 人 、 喜</p>\n<p>歡策略、 喜 歡 協 調 資 源 ， 那 主 管 之 路 很 適 合你 。 但 如果你 熱 愛 的 是 專 業 本 身 ， 強 迫 自 己 當 主 管 ，</p>\n<p>只是為了符合 別人 的 期 待 ， 那 你 會 輸 掉 兩 件事 ： 你 的 專 業 ， 和你 的 快 樂 。</p>\n<p>如果你現在也正被 「 三 十 歲 焦 慮 」 困 擾 ， 我 想 邀 請 你 做 一 個 練 習 ： 拿 一 張 紙 ， 寫 下 「 如果 沒 有 人</p>\n<p>知道我的職 稱 ，我 會 如 何 描述 我 的 價 值 ？ 」</p>\n<p>例如：  - 我是 「能解 決 別 人 解 不了 的 技 術 問題 」 的 人 。  - 我是 「 能 讓 團 隊 氣 氛 變 好 」 的 人 。  - 我是</p>\n<p>「客戶最信任 的窗 口 」 。</p>\n<p>這些描述，就是你 的 「 自定 義 贏 法 」 。 它 們 不 需 要 職 稱 背 書 ， 但 它 們 是 真 實 的 影 響 力 。 每 當 「 我是</p>\n<p>不是輸了 」 的聲 音 出 現 時 ， 拿 出 這 張 紙 ， 重 新 校 準 你 的 座 標 。</p>\n<p>職涯不是一 場 統 一的 賽 跑 ， 是 各 自 的 花期 。 三 十 歲 沒 當 主 管 ， 不是 輸 了 ， 是 選 了 另 一 種 贏 法 。 擴</p>\n<p>容，是敢於定 義自 己 的 勝 利 。</p>\n<p>【80 字摘要】  三 十 歲 未 晉 升 主 管 的 焦 慮 源 於 工 業 時 代 的 線 性 職 涯 迷 思 。 透 過 「 自定 義 贏 法 」 描述 無 職 稱 的 影 響</p>\n<p>力價值，理解 專 業 職 與 螺 旋 式 路 徑 ， 讓 擴 容 發 生在自我定 義 的 座 標 系 中。</p>\n<p>【五個關鍵字】  三 十 歲 焦 慮 、 主 管 迷 思 、 職 涯 非 線 性 、 自定 義 贏 法 、 無 聲 領 導</p>\n<p>66</p>"},
  {id:38, dim:"dim7", title:"資 深工作者 的 第二 曲 線 ： 當 經 驗 成 為 包 袱", summary:"當你工作 十五 年 ， 擁 有 豐 富 的 經 驗 與 人 脈 ， 卻 發 現 產 業 正在 改 變 、 你 的 技能正在 貶 值 ，", content:"<p>第 38 篇： 資 深工作者 的 第二 曲 線 ： 當 經 驗 成 為 包 袱</p>\n<p>當你工作 十五 年 ， 擁 有 豐 富 的 經 驗 與 人 脈 ， 卻 發 現 產 業 正在 改 變 、 你 的 技能正在 貶 值 ，</p>\n<p>你會不會感到 一 種 「 被 時 代 拋 下 」 的 恐 慌 ？ 透 過 「 新 手 月 」 計 畫 ， 主 動 回到 初 學 者位 置 ， 開 啟 職 涯</p>\n<p>第二曲線 。</p>\n<p>你坐在會 議 室 裡 ， 年 輕 同 事展示 著 新的 協 作 軟 體 、新的 數 據 工 具 、新的  AI 輔 助 系 統 。 你 聽 著 ， 感</p>\n<p>覺自己像 一 個 旁 觀 者 。 你 想起 十五 年前 ， 你 也 是 那 個 站在前面 教 別 人 的 人 。</p>\n<p>會後，你 試著用 那 個 新 工 具 ， 但 介 面 讓 你 困 惑 。 你 花 了 兩 小 時 ， 做 出 一 個 年 輕 同 事 十 分 鐘 就 能 做</p>\n<p>好的東西 。你感到 一 種 深深 的 羞 恥 —— 不是 因 為 做得 慢 ， 是 因 為 你 發 現 ， 你 引 以 為 傲 的 「 經 驗 」 ，</p>\n<p>在某些時刻 ， 變成了 「 包 袱 」 。</p>\n<p>這是資深工作者 的 共 同 困 境 ： 你 的 經 驗 讓 你高 效 ， 但 也 讓 你 僵 化 。 你 習 慣 了 「 這 樣 做就 對 了 」 ， 於</p>\n<p>是錯過了 「也 許可以 那 樣 做 」 。 你 習 慣 了 「 我知道 」 ， 於 是 停 止 了 「 我 想 知道 」 。</p>\n<p>管理學者  Charles Handy 提出 「 第二 曲 線 」 理 論 ： 任何 組 織 或 個 人 ， 都 必 須 在 第 一 條 成 長 曲 線 達</p>\n<p>到高峰之前 ，就 開 始 培 育 第二 條 曲 線 。 因 為 等到 第 一 條 曲 線 開 始 下 滑 ， 你 已 經 沒 有 資 源 和心力 去</p>\n<p>開創新局 。對 資 深 工作者 來 說 ， 第 一 條 曲 線 是 「 過 去 的 專 業 」 ， 第二 條 曲 線 是 「 未 來 的 可能 」 。 問</p>\n<p>題是：大多 數人 捨 不 得 在 第 一 條 曲 線 還 在 賺 錢 的 時 候 ， 投 資 第二 條 曲 線 。</p>\n<p>我們捨不得 ，是 因 為 經 驗 包 袱 有 三 個 症 狀 ， 讓 我 們 誤 以 為 「 維 持 現 狀 」 才 是安全 的。</p>\n<p>第一個症 狀是 「我知道 」 障 礙 。 你 聽 到 新 想 法 時 ， 第 一 個 反 應 是 「 這 個 我 試 過 ， 沒 用 」 。 但 「 試</p>\n<p>過」是在 什 麼脈 絡 下 ？ 產 業 、 技 術 、 市 場 都 變 了 ， 過 去 的 「 沒 用 」 不 代 表 現 在 的 「 沒 用 」 。 你以 為</p>\n<p>的「經驗 」 ，可能 只 是 「 過 時 的 偏 見 」 。</p>\n<p>第二個症 狀是 「 效 率 」陷 阱 。 你 因 為 經 驗 豐 富 ， 做事 很 快 ， 於 是你 一 直做 「 你 會 做 的 事 」 ， 而 不是</p>\n<p>「你該學 的事 」 。 效 率 變 成了 停 滯 的 藉 口 。 你 每 天 都 在 「 表 現 」 ， 但 沒 有 在 「 成 長 」 。</p>\n<p>第三個症 狀是 「身 份 」 綁 架 。 你 已 經 習 慣 了 「 我是 某 個 領 域 的 專 家 」 ， 於 是你不 敢 踏 入不 熟 悉 的 領</p>\n<p>域，因為 那會 讓你 從 「 專 家 」 變 成 「 新 手 」 。 但 所 有 專 家 ， 都 曾 經 是 新 手 。 你 保 護 身 份 的 成本 ， 是</p>\n<p>失去成長 的可能 。</p>\n<p>我認識一 個 財 務 長 ， 他 在 傳 產 做 了 二 十 年 ， 財 務 報 表 閉 著 眼 睛 都 能 做 出 來 。 但 當 公司 開 始 推 動 數</p>\n<p>位轉型，他發 現自 己 聽 不 懂 「 雲 端 」 、 「 API 」 、 「 數 據 中 台 」 這 些 詞 。 他 一 度 想 逃 避 ， 覺 得 「 這 是</p>\n<p>年輕人的東西 ，我 快 退休 了 ， 不用 學 」 。 但 後 來 他 意 識 到 ， 如果 他 現 在不 學 ， 他 會 變 成 一 個 「 被 退</p>\n<p>休」的人 ，而不是 「 選 擇 退休 」 的 人 。</p>\n<p>67他做了一個 決定 ： 每 年 選 一 個 月， 強 迫 自 己 當 「 新 手 」 。 在 那 個 月 裡 ， 他 學 一 個 完 全不 懂 的 東 西 ，</p>\n<p>找一個「年 輕 導 師 」 ， 允 許 自 己 「 做得 爛 」 。 第 一 年 ， 他 學 的 是  Excel 進 階 函 數 —— 對 年 輕 人 來 說</p>\n<p>很基本，對他 來 說 卻 是全 新的 世界 。 第二 年 ， 他 學 的 是 數 據 視 覺 化工 具 。 第 三年 ， 他已 經 能 夠 在</p>\n<p>董事會上用 儀表 板 呈 現 財 務 趨 勢 ， 讓 所 有 董 事 驚 豔 。</p>\n<p>他說：「我發 現 ， 當 我 願 意回到 初 學 者 的 位 置 ， 我 反而比 那些 年 輕 人 學 得 更 快 —— 因 為 我 有 脈 絡 ，</p>\n<p>我只是缺工具 。而 當 我 把 工 具 補 上 ， 我 就 有 了 他 們 沒 有的 深 度 。 」</p>\n<p>這就是「新手 月 」 計 畫 的 核 心 ： 不是要你 變 成 專 家 ， 而 是要你 的 神 經 系 統 習 慣 「 不 熟 悉 的 感 覺 」 。</p>\n<p>當你每年 有一次 「 從 零 開 始 」 的 經 驗 ， 你 就 不 會 那 麼 害 怕 改 變 。 你 會 記 得 ： 那 種 笨 拙 的 感 覺 ， 只</p>\n<p>是暫時的 ； 那 種 學 會 之 後 的 暢 快 ， 才 是 持 久 的。</p>\n<p>經驗是你的 資 產 ，也 是你 的 牢 籠 。 擴 容 不是 累 積 更多 經 驗 ， 是定 期清空 杯 子 ， 讓 新的 東 西 有 地方</p>\n<p>進來。</p>\n<p>【80 字摘要】  資 深工作者 常 因 經 驗 豐 富 而 陷 入 僵 化 與 效 率 陷 阱 。 透 過 每 年 「 新 手 月 」 計 畫 ， 主 動 回到 初 學 者位</p>\n<p>置，開啟職 涯第二 曲 線 ， 讓 擴 容 發 生在 清空 與 重 新 學 習 的 過 程 中。</p>\n<p>【五個關鍵字】  資 深工作者 、 第二 曲 線 、 經 驗 包 袱 、新 手 月、 創 新 擴 散</p>\n<p>68</p>"},
  {id:39, dim:"dim7", title:"離 職後 的 空 白 期 ： 不是 失 業 ， 是 換 氣", summary:"當你 離 職 後 面 對 履 歷 上 的 空 白 ， 當 你 害 怕 面 試 官 問 「 這 段 時 間 你在 做 什 麼 」 ， 你 會 不 會", content:"<p>第 39 篇： 離 職後 的 空 白 期 ： 不是 失 業 ， 是 換 氣</p>\n<p>當你 離 職 後 面 對 履 歷 上 的 空 白 ， 當 你 害 怕 面 試 官 問 「 這 段 時 間 你在 做 什 麼 」 ， 你 會 不 會</p>\n<p>覺得空白期是 一 種 「污 點 」 ？ 但 如果我告 訴 你 ， 空 白 期 不是 失 業 ， 是 職 涯 的 「 換 氣 」 ？ 透 過 「 空 白</p>\n<p>期擴容計 畫 」 ， 讓 停 頓 成 為 躍 進 的 準 備 。</p>\n<p>你離職三 個 月了 。 第 一 個 月， 你 覺 得解放 ， 每 天 睡 到自 然 醒 ， 終 於 有 時 間 追 劇 、 旅 行 、 見 朋 友 。</p>\n<p>第二個月，你 開 始 焦 慮 ， 打 開  LinkedIn 看 別 人 的 動 態 ， 發 現 大家 都 在前 進 ， 只 有 你在 「 停 滯 」 。</p>\n<p>第三個月，你 開 始 自我 懷 疑 ： 「 我是不是 廢 了 ？ 」「 面 試 官 會 不 會 覺 得 我 很 爛 ？ 」「 空 白 期 會 不 會 讓 我</p>\n<p>找不到工作？ 」</p>\n<p>你開始隨 便投 履 歷 ， 甚 至考 慮 接 受 一 份 「 還 可以 」 的 工作 ， 只 是 為 了 「 填 補 空 白 」 。 你 害 怕 的 不是</p>\n<p>沒有工作 ，是 「 沒 有 在 動 」 的 感 覺 。 這 個 社 會 告 訴 我 們 ： 「 空 白 」 等 於 「 浪 費 」 ， 「 停 頓 」 等 於 「 退</p>\n<p>步」。但我 們 從 來 沒 有 問 ： 如果不 停 頓 ， 我 們 要 怎 麼 知道自 己 下 一 步 該 往哪 裡 走 ？</p>\n<p>職涯研究發 現 ， 「 策 略 性 空 窗 」 對 長 期 職 涯 發 展 有 正面 影 響 。 那些 利 用 空 窗 期 進 行 反 思 、 學 習 、 調</p>\n<p>整方向的人 ，回 歸 職 場 後 的 滿 意度 與 表 現 ， 往往 優 於 「 無 縫 接 軌 」 的 人 。 因 為 無 縫 接 軌 ， 意 味 著</p>\n<p>你沒有時 間問自 己 ： 「 我上 一 份 工作 學 到了 什 麼 ？ 我下 一 份 工作 想 要 什 麼 ？ 」 你 只 是 從 一 個 跑 步</p>\n<p>機，跳上 另 一 個跑 步 機 。</p>\n<p>但我們對空 白期 ， 通 常 有 三 個 誤 解 ， 讓 我 們 急著 「 填 滿 」 它 。</p>\n<p>第一個誤解 ： 「空 白 期 等 於 退 步 。 」 不 。 空 白 期 是 「 橫 向 擴 展 」 的 時 間 。 你可能在 學 新 技能 、 在 照</p>\n<p>顧家人、在 旅行 、 在 寫 作 —— 這 些 都 是 「 成 長 」 ， 只 是 沒 有 反 映 在 職 稱 上 。 你 的 履 歷 上 沒 有 這 段 經</p>\n<p>歷，但你 的內在正在 發 生 變 化 。</p>\n<p>第二個誤解 ： 「面 試 官 會歧 視 空 白 期 。 」 大多 數 面 試 官 在意 的 是 「 空 白 期 你 做 了 什 麼 」 ， 不是 「 空 白</p>\n<p>期有多長 」 。如果你能 說 出 「 這 三 個 月 我 學 了  Python 、 完 成了三 個  side project 」 ， 空 白 期就 變 成</p>\n<p>了「進修期 」 。問題 不是 空 白 ， 是你如 何 敘 述 空 白 。</p>\n<p>第三個誤解 ： 「 必 須 趕 快 填 補 空 白 。 」 這 是 焦 慮 驅 動 的 決 策 。 趕 快 找 工作 的 結 果 ， 往往 是 「 又 進 入</p>\n<p>一份不適合 的工作 」 ， 然 後 六 個 月 後 再 次 離 職 。 空 白 期 是 投 資 ， 不是 浪 費 。 你 現 在 的 「 停 頓 」 ， 是</p>\n<p>為了下一次 的 「 躍 進 」 儲 備 能 量 。</p>\n<p>我認識一 個 產品 經 理 ， 她 裸 辭 後 空 白 了 四 個 月。 前 兩 個 月 她 徹 底 休 息 ， 第 三 個 月 開 始 學 習 使 用者</p>\n<p>體驗設計 ，第四 個 月 做 了 一 個  side project—— 一 個 幫 助 長 輩 學 習 智 慧 型 手 機 的  App 。 她 沒 有 賺</p>\n<p>錢，甚至花了 一 些 積 蓄 。 但 當 她 重 新 面 試 時 ， 這 個  side project 成 為 她 最 有 力 的 談 判 籌 碼 。 她</p>\n<p>69說：「面試官問 的不是 『 為 什 麼 有 四 個 月 空 白 』 ， 而 是 『 這 個  App 的 設 計 思 路 是 什 麼 』 。 空 白 期 變</p>\n<p>成了我的 亮點 。 」</p>\n<p>如果你也正在空 白期 ， 或 預 計 進 入 空 白 期 ， 我 想 邀 請 你 做 三 件事 ， 我 稱 之 為 「 空 白 期 擴 容 計 畫 」 。</p>\n<p>第一件事， 命名你 的 空 白 期 。 不要 說 「 我在 待 業 」 ， 說 「 我在 進 行 職 涯 轉 換 的 準 備 期 」 ， 或 者 「 我</p>\n<p>在進行技能 升 級 的 密 集 訓 練 」 。 命 名 會 改 變 你 對這 段 時 間 的 態 度 ， 也 會 改 變 別 人 對這 段 時 間 的 理</p>\n<p>解。</p>\n<p>第二件事，建立 「微 型 結 構 」 。 不用 像 上 班 那 樣 嚴 格 ， 但 給 自 己每 天三 個 「 錨 點 」 —— 比 如 早 上 九</p>\n<p>點學習、下午 兩點 運動 、 晚 上 八 點 反 思 。 結 構 會 對 抗焦 慮 。 當 你 有 了 結 構 ， 空 白 就 不 再 是 「 失</p>\n<p>控」，而是 「自主 」 。</p>\n<p>第三件事， 創 造 「可 展示 的 成果 」 。 哪 怕 只 是 一 篇 部 落 格 、一 個 小 專 案 、一 張 學 習 證 書 。 這 些 是 空</p>\n<p>白期的「 證 據 」 ， 讓 面 試 官 看 見 你 的 時 間 沒 有 虛 度 。 更 重 要 的 是 ， 讓 你自 己 看 見 ： 這 段 時 間 ， 你 沒</p>\n<p>有白過。</p>\n<p>空白期不是職涯 的 污 點 ， 是 職 涯 的 換 氣 。 擴 容 不是 一 直 前 進 ， 是 允 許 自 己 停 下 來 ， 吸 飽 氣 ， 再 出</p>\n<p>發。</p>\n<p>【80 字摘要】  職 涯空 白 期 往往 被 污 名化 為 停 滯 ， 但 策 略 性 空 窗 是 反 思 與 橫 向 擴 展 的 珍 貴 時 機 。 透 過 「 空 白 期 擴</p>\n<p>容計畫」 命名 、建立 結 構 與 創 造 成果 ， 讓 換 氣 成 為 下 一 次 躍 進 的 準 備 。</p>\n<p>【五個關鍵字】  空 白期 、 職 涯 空 窗 、 換 氣 、 策 略 性 停 頓 、 待 業 焦 慮</p>\n<p>70</p>"},
  {id:40, dim:"dim7", title:"從 執行者到 策 略 者 ： 視 野 的 擴 容", summary:"當你 習 慣 了 「 被交 辦 」 而 不是 「 主 導 」 ， 當 你 發 現 自 己 總 是在 救 火 而 不是 防 火 ， 你可能", content:"<p>第 40 篇： 從 執行者到 策 略 者 ： 視 野 的 擴 容</p>\n<p>當你 習 慣 了 「 被交 辦 」 而 不是 「 主 導 」 ， 當 你 發 現 自 己 總 是在 救 火 而 不是 防 火 ， 你可能</p>\n<p>被困在「 執行者 」 的 位 置 太 久 了 。 透 過 「 策 略 者 時 間 」 ， 每 週 兩 小 時 看地 圖 、 找 槓 桿 、 問 為 什 麼 ， 讓</p>\n<p>擴容發生在 從 效 率 到 效 益 的 視 野 升 級 中。</p>\n<p>下午三點 ，你 的主 管 傳 來 一 封 緊 急 郵 件 ： 「 客 戶 投 訴 ， 立 刻 處 理 。 」 你 放 下手 邊 的 專 案 ， 開 始 打 電</p>\n<p>話、寫回 覆 、 協 調 內 部 資 源 。 五 點 ， 問題 解 決 了 。 你 感 到 一 種 虛 弱 的 成 就感 —— 「 我 又 救 了 一 場</p>\n<p>火。」</p>\n<p>但這是你本 週救 的 第 七 場 火 。 你 發 現 ， 你 的 工作 永 遠 在 「 處 理 突 發 狀 況 」 ， 從 來 沒 有 時 間 「 思 考 預</p>\n<p>防」。你像 一 個消 防 員 ， 每 天 奔 跑 在 燃 燒 的 大 樓 之 間 ， 但 從 來 沒 有 人 問 「 為 什 麼 這 些 大 樓 一 直 在</p>\n<p>燒」。你也 從 來 沒 有 問 過 自 己 ： 「 我能不能 讓 這 些 大 樓 ，一 開 始 就 不要 燒 起 來 ？ 」</p>\n<p>這就是「 執行者 」 的 困 境 ： 你 被 需 要 ， 但 你 沒 有 被 尊 重 。 你 被 忙 碌 證 明了 價 值 ， 但 你 的 價 值 被限</p>\n<p>制在「處理 」 的 層 次 。 你 做得 很 好 ， 但 你 從 來 沒 有 問 「 這 件事 值 不 值 得做 」 。 你是 一 雙 很 快 的 手 ，</p>\n<p>但不是一 顆會 思 考 的 頭 。</p>\n<p>管理大師  Peter Drucker 說 過 一 句 被 引 用 無 數 次 的 話 ： 「 效 率 是 把 事 情 做 對 ； 效 益 是 做 對 的 事</p>\n<p>情。」執行者 追求 效 率 —— 用最 少 的 時 間 ， 把 交 辦 的 事做 到最好 。 策 略 者 追 求 效 益 —— 在 做事 之</p>\n<p>前，先問 「這件事 值 得做 嗎 ？ 」「 有 沒 有 更好 的 方法 ？ 」「 這 個 目 標 本 身 有 沒 有 問題 ？ 」</p>\n<p>從執行者到 策 略者 ， 是 職 涯 中 最 關 鍵 的 躍 遷 。 因 為 它 不 只 是技能 的 升 級 ， 是 視 野 的 擴 容 —— 從 「 看</p>\n<p>見任務」，到 「看 見 系 統 」 。 從 「 我 怎 麼 做 更 快 」 ， 到 「 我 們 為 什 麼 要 做 」 。 從 「 解 決 問題 」 ， 到 「 定</p>\n<p>義問題」。</p>\n<p>但為什麼這 麼多人 卡 在 執 行者 的 位 置？ 我 觀 察 到三 個 症 狀 ， 像 三 條 無 形 的 繩 子 ， 把 我 們 綁 在 原</p>\n<p>地。</p>\n<p>第一條繩子叫 「 忙 碌 成 癮 」 。 你以 為 忙 碌 等 於 重 要 。 但 許 多 忙 碌 ， 只 是 「 別 人 優 先 級 的 奴 隸 」 。 你</p>\n<p>越忙，越 沒 有 時 間 問 「 我 為 什 麼 忙 」 。 而 當 你不 再 問 ， 你 就 變 成了 任 務 的 載 體 ， 而 不是 目 標 的 推</p>\n<p>手。更可怕 的是 ， 忙 碌 會 帶 來 一 種 虛 假 的 滿 足 感 —— 「 我 今 天 處 理了 二 十 件事 」 ， 但 這 二 十 件事 加</p>\n<p>起來，可能不如 一 件 「 對 的 事 」 有 價 值 。</p>\n<p>第二條繩子叫 「問題 依 賴 」 。 同 事 遇 到 問題 都 來 找 你 ， 因 為 你 「 很 會 解 決 」 。 這 讓 你 感 覺 被 需 要 ，</p>\n<p>但也讓你 永 遠困 在 「 解 決 別 人 的 問題 」 裡 ， 無 法 處 理 「 自 己 的 問題 」 。 你 變 成了 團 隊 的 「 急救</p>\n<p>包」，但急救包 從 來 不 會 出 現 在 策 略 會 議 裡 。 你 會發 現 ， 那些 「 很 會 解 決 問題 」 的 人 ， 往往 也 是</p>\n<p>「最沒有 時 間 規 劃 問題 」 的 人 。</p>\n<p>71第三條繩子叫 「視野 萎 縮 」 。 你 只 看到 「 今 天要 做 的 事 」 ， 看不到 「 這 個 月 要 達 成 的 目 標 」 ， 更看不</p>\n<p>到「這個 季度要推 動 的 改 變 」 。 你 的 時 間 尺 度 越 來 越短 ， 你 的 影 響 力 越 來 越 小 。 你 從 「 規 劃 者 」 退</p>\n<p>化成「反 應者 」 ， 從 「 駕駛 」 退 化成 「乘 客 」 —— 只 是 個動 作 很 快 的 乘 客 。</p>\n<p>我認識一個 營 運 經理 ， 她 每 天工作 十 一 小 時 ， 處 理 各 種 突 發 狀 況 ， 團 隊 都 說 「 沒 有 她 不行 」 。 但 三</p>\n<p>年後，公司 升 遷 的 是 另 一 個 「 看 起 來 沒 她 那 麼 忙 」 的 同 事 。 她 憤 怒 、 不 解 ， 覺 得 世界 不公平 。 我</p>\n<p>問她：「你 記得上 一 次 ， 你主 動 提出 一 個 『 不是 被交 辦 』 的 計 畫 ， 是 什 麼 時 候 ？ 」</p>\n<p>她想了五分 鐘 ， 說不出 來 。</p>\n<p>她一直在「 把事情做 對 」 ， 但 她 從 來 沒 有 證 明自 己 可以 「 做 對 的 事 情 」 。 她 的 主 管 不是不 感 謝 她 ，</p>\n<p>而是看不 見 她 的 「 策 略 價 值 」 —— 因 為 她 從 來 沒 有 展示 過 。</p>\n<p>後來她開始做 一件事 ， 我 稱 之 為 「 策 略 者 時 間 」 。 每 週 騰 出 兩 小 時 ， 作 為 「 策 略 者 時 間 」 。 在 這 兩</p>\n<p>小時裡， 禁 止 處理 任何 「 被交 辦 」 的 事 。 只 做 三 件事 。</p>\n<p>第一件事，看地 圖 。 這 個 部 門 、 這 個 專 案 的 「 終 點 」 在 哪 裡 ？ 我 現 在 做 的 每 一 件事 ， 是在 往 終 點</p>\n<p>走，還是在 繞路？ 如果 發 現 自 己 在 繞 路 ， 敢 不 敢 承 認 ？ 很 多 執 行者不 敢 承 認 ， 因 為 承 認 繞 路 ， 等</p>\n<p>於承認自 己 過去 的 忙 碌 有一 部分是 浪 費 。 但 擴 容 ， 就 是 從 承 認 浪 費 開 始 。</p>\n<p>第二件事， 找 槓 桿 。 哪  20% 的 努 力 ， 能 帶 來  80% 的 成果 ？ 我能不能 把 更多 時 間 放 在 那  20% ？ 這</p>\n<p>個問題會 讓你 很不 舒 服 ， 因 為 它 逼 你 承 認 ： 你 現 在 花 的 很 多 時 間 ， 其 實 是 低 價 值 的。 但 策 略 者 必</p>\n<p>須學會「放 棄 」 —— 放 棄 那些 看 起 來 很 忙 、 但 其 實 不 重 要 的 事 。</p>\n<p>第三件事，問 為 什 麼 。 選 一 個 你 「 習 慣 做 」 的 事 ， 問 「 為 什 麼 我 們 這 樣 做？ 」「 有 沒 有 更好 的 方</p>\n<p>式？」這 個問題會 觸 怒 很 多人 ， 因 為 它 挑 戰 了 「 我 們 一 直都 是 這 樣 做 的 」 。 但 策 略 者 的 價 值 ， 就 在</p>\n<p>於敢於問出這 個 「 為 什 麼 」 。</p>\n<p>她說：「一開 始那 兩 小 時 很 痛苦 ， 我 坐 立 不安 ， 覺 得 有 人在等我回 覆 郵 件 。 但 做 了 兩 個 月 後 ， 我 發</p>\n<p>現我開始能 夠在會 議 上 說 出 『 我 們 為 什 麼 不 走 另 一 條 路 』 ， 而 且 我 的 建 議 被 採 納 了 。 我 第 一 次 感 覺</p>\n<p>到，我不是在救 火 ， 我是在 設 計 防 火 系 統 。 」</p>\n<p>執行者救火 ， 策 略 者 防 火 。 擴 容 不是 讓 你更 忙 ， 是 讓 你 從 「 把 事 情 做 對 」 ， 升 級 到 「 做 對 的 事</p>\n<p>情」。當你 開 始看 見 系 統 ， 你 就 從 消 防 員 ， 變 成了 建 築 師 。</p>\n<p>【80 字摘要】  困在 執 行者位 置 往往 導 致 忙 碌 成 癮 與視 野 萎 縮 。 透 過 每 週 「 策 略 者 時 間 」 進 行地 圖 檢 視 、 槓 桿 分</p>\n<p>析與質疑 慣性 ， 讓 擴 容 發 生在 從 效 率 到 效 益 的 視 野 升 級 中。</p>\n<p>【五個關鍵字】  執行者 、 策 略 者 、 Peter Drucker 、 效 率 與 效 益 、 視 野 擴 容</p>\n<p>72</p>"},
  {id:41, dim:"dim7", title:"擴容期間，請主動選擇失衡：一個CEO的「非線性能量配置」法則", summary:"2026年頂尖工作者不再追求工作與生活平衡，而是掌握「非線性能量權衡」。透過「傾斜期、重構期、穩定期」三階段，在特定階段主動選擇失衡，將高品質能量集中於高槓桿事務，讓失衡成為擴容的加速器。", content:"<p>週五晚上七點，你關掉筆電，準備去赴一場朋友的生日聚餐。手機響了，是主管：「週一董事會，需要你補一份資料。」你嘆了口氣，開始打開電腦。心裡那個「要平衡」的聲音在譴責你：「你又在犧牲生活了。」</p>\n<p>但你有沒有想過，這個「平衡」的聲音，可能正是你無法擴容的原因？</p>\n<p>2026年的職場趨勢報告已經明確指出，傳統的「工作與生活分離」模式正在被淘汰，取而代之的是「Work-Life Integration」與「Fluid Workday」——工作者開始依據能量高低與生活需求，動態調整工作節奏，而非追求僵化的平衡。這意味著什麼？意味著「平衡」這個概念本身，已經過時了。</p>\n<p>我認識一位科技公司執行長，叫他陳總。陳總每週工作八十小時，但他每個月會消失三天，去花蓮衝浪。他的秘書說：「這三天誰都找不到他，連董事長都打不通。」你會說：「這就是平衡啊，努力工作，認真玩。」錯。陳總告訴我：「我不是在平衡，我是在『策略性傾斜』。董事會前那兩週，我幾乎住公司，因為那時候的能量放在這裡報酬率最高。專案空檔期，我連手機都不看，因為那時候的能量應該留給家人。」</p>\n<p>這就是「非線性能量配置」。不是每天平均分配八小時給工作、八小時給生活，而是「在對的階段，把對的能量，傾斜到對的地方」。</p>\n<p>管理學者 Jim Loehr 與 Tony Schwartz 在《能量管理》中提出：時間是有限的，但能量是可以管理的。他們將能量分為身體、情緒、心智、精神四個維度。多數人管理時間，頂尖者管理能量。而我要進一步說：頂尖中的頂尖，管理的是「能量的傾斜時機」。</p>\n<p>為什麼「平衡」是擴容的敵人？因為擴容本質上是「打破現狀」。你的容器要變大，必須經歷某個階段的「超載」——學新技能、扛新責任、進入新領域。這些都需要額外的能量投入。如果你堅持每個階段都要「平衡」，你就永遠無法進入「超補償」狀態，也就永遠無法擴容。</p>\n<p>我提出一個實戰框架，叫做「能量週期三階段」：</p>\n<p>第一階段，「傾斜期」（The Tilt）。這是主動選擇失衡的階段。可能是新專案上線、轉職過渡、或是學習新領域。在這個階段，你必須接受：某些生活領域會暫時乾涸。關鍵是「知情同意」——不是被工作追殺而失衡，是你「選擇」把能量傾斜過去。這個選擇權的差異，決定了你是受害者還是策略家。</p>\n<p>第二階段，「重構期」（The Recalibration）。傾斜之後，你必須刻意安排「能量回填」。這不是「休息」，而是「重建」。陳總的衝浪不是放鬆，是讓他的大腦從「決策模式」切換到「感知模式」。許多CEO喜歡跑步、冥想、甚至做手工，因為這些活動能讓大腦的「預設模式網絡」活躍起來，把傾斜期吸收的資訊，整合成新的認知結構。</p>\n<p>第三階段，「穩定期」（The Plateau）。這是享受擴容成果的階段。你的容器變大了，同樣的工作量不再耗盡你。這時候你可以回到一個相對「平衡」的狀態——但你知道，這個平衡是暫時的，下一個傾斜期遲早會來。</p>\n<p>2026年的職場，AI正在接管標準化勞力，人與人最大的差距將是「能量配置的效率」。當AI可以幫你處理瑣事，你更該問的不是「我還有多少時間」，而是「我還有多少高品質能量，以及我準備把它傾斜到哪裡？」</p>\n<p>如果你現在正處於某個「撐不住」的階段，也許不是因為你不懂平衡，而是因為你還沒學會「主動失衡」。擴容從來不是溫和的過程，它是你在某個季節裡，選擇讓某一部分的自己暫時枯萎，好讓另一部分長成參天大樹。</p>\n<p>真正的強大，不是同時顧好所有面向。是敢於在對的時候，讓某些面向先裂開，好讓光進來。</p>"},
  {id:42, dim:"dim7", title:"退休不是 終 點 ： 人生 第 三 幕 的 擴 容 規 劃", summary:"當你以 為 退休 就 是 「 不用 再 工作 」 ， 你可能正在 錯 過 人生最 豐 富 的 第 三 幕 。 退休 不是 終", content:"<p>第 42 篇： 退休不是 終 點 ： 人生 第 三 幕 的 擴 容 規 劃</p>\n<p>當你以 為 退休 就 是 「 不用 再 工作 」 ， 你可能正在 錯 過 人生最 豐 富 的 第 三 幕 。 退休 不是 終</p>\n<p>點，是另 一 種 擴容 的 開 始 。 透 過 「 第 三 幕 藍 圖 」 ， 規 劃 退休 後 的 身 份 、 連 結 與 貢 獻 ， 讓 時 間 擴 容超 越</p>\n<p>職稱的邊 界 。</p>\n<p>五十五歲 ，你 開 始 數 日 子 。 再 過 五 年 ， 就 可以 領 退休 金了 。 再 過 五 年 ， 就 可以 「 不用 再 早 起打 卡 」</p>\n<p>了。你幻想著 退休 後 的 生活 ： 旅 行 、 種 花 、 含 飴 弄 孫 ， 或 者 什 麼 都 不 做 ， 就 坐 在 陽 台 上 喝 咖 啡 。</p>\n<p>但心裡有一 個 很小 的 聲 音 ， 在 深 夜 裡 問 你 ： 「 退休 後 ， 我是 誰 ？ 」</p>\n<p>這個問題 讓你 害怕 。 因 為 你 發 現 ， 過 去 三 十 年 ， 你 的 身 份 幾 乎 完 全 由 職 稱 定 義 。 你是 「 王 經 理 」 、</p>\n<p>「李副總 」 、 「 張主 任 」 。 當 這 些 頭 銜 被 摘 掉 ， 你 還 剩 下 什 麼 ？</p>\n<p>退休心理 學 研究發 現 ， 許 多人在 退休 後 的 六 個 月 內 經 歷 「 退休 憂 鬱 」 —— 不是 因 為 沒 有 事做 ， 是 因</p>\n<p>為沒有「被 需要 」 的 感 覺 。 當 你 從 「 每 天 有 人 找 你 」 變 成 「 沒 有 人 記 得 你 」 ， 那 種 落 差 ， 比任何 工</p>\n<p>作壓力都沉重 。</p>\n<p>退休有三 個常 見 的 恐 懼 。 第 一 個 是 「 身 份 消 失 」 。 在 職 場 裡 ， 你是 某 個 角 色 、 某 個 功 能 、 某 個 位</p>\n<p>置。退休後 ，這 些 標 籤 全部 失 效 。 你 從 「 誰誰誰 」 變 成 「 那 個 退休 的 」 。 這 種 身 份 的 剝 奪 ， 會 讓 人</p>\n<p>感到自己正在 從 世界 上 消 失 。</p>\n<p>第二個是 「社交 斷 裂」 。 職 場 提 供 了你 八 成 的 社 交 網 絡 —— 同 事 、 客 戶 、 供 應 商 。 退休 後 ， 這 些 連</p>\n<p>結會迅速萎 縮 。你 會發 現 ， 許 多 「 朋 友 」 其 實 只 是 「 工作 關 係 」 ， 當 工作 結 束 ， 關 係 也 結 束 了 。</p>\n<p>第三個是 「意 義真空 」 。 工作 給 了我 們 一 個 「 被 需 要 」 的 理 由 。 退休 後 ， 當 沒 有 人 再 問 你意 見 、 沒</p>\n<p>有人再等你 決定 、 沒 有 人 再因 為 你 的 存 在 而 改 變 ， 你 會 開 始 懷 疑 ： 「 我 還 有 價 值 嗎 ？ 」</p>\n<p>我認識一 個 退休 的 財 務 長 ， 他 在 六 十 二 歲 退休 。 前 六 個 月， 他 過 得 很 快 樂 —— 旅 行 、 打 高 爾 夫 、 陪</p>\n<p>孫子。第 七 個 月， 他 開 始 感 到 一 種 說 不上 來 的 煩 躁 。 他 說 ： 「 我 發 現 ， 當 沒 有 人 再 問 我 『 這 個 數 字</p>\n<p>怎麼看』，我 開 始 懷 疑 自 己 是不是 還 有 用 。 」</p>\n<p>後來他做了 一件事 ： 他 開 始 免 費 輔 導 社 會 企 業 的 財 務 規 劃 。 每 週 兩 個 上 午 ， 他去 一 個 新 創 育 成 中</p>\n<p>心，幫年 輕 創 業者看 財 務 報 表 。 他 說 ： 「 我不是 為 了 錢 ， 是 為 了 那 種 『 有 人 需 要我 』 的 感 覺 。 當 一</p>\n<p>個年輕人 說 『 謝謝 你 ， 這 個 我 搞 了三 個 月 都 看不 懂 』 ， 我 感 覺 我 的 容 器又 活 過來 了 。 」</p>\n<p>這就是「第三 幕 藍 圖 」 的 核 心 ： 退休 不是人生 的 退 場 ， 是 第 三 幕 的 開 場 。 但 這 一 幕 不 會 自 動 上</p>\n<p>演，你需要主 動 規 劃 。</p>\n<p>如果你也正在接 近 退休 ， 或 者 已 經 退休 ， 我 想 邀 請 你 做 三 件事 。</p>\n<p>76第一件事， 規 劃你 的 「 退休 身 份 」 。 不是 「 我要 做 什 麼 」 ， 是 「 我要成 為 什 麼 」 。 也 許 是 「 那 個 會 幫</p>\n<p>年輕人看 財 務 報表 的 前 輩 」 、 也 許 是 「 那 個 在社 區 大 學 教 攝 影 的 退休 老 師 」 。 身 份 不 需 要 偉 大 ， 它</p>\n<p>需要具體 。</p>\n<p>第二件事，建立 「 退休 前 的 社 交 橋樑 」 。 在 退休 前三年 ， 開 始 培 養 「 非 工作 」 的 社 交 圈 —— 興 趣 社</p>\n<p>團、志工 組 織 、社 區 活 動 。 這 些 連 結 會 在 退休 後 ， 成 為 你 的 情 感 基 礎 設 施 。</p>\n<p>第三件事， 找到你 的 「 貢 獻 方式 」 。 退休 後 的 意 義 ， 往往 來 自 「 給 予 」 而 不是 「 獲 得 」 。 你 累 積 了</p>\n<p>三十年專 業 ，這 些 專 業 不 需 要 退休 。 找 到 一 個 你可以 持 續 貢 獻 的 場 域 —— 輔 導 、 教 學 、 志 工 、 顧 問</p>\n<p>——讓你 的 經 驗 繼續 流 動 。</p>\n<p>退休不是終點 ，是 另 一 種 擴 容 的 開 始 。 擴 容 ， 從 你 願 意在 沒 有 職 稱 的日 子 裡 ， 依 然 看 得 見 自 己 的</p>\n<p>價值開始 。</p>\n<p>【80 字摘要】  退休後 的 憂 鬱 往往 來 自 身 份 消 失 、 社 交 斷 裂 與 意 義 真空 。 透 過 「 第 三 幕 藍 圖 」 規 劃 退休 身 份 、 建</p>\n<p>立非工作社交 圈 與 找 到 貢 獻 方式 ， 讓 時 間 擴 容超 越 職 稱 的 邊 界 ， 開 啟 人生最 豐 富 的 第 三 幕 。</p>\n<p>【五個關鍵字】  退休 規 劃 、 人生 第 三 幕 、 身 份 轉 換 、 退休 憂 鬱 、 時 間 擴 容</p>\n<p>77</p>"},
  {id:43, dim:"dim8", title:"那 個 「 還 不 錯 」 的 人生 ， 其 實 正在 悄悄 吃 掉 你 的 靈 魂", summary:"當你 擁 有 別 人 羨 慕 的 薪 水 與 職 稱 ， 卻 在 深 夜 感 到 莫 名 的 空 虛 ， 「 還 不 錯 」 是 靈 魂 的 安 眠", content:"<p>第 43 篇： 那 個 「 還 不 錯 」 的 人生 ， 其 實 正在 悄悄 吃 掉 你 的 靈 魂</p>\n<p>當你 擁 有 別 人 羨 慕 的 薪 水 與 職 稱 ， 卻 在 深 夜 感 到 莫 名 的 空 虛 ， 「 還 不 錯 」 是 靈 魂 的 安 眠</p>\n<p>藥。透過 每 月 「 靈 魂 體 檢 」 三 問 ， 重 新 辨 識 自 己 真 正在 乎 的 事 ， 讓 不 滿 足 成 為 擴 容 的 起 點 。</p>\n<p>週五晚上 ，你和同 事 在 東 區 的 高 級 餐 廳 慶 祝 專 案 結 案 。 燈 光 美 、 氣 氛 佳 ， 你 舉 起 酒 杯 ， 說 ： 「 這 樣</p>\n<p>也不錯啦 。 」 但那 句 話 說 出 口 的 時 候 ， 你 感 覺 到 某 種 東 西 從 喉 嚨 深 處 滑 落 —— 不是 滿 足 ， 是 一 種 說</p>\n<p>不上來的 稀 薄 。</p>\n<p>你已經三 十五 歲 ， 年 薪 百 萬 ， 職 稱 是 經 理 。 你 擁 有 別 人 羨 慕 的 「 還 不 錯 」 。 但 你知道 ， 這 個 「 還 不</p>\n<p>錯」是一 個慢慢 漏 氣 的 氣 球 。 它 不 會 突 然 爆 炸 ， 它 只 是 每 天 少 一 點 浮 力 ， 直 到 有一 天你 發 現 自 己</p>\n<p>再也飛不起 來 。</p>\n<p>這種狀態 ， 哲 學家 尼 采 早 就 警 告 過 。 他 說 ， 末 人 會 說 ： 「 我 們 發 明了 幸 福 。 」 然 後 眨眨 眼 。 那 個 眨</p>\n<p>眼的動作 ，就是 靈 魂 死 去 的 瞬 間 。</p>\n<p>現代職場 裡 的 「末 人 」 ， 往往 就 是 那些 「 什 麼 都 不在 乎 」 的 人 。 不是 因 為 他 們 真 的 豁 達 ， 而 是 因 為</p>\n<p>他們曾經在乎 過 ， 然 後 被 現 實 磨 到不 敢 再 在 乎 。 他 們說 「 這 樣 也 不 錯 啦 」 ， 其 實 是在 說 「 我 已 經 沒</p>\n<p>有力氣追求更好了 」 。</p>\n<p>我認識一 個 財 務 經 理 ， 叫 他 阿 明 。 阿 明在 四 大会 計 師 事 務 所 做 了 八 年 ， 每 天 處 理 數 字 、 報 表 、 客</p>\n<p>戶的刁難 。三 十四 歲 那 年 ， 他 升 上 經 理 ， 薪 水 跳 了三成 ， 公司 配 了 車 位 ， 名片上 的 字 變 大了 。 他</p>\n<p>應該要快 樂 的，所 有 人 都 是 這 麼 說 的。</p>\n<p>但某個週二 晚上 ， 他 獨 自 開 車 回家 ， 等 紅 燈 的 時 候 ， 突 然 發 現 自 己 已 經 想 不 起 來 上 一 次 「 期 待 上</p>\n<p>班」是什 麼 時 候 。 他想起 大 學 時 候 的 自 己 ， 那 個 會 為 了 一 道 會 計 題 熬 夜 、 因 為 解 開 難 題 而 興 奮 的</p>\n<p>大男孩。 那 個 男 孩 不 見 了 ， 取而代 之 的 是 一 個 熟 練 的、 精 準 的、 但 某 種 程 度上 已 經 「 關機 」 的 專</p>\n<p>業人士。</p>\n<p>他跟我說 ： 「我不是不 快 樂 ， 我 只 是 …… 沒 有 感 覺 了 。 」</p>\n<p>這就是「 還不 錯 」 最 危 險 的 地方 。 它 不 會 讓 你 痛苦 到 必 須 改 變 ， 它 只 會 讓 你 麻 木 到 忘 記 自 己 還 可</p>\n<p>以改變。你會 開 始 用物 質 填 補 意 義 —— 買 更 貴 的 包 、 換 更大 的 房 子 、 吃 更 精 緻 的 餐 廳 ， 但那些 東 西</p>\n<p>帶來的滿 足感 越 來 越短 。 因 為 你 的 靈 魂 需 要 的 不是更多 ， 是更 深 。</p>\n<p>你也會開 始對 「 改 變 」 感 到 恐 懼 ， 甚 至 厭 惡 。 你 會 說 「 換 工作 風 險 太 大 」 、 「 創 業 太 不 穩 定 」 、 「 現</p>\n<p>在這樣至少安全 」 。 安全 沒 有 錯 ， 但 當 安全成 為 唯 一的 價 值 ， 你 的 容 器 就 開 始 萎 縮 。 你不 再 探 索 ，</p>\n<p>78不再冒險，不 再 讓自 己 處 於 「 有 點 不 確 定 」 的 狀 態 。 你 把 自 己 活成了 一 個 保 險 箱 ， 堅 固 ， 但 裡 面</p>\n<p>什麼也沒 有。</p>\n<p>還有一個更 隱 蔽 的 警 訊 ： 你 羨 慕 別 人 ， 但 不行 動 。 你 會 花 兩 小 時 看 別 人 的 創 業 故 事 、 別 人 的 環 遊</p>\n<p>世界、別人 的 轉職 心 得 ， 然 後 關 掉 手 機 ， 繼續 做 那 份 「 還 不 錯 」 的 工作 。 羨 慕 是 靈 魂 還 活 著 的 證</p>\n<p>據，不行 動是 靈 魂 正在 死 去 的 證 據 。 你在用 別 人 的 勇敢 ， 來 餵養 自 己 的 遺 憾 。</p>\n<p>阿明後來做了 一件事 ， 我 稱 之 為 「 靈 魂 體 檢 」 。 每 個 月 最 後 一 個 週 五 晚 上 ， 他 給 自 己 一 小 時 ， 關 掉</p>\n<p>手機，誠 實回 答三 個 問題 。</p>\n<p>第一個問題 ：這 個 月，有 哪 一 刻 我 感 覺 「 這 就 是我 來 這 世 上 的 原 因 」 ？ 如果 沒 有， 為 什 麼 ？</p>\n<p>第二個問題 ：我 現在 的 「 還 不 錯 」 ，有 多 少 是 為 了 別 人 的 眼 光 ，有 多 少 是 為 了自 己 ？</p>\n<p>第三個問題 ：如果 錢 不是 問題 ， 我 會 怎 麼 安 排 下 個 月的 生活 ？ 那 個 答 案 裡 ， 藏 著 你 真 正在 乎 的</p>\n<p>事。</p>\n<p>這三個問題不會 給你 立即 的 答 案 ， 但 它 們 會 像 三 顆 石 頭 ， 投 進 你平 靜 的 湖 面 ， 讓 你看 見 水 面下 還</p>\n<p>有什麼在 動 。 阿明 做 了三 個 月 後 ， 發 現 自 己 真 正 想 要 的 不是 創 業 ， 也 不是 環 遊 世界 ， 而 是 「 能 夠</p>\n<p>在上班時 間之外 ， 還 有 力 氣 畫畫 」 。 他 從 小 喜 歡 畫畫 ， 但 為 了 「 還 不 錯 」 的 人生 ， 他 把 畫 筆 收了 二</p>\n<p>十年。</p>\n<p>他沒有立刻 辭職 。他 只 是 開 始每 週 六 早 上 ， 去 畫 室待 三小 時 。 三小 時 不多 ， 但那 是 他 的 靈 魂 重 新</p>\n<p>開始呼吸 的 時 間 。 他 說 ： 「 我 第 一 次 感 覺 到 ， 那 個 『 還 不 錯 』 的 氣 球 ， 好 像 停 止 漏 氣 了 。 」</p>\n<p>「還不錯」是 靈 魂 的安 眠 藥 。 它 不 會 殺 死 你 ， 它 只 會 讓 你 慢慢睡 著 ， 錯 過 自 己 本 來 可以成 為 的 樣</p>\n<p>子。擴容 的第 一 步 ， 是 從 承 認 「 我不 滿 足 」 開 始 。 那 個 不 滿 足 不是 貪 婪 ， 是 靈 魂 在 說 ： 「 我 還 想</p>\n<p>活。」</p>\n<p>【80 字摘要】  當 「 還 不 錯 」 成 為 溫 水 煮 青 蛙 式 的 靈 魂 耗 損 ， 物 質 與 安全 感 可能正在 壓 縮 你 的 內 在 容 器 。 透 過 每</p>\n<p>月「靈魂 體 檢 」三 問 ， 重 新 辨 識 自 己 真 正在 乎 的 事 ， 讓 不 滿 足 成 為 擴 容 的 起 點 。</p>\n<p>【五個關鍵字】  價 值 觀 衝 突 、 末 人 、 靈 魂 體 檢 、 職 涯 意 義 、 不 滿 足</p>\n<p>79</p>"},
  {id:44, dim:"dim8", title:"能力 焦 慮 ： 你以 為 自 己 不 夠 好 ， 其 實 只 是 還沒 看 見 輪 廓", summary:"當你面 試 被 拒 、 專 案被 退 、 看 著 別 人 輕 鬆 做 到你 費 盡 全力 才完 成 的 事 ， 你 會 不 會 懷 疑 自", content:"<p>第 44 篇：能力 焦 慮 ： 你以 為 自 己 不 夠 好 ， 其 實 只 是 還沒 看 見 輪 廓</p>\n<p>當你面 試 被 拒 、 專 案被 退 、 看 著 別 人 輕 鬆 做 到你 費 盡 全力 才完 成 的 事 ， 你 會 不 會 懷 疑 自</p>\n<p>己天生就不 夠好？ 但 你 有 沒 有 想 過 ， 你以 為 的 「 能力不 足 」 ， 可能 只 是 「 輪 廓 還沒 浮 現 」 ？ 透 過 「 能</p>\n<p>力考古」 練 習 ， 讓 能力 輪 廓 在 實 作 中 自 然 浮 現 。</p>\n<p>你坐在面 試 室 的 椅 子上 ， 背 脊 挺 直 ， 手心 卻 在出 汗 。 面 試 官 看 著 你 的 履 歷 ， 問 了 一 個 你 沒 準 備 到</p>\n<p>的問題。你 結 巴了三 十 秒 ， 然 後 看 見 他 微微 皺 眉 。 那 個 皺 眉 只 有 零 點 五 秒 ， 但 你在接下 來 的 三 個</p>\n<p>月裡，反 覆回放 。</p>\n<p>「我不夠好 。 」</p>\n<p>這個聲音 從此 住進 你 的 腦 袋 。 每 次 遇 到 新 挑 戰 ， 它 都 會 跳 出 來 。 你 開 始 迴 避 需 要 「 證 明自 己 」 的</p>\n<p>場合，開 始只做 「 確 定 會 成 功 」 的 事 ， 開 始把 「 我 還沒 準 備 好 」 當 成 拖 延 的 藉 口 。</p>\n<p>但你有沒 有想 過 ， 你以 為 的 「 能力不 足 」 ， 其 實 只 是 「 還沒 被 看 見 」 ？</p>\n<p>心理學家  Carol Dweck 提出 「 成 長 型 思 維 」 與 「 固 定 型 思 維 」 的 區 別 。 固 定 型 思 維 的 人相信能力</p>\n<p>是天生的、固定 的 ； 成 長 型 思 維 的 人相信能力是可以 透 過 努 力 與 學 習 擴 展 的。 Dweck 的 研究 發</p>\n<p>現，固定型 思 維者在 遭 遇 失 敗 時 ， 大 腦 活 動 幾 乎 停 滯 —— 他 們 在 逃 避 。 而 成 長 型 思 維 者 的 大 腦 在 失</p>\n<p>敗時反而更活 躍 —— 他 們 在分 析 、 在 重 組 、 在 尋 找 新 策 略 。</p>\n<p>這就是擴容 的關 鍵 ： 你不是不 夠 好 ， 你 只 是 還 在 「 浮 現 」 的 過 程 中。 就 像 一 幅 素 描 ， 在 輪 廓 出 現</p>\n<p>之前，看起 來 只是 一 團 亂 線 。</p>\n<p>我後來發 現 ，能力 焦 慮 的 人 ， 心 裡 通 常 有 三 個 錯 覺 ， 讓 他 們 誤 以 為 自 己 「 壞 掉 了 」 。</p>\n<p>第一個錯 覺 ： 「 別 人天生 就 會 。 」 這 是社 群媒 體 的 詛 咒 —— 你 只 看到 别 人 光 鮮 的 成果 ， 沒 看 見 他 們 凌</p>\n<p>晨的練習 。 幾乎所 有 「 看 起 來 輕 鬆 」 的 背 後 ， 都 有 你不 曾 參 與 的 累 積 。</p>\n<p>第二個錯 覺 ： 「 一 次 失 敗 等 於 永 遠 失 敗 。 」 固 定 型 思 維 會 把 單 一 事件 「 災 難 化 」 —— 一 次 簡 報 搞 砸 ，</p>\n<p>就等於「我不會 簡 報 」 ； 一 次面 試 被 拒 ， 就 等 於 「 我不 夠 資 格 」 。 但 成 長 型 思 維 知道 ， 每 一 次 失 敗</p>\n<p>只是「這 個 策 略在 這 個 情 境 下不 適 用 」 ， 而 不是 「 我 這 個 人不 適 用 」 。</p>\n<p>第三個錯 覺 ： 「 準 備 好 才 能 開 始 。 」 這 是最 毒 的 錯 覺 。 真 相是 ： 你 永 遠 不 會 「 完 全 準 備 好 」 。 擴 容</p>\n<p>的過程，本 來就是在 「 還沒 準 備 好 」 的 狀 態 下 ， 邊 做 邊 長 出 新的 能力 。</p>\n<p>我認識一 個年 輕 的 產 品 經 理 ， 她 第 一 次主 導 產 品 發 表 會 時 ， 簡 報 被 主 管 批 評 「 邏 輯 混 亂 」 。 她 躲 在</p>\n<p>會議室裡 哭了二 十 分 鐘 ， 然 後問 自 己 ： 「 我是 邏 輯 混 亂 的 人 ， 還 是 這 次 簡 報 的 邏 輯 混 亂 ？ 」 她 選 擇</p>\n<p>80相信後者。接下 來 的 三 個 月， 她 每 週 練 習 一 次 簡 報 ， 錄 影 、 回 放 、 修 正 。 半 年 後 ， 她 的 簡 報 成 為</p>\n<p>部門的標 竿 。</p>\n<p>她說：「我發 現 ，能力不是 『 有 』 或 『 沒 有 』 ， 是 『 還 在 長 』 。 那 個 讓 我 哭 的 二 十 分 鐘 ， 其 實 是我 的</p>\n<p>容器在撐 開 的聲 音 。 」</p>\n<p>如果你現在也 處於 那 種 「 覺 得 自 己 不 夠 好 」 的 狀 態 ， 我 想 邀 請 你 做 一 個 練 習 ： 「 能力 考 古 」 。</p>\n<p>拿出紙筆， 寫下你 過 去 五 年 「 以 為 自 己 做 不好 ， 但 最 後 完 成了 」 的 三 件事 。 越 具 體 越 好 —— 當 時 的</p>\n<p>恐懼是什 麼？你做 了 什 麼 ？ 最 後 的 結 果如 何？</p>\n<p>你會發現一 個 模式 ： 你 的 「 能力 輪 廓 」 往往 不是 線 性成 長 的， 而 是在 某 個 關 鍵 時 刻 ， 因 為 被 逼 到</p>\n<p>牆角，突然 長出 來 的。 那些 時 刻 當 時 很 痛苦 ， 但 回 頭 看 ， 都 是你 的 擴 容 點 。</p>\n<p>接下來，選 一件你 「 覺 得 自 己 還沒 準 備 好 」 的 事 ， 給 自 己 一 個 「 低 風 險 實 驗 」 —— 比 如公 開 分 享 、</p>\n<p>申請一個 有點超 過 的 職 缺 、 主 動 承 擔 一 個 新 專 案 。 告 訴 自 己 ： 「 我不是在 證 明我 夠 好 ， 我是在收 集</p>\n<p>數據，看看我 的 輪 廓 現 在 長 到 哪 裡 了 。 」</p>\n<p>你以為的能力不 足 ， 只 是 輪 廓 還沒 浮 現 。 而 那些 讓 你以 為 自 己 不 夠 好 的 時 刻 ， 其 實 都 是 素 描 師 的</p>\n<p>手，正在 幫你 描出 邊 界 。</p>\n<p>【80 字摘要】  能力焦 慮 往往 源 於 固 定 型 思 維 ， 將 單 一 失 敗 災 難 化 。 透 過 「 能力 考 古 」 練 習 辨 識 過 去 的 擴 容 點 ，</p>\n<p>並以「低 風 險 實 驗 」 收 集 數 據 ， 讓 能力 輪 廓 在 實 作 中 自 然 浮 現 。</p>\n<p>【五個關鍵字】  能力焦 慮 、 成 長 型 思 維 、 Carol Dweck 、 能力 考 古 、 低 風 險 實 驗</p>"},
  {id:45, dim:"dim8", title:"意 義 感 赤 字 ： 當 工作 只 剩 下 功 能 ， 沒 有 了 靈 魂", summary:"當你發 現 自 己每 天 做 的 事 「 有 用 」 但 「 沒 意 義 」 ， 你可能正在 經 歷 「 意 義 感 赤 字 」 。 這 不", content:"<p>第 45 篇：意 義 感 赤 字 ： 當 工作 只 剩 下 功 能 ， 沒 有 了 靈 魂</p>\n<p>當你發 現 自 己每 天 做 的 事 「 有 用 」 但 「 沒 意 義 」 ， 你可能正在 經 歷 「 意 義 感 赤 字 」 。 這 不</p>\n<p>是矯情，是 現代職 場 的 流 行 病 。 透 過 「 意 義 重 構 」 練 習 ， 把功 能 連 結 到 靈 魂 ， 讓 擴 容 發 生在 價 值 與</p>\n<p>行動的重 新 對焦 中。</p>\n<p>年終考核會 議上 ， 主 管 看 著 你 的 績 效 表 ， 點 頭 說 ： 「 今 年表 現 很 好 ， 所 有  KPI 都 達 標 ， 明年 繼續 保</p>\n<p>持。」你微 笑 說 謝謝 ， 但 心 裡 有一 個 聲 音 在 問 ： 「 然 後 呢 ？ 」</p>\n<p>然後呢？這三 個字 像 一 根 細 針 ， 扎 進 你看 似 完 美 的 職 涯 氣 球 裡 。 你 擁 有 穩 定 的 薪 水 、 響 亮 的 職</p>\n<p>稱、主管 的信任 、 同 事 的 尊 重 。 你 應 該 滿 足 的， 所 有 人 都 這 麼 說 。 但每 當 深 夜 獨 處 ， 你 會 感 覺 到</p>\n<p>一種說不上 來 的 稀 薄 —— 好 像 你 每 天 都 在 做事 ， 但 這 些 事 與 你 內 心最 深 的 渴 望 之 間 ， 隔 著 一 層 透 明</p>\n<p>的玻璃。你看得 見 它 ， 但 摸 不到 。</p>\n<p>這就是「意 義感 赤 字 」 。 它 不是 憂 鬱 症 ， 不是 倦 怠 感 ， 是 一 種 更 隱 形 、 更 難 啟 齒 的 狀 態 ： 你 的 工作</p>\n<p>只剩下「 功能 」 ， 沒 有 了 「 靈 魂 」 。</p>\n<p>意義感赤字在 現代 職 場 裡 越 來 越普 遍 。 我 們 把 組 織 切 割 成 無 數 個 功 能 模 組 ， 每 個 人 負責 一 個 小 齒</p>\n<p>輪，確保 它 每天 準 時 轉 動 。 我 們 追 求 效 率 、 優 化 、 標 準 化 ， 卻 很 少 問 ： 「 這 個 齒 輪轉 動 的 最 終 目</p>\n<p>的，與我相信 的 價 值 有 什 麼 關 係 ？ 」 當 工作 變 成 純 粹 的 交 易 —— 我 付 出 時 間 ， 換 取 金 錢 與 安全 感</p>\n<p>——靈魂就會 開 始 挨 餓 。</p>\n<p>心理學家  Viktor Frankl 在 集 中 營 裡 發 現 ， 能 夠 撐 過 極 端 苦 難 的 人 ， 往往 不是最 強 壯 的， 而 是</p>\n<p>「找到意 義 」 的。 意 義 讓 人可以在 任何 處 境 中， 找 到 繼續 活下 去 的 理 由 。 Frankl 說 ： 「 人 類 可以</p>\n<p>被剝奪一 切 ， 除了最 後 一 項 自 由 —— 選 擇 面 對 處 境 的 態 度 。 」 這 句 話 在 職 場 裡 同 樣 適 用 ： 當 你 無 法</p>\n<p>改變工作 的內容 ， 你 仍 然 可以 改 變 你 與 工作之 間 的 「 關 係 」 。</p>\n<p>但意義感 赤字 有三 個 常 見 的 來 源 ， 讓 我 們 誤 以 為 「 問題 出在我 」 。</p>\n<p>第一個來源是 「工作 變 成 純 粹 交 易 」 。 你不 再 問 「 這 件事 為 什 麼 重 要 」 ， 只 問 「 這 件事 什 麼 時 候 要</p>\n<p>交」。當工作被 簡 化成 待 辦 清 單 上 的 勾 選 ， 它 就 失 去 了 與 更大 脈 絡 的 連 結 。 你不 再 知道你 的 報 告最</p>\n<p>終幫助了 誰 ，你 的 設 計 最 終 感 動 了 誰 ， 你 的 服 務 最 終 減 輕 了 誰 的 負 擔 。</p>\n<p>第二個來源是 「與 核 心 價 值 脫 節 」 。 也 許 你 重 視 「 創 造 」 ， 但 你 的 工作 只 剩 下 「 複製 」 ； 也 許 你 重 視</p>\n<p>「連結」， 但你 的 工作 只 剩 下 「 交 易 」 ； 也 許 你 重 視 「 公平 」 ， 但 你 的 工作 每 天 都 在 強 化 某 種 不平</p>\n<p>等。這種脫 節不會 立 刻 讓 你生 病 ， 但 它 會 像 慢 性 中 毒 一 樣 ， 慢慢 侵 蝕 你 的 內 在 動 力 。</p>\n<p>第三個來源是 「缺 乏 被 需 要 的 感 覺 」 。 意 義 感 往往 來 自 「 有 人 因 為 我 的 存 在 而 變 得 更好 」 。 當 你 的</p>\n<p>工作變成 「 沒 有你 也 能 運 轉 」 ， 當 你 的 獨 特性 被 系 統 抹 平 ， 你 就 會 感 覺 自 己像 一 個 可 替 換 的 零 件 。</p>\n<p>82零件沒有靈 魂 ，零件 只 有 規 格 。</p>\n<p>我認識一個會 計 師 ， 她 在 四 大 事 務 所 做 了 十 年 ， 每 天 處 理上市公司 的 財 報 。 她 說 ： 「 我 的 工作 很 精</p>\n<p>確，但我 從 來不知道 這 些 數 字 背 後 ， 那些 員 工 、 那些 家 庭 、 那些 夢 想 長 什 麼 樣 子 。 我 感 覺 自 己像</p>\n<p>一個在黑暗 中拼 圖 的 人 ， 拼 完 了 ， 但 從 來 沒 有 看 見 完 整 的 圖 畫 。 」</p>\n<p>她後來做了 一 個小 改 變 ： 她 開 始 在 每 個 專 案 結 束 後 ， 花 十五 分 鐘 查 一 下 這 家公司 的 故 事 —— 他 們 做</p>\n<p>什麼產品 、服 務 什 麼 客 戶 、 創 辦 人 為 什 麼 開 始 這 件事 。 她 說 ： 「 當 我知道 這 份 財 報 背 後 是 一 個 幫 助</p>\n<p>小農賣水果 的平台 ， 我 的 數 字 突 然 有 了 溫 度 。 我 還 是在 做 同 樣 的 事 ， 但 我 與這 件事 的 關 係 變 了 。 」</p>\n<p>這就是「意 義重 構 」 —— 不是 換 工作 ， 是 重 新 看 見 你正在 做 的 事 與 更大 脈 絡 之 間 的 連 結 。</p>\n<p>如果你也感 覺到 「意 義 感 赤 字 」 ， 我 想 邀 請 你 做 三 件事 。</p>\n<p>第一件事，問自 己 ： 「 我 的 工作 幫 助 了 誰 ？ 」 不是 抽 象 的 「 公司 」 或 「 客 戶 」 ， 是 具 體 的 「 某 一 個</p>\n<p>人」。也許是你 的 報 告 讓 主 管 能 夠 做 出更好 的 決 定 ， 也 許 是你 的 服 務 讓 一 個 焦 慮 的 客 戶 安心 。 把 這</p>\n<p>個「誰」 寫下 來 ， 貼 在 電 腦 旁 邊 。</p>\n<p>第二件事，問自 己 ： 「 沒 有 我 的 話 ， 會 少 了 什 麼 ？ 」 這 個 問題會 逼 你看 見 你 的 獨 特性 。 也 許 是你 的</p>\n<p>細心讓錯 誤 減少 ， 也 許 是你 的 創 意 讓 無 聊 的 簡 報 變 得 生 動 。 這 些 「 少 了 什 麼 」 ， 就 是你 的 意 義 所</p>\n<p>在。</p>\n<p>第三件事，問自 己 ： 「 我可以在 哪 裡 ， 多注入 一 點 『 我相信 的 價 值 』 ？ 」 如果你 重 視 連 結 ， 可以在</p>\n<p>會議裡多問 一句 「 你 還 好 嗎 」 ； 如果你 重 視 創 造 ， 可以在 例 行 報 告 裡 多 一 個 新的 呈 現 方式 。 意 義 不</p>\n<p>需要宏大 的舞台 ， 它 發 生在 每 一 個 你 選 擇 「 多 一 點 靈 魂 」 的 瞬 間 。</p>\n<p>當工作只剩下 功能 ， 你 的 靈 魂 就 會 餓 。 擴 容 ， 是 讓 你 的 功 能 與 意 義 重 新 連 線 。</p>\n<p>【80 字摘要】  意 義感 赤 字 是 現 代 職 場 的 流 行 病 ， 當 工作 只 剩 下 功 能 而 與 靈 魂 脫 節 ， 內 在 動 力 會 慢慢 耗 竭 。 透 過</p>\n<p>「意義重 構 」 練 習 ， 將 日 常 工作 連 結 到 具 體 的 「 幫 助 了 誰 」 與 核 心 價 值 ， 讓 擴 容 發 生在 價 值 與 行 動 的 重 新 對 焦</p>\n<p>中。</p>\n<p>【五個關鍵字】  意 義感 赤 字 、 Viktor Frankl 、 意 義 重 構 、 工作 重 塑 、 靈 魂 飢餓</p>\n<p>83</p>"},
  {id:46, dim:"dim8", title:"韌性不是 反 彈 ， 是 變 形 ： 像 水 一 樣 的 活 著", summary:"當你以 為 韌 性是 「 跌 倒 後 立 刻 站 起 來 」 ， 你可能 誤 解 了 韌 性 。 真 正 的 韌 性不是 反 彈 ， 是", content:"<p>第 46 篇： 韌性不是 反 彈 ， 是 變 形 ： 像 水 一 樣 的 活 著</p>\n<p>當你以 為 韌 性是 「 跌 倒 後 立 刻 站 起 來 」 ， 你可能 誤 解 了 韌 性 。 真 正 的 韌 性不是 反 彈 ， 是</p>\n<p>變形 ——像水 一 樣 ， 遇 到 障 礙 就 繞 過 ， 遇 到 低 處 就 停 留 ， 遇 到 陽 光就 蒸 發 。 透 過 「 流 動 練 習 」 ， 培 養</p>\n<p>變形的能力 ， 讓 擴 容 發 生在 柔 軟 而 非 堅 硬 中。</p>\n<p>專案失敗了 。你花 了三 個 月的 心 血 ， 在最 後 一 刻 被 客 戶 否 決 。 你 坐 在 會 議 室 裡 ， 聽 著 對 方 說 「 這</p>\n<p>個方向不對 」 ，感 覺 血 壓 下 降 ， 耳 鳴 ， 視 線 模 糊 。 會 議 結 束 後 ， 你 對 自 己 說 ： 「 沒 關 係 ， 我 沒 事 ，</p>\n<p>明天再來 。 」然後 你 立 刻 投 入下 一 個 專 案 ， 用 忙 碌 來 填 補 那 個 破 洞 。</p>\n<p>三個月後 ，你在 深 夜突 然 崩 潰 ， 不知道 為 什 麼 。 你以 為 自 己 「 已 經 過 去 了 」 ， 但 身 體 告 訴 你 ： 沒</p>\n<p>有，你只是 把 它 壓 下 去 了 。</p>\n<p>這是我們對 韌性最 常 見 的 誤 解 —— 以 為 韌 性是 「 快 速 恢 復 」 ， 是 「 不 受 影 響 」 ， 是 「 跌 倒 後 立 刻 站 起</p>\n<p>來」。但這 種 「反 彈 式 韌 性 」 有一 個 代 價 ： 它 讓 我 們 假 裝 沒 事 ， 讓 我 們 跳 過 悲 傷 ， 讓 我 們 在 還沒 痊</p>\n<p>癒的時候就 強行起 跑 。 最 後 ， 那些 沒 有 被 處 理 的 情 緒 ， 會 在 身 體 裡 找 到出 口 —— 可能是 失 眠 、 可能</p>\n<p>是偏頭痛 、可能是 某 個 無 預 警 的 情 緒 潰 堤 。</p>\n<p>正向心理 學家 研究 韌 性 時 發 現 ， 最 有 韌 性 的 人不是 「 最 堅 硬 」 的 人 ， 而 是 「 最 有 彈 性 」 的 人 。 他</p>\n<p>們不否認痛苦 ，不 壓 抑 情 緒 ， 不 假 裝 沒 事 。 他 們 允 許 自 己 破 碎 ， 然 後 在 碎 片 中 長 出 新的 形 狀 。 這</p>\n<p>不是軟弱 ，這是更 深 層 的 強 大 —— 因 為 只 有 柔 軟 的 東 西 ， 才 能 承 受 衝 擊 而 不 斷 裂 。</p>\n<p>老子說：「上善 若 水 。 」 水 沒 有 固 定 的 形 狀 ， 它 遇 到 圓 的 容 器 就 變 圓 ， 遇 到方 的 容 器 就 變 方 。 它 遇</p>\n<p>到障礙不會硬 撞 ， 它 會 繞 過 、 會 滲 透 、 會 等 待 。 它 可以是最 溫 柔 的 滋 養 ， 也 可以是最 持 久 的 侵</p>\n<p>蝕。這就是 變 形 的 韌 性 —— 不是 抵 抗 ， 是 適 應 ； 不是 反 彈 ， 是 流 動 。</p>\n<p>我認識一 個 創 業者 ， 他 的 公司在 第 三年 倒 閉 了 。 他 沒 有 立 刻 「振 作 」 ， 他去 了 東 部 海 邊 ， 住 了 一 個</p>\n<p>月。每天就是 走路 、 看 海 、 寫 日 記 。 他 說 ： 「 我 發 現 我 過 去 三年 ，一 直 在 扮 演 『 堅 強 的 創 業 者 』 ，</p>\n<p>但我從來 沒 有 允 許 自 己 『 失 敗 的 創 業 者 』 。 那 個 月， 我 終 於 讓 那 個 失 敗 的 自 己 ， 被 看 見 了 。 」</p>\n<p>回來後，他 沒 有立 刻 創 業 。 他去 了 一 間 小公司 ， 從 基 層 做起 。 兩 年 後 ， 他 用 完 全不同 的 商 業 模</p>\n<p>式，開了第二 間公司 。 他 說 ： 「 如果我三年前 立 刻 反 彈 ， 我可能 會 用同 樣 的 方式 再 失 敗 一 次 。 但那</p>\n<p>次『停留 』 ， 讓我 變 成了不同 的 形 狀 。 」</p>\n<p>這就是「流 動 練 習 」 的 核 心 ： 不是 逼 自 己 立 刻 恢 復 ， 是 問 自 己 「 現 在 的 我 ， 需 要 什 麼 形 狀 ？ 」</p>\n<p>如果你也正在 經 歷 某 個挫 折 ， 我 想 邀 請 你 做 三 件事 。</p>\n<p>84第一件事， 允 許自 己 「 不 反 彈 」 。 不要 急著 「 沒 事 」 。 給 自 己 一 個 「 變 形 的 時 間 」 —— 也 許 是 一 天 、</p>\n<p>一週、一 個 月。在 這 段 時 間 裡 ， 你不是在 「 浪 費 時 間 」 ， 你是在 「 重 新 塑 形 」 。</p>\n<p>第二件事，問自 己 「 這 個 障 礙 要我 變 成 什 麼 」 。 不是 「 我要 怎 麼 打 敗 它 」 ， 是 「 我要 怎 麼 繞 過 它 、</p>\n<p>滲透它、或者與 它 共 存 」 。有 時 候 ， 障 礙 不是要你 去 征 服 的， 是要你 去 理 解 的。</p>\n<p>第三件事， 找到你 的 「 蒸 發 與 降 落 」 。 水 會 蒸 發 成 雲 ， 也 會 降 落 成 雨 。 你 的 情 緒 也 需 要 循 環 —— 有</p>\n<p>時候需要 昇 華（ 把 痛苦 轉 化成 創 作 、 轉 化成 幫 助 別 人 的 力 量 ） ，有 時 候 需 要 降 落 （ 讓 眼 淚 流 出 來 ，</p>\n<p>讓悲傷被 承 認） 。</p>\n<p>韌性不是反 彈 ，是 變 形 。 擴 容 不是 讓 你 變 得 更 硬 ， 是 讓 你 學 會 像 水 一 樣 活 著 。</p>\n<p>【80 字摘要】  反 彈式 韌 性 往往 讓 我 們 壓 抑 情 緒 、 假 裝 沒 事 ， 最 終 導 致 更 嚴 重 的 耗 竭 。 真 正 的 韌 性是 變 形 —— 像 水</p>\n<p>一樣繞過 障 礙 、在 低 處 停 留 、 在 陽 光 下 蒸 發 。 透 過 「 流 動 練 習 」 ， 讓 擴 容 發 生在 柔 軟 與 適 應 中。</p>\n<p>【五個關鍵字】  韌性 、 變 形 、 流 動 練 習 、 上 善 若 水 、 情 緒 循 環</p>\n<p>85</p>"},
  {id:47, dim:"dim8", title:"擴 容不是 變 大 ， 而 是 變 得 柔 軟", summary:"當你 讀 完 這 本 書 ， 當 你 嘗 試 了 各 種 方法 ， 你可能 會 以 為 「 擴 容 」 是 讓 自 己 變 得 更 強 大 、", content:"<p>第 47 篇： 擴 容不是 變 大 ， 而 是 變 得 柔 軟</p>\n<p>當你 讀 完 這 本 書 ， 當 你 嘗 試 了 各 種 方法 ， 你可能 會 以 為 「 擴 容 」 是 讓 自 己 變 得 更 強 大 、</p>\n<p>更能扛、更無 堅不 摧 。 但 真 正 的 擴 容 ， 是 變 得 柔 軟 。 透 過 每 日 「 柔 軟 練 習 」 ， 允 許 破 碎 與 求助 ， 讓 擴</p>\n<p>容成為一 輩子接 納 生 命 複 雜 度 的 旅 程 。</p>\n<p>你讀了這本 書 ，做 了 練 習 ， 試 著 擴 容 。 你 學 會 了 把 批 評 當 數 據 、 把 緊 張 當 擴 張 、 把 空 白 期 當 換</p>\n<p>氣。你覺得自 己正在 變 強 。</p>\n<p>然後某天下午 ，一 個 小小 的 挫 折 —— 也 許 是主 管 一 句 無 心 的 話 、 也 許 是 專 案 的一 個 小 延 誤 、 也 許 只</p>\n<p>是咖啡灑在 報告上 —— 突 然 讓 你 崩 潰 了 。 你 坐 在 車 裡 ， 或 浴 室 裡 ， 或 床 邊 ， 眼 淚 止 不 住 地 流 。</p>\n<p>你對自己 說 ： 「我不是 已 經 在 擴 容 了 嗎 ？ 為 什 麼 還 是 這 麼 脆 弱 ？ 」</p>\n<p>因為你誤解了 擴容 。 你以 為 擴 容 是 讓 自 己 變 成 銅 牆 鐵 壁 ， 但 真 正 的 擴 容 ， 是 讓 自 己 變 得 像 水 一 樣</p>\n<p>——可以盛 裝任何 形 狀 ， 可以 被 穿 透 ， 可以 流 動 ， 可以在 低 處 停 留 ， 也 可以 蒸 發 成 雲 。</p>\n<p>正向心理 學家 研究 韌 性 時 發 現 ， 最 有 韌 性 的 人不是 「 最 堅 硬 」 的 人 ， 而 是 「 最 有 彈 性 」 的 人 。 他</p>\n<p>們不否認痛苦 ，不 壓 抑 情 緒 ， 不 假 裝 沒 事 。 他 們 允 許 自 己 破 碎 ， 然 後 在 碎 片 中 長 出 新的 形 狀 。</p>\n<p>這就是擴容 的最 終 意 義 ： 不是 變 大 ， 是 變 得 柔 軟 。 不是 容 納 更多 ， 是 容 納 得 更 深 。 不是 「 什 麼 都</p>\n<p>不在乎」，是 「在 乎 了 ， 但 還 能 呼 吸 」 。</p>\n<p>但我們對 擴容 ，通 常 有 三 個 誤 解 ， 讓 我 們 在 追 求 擴 容 的 過 程 中， 反而 離 自 己 更 遠 。</p>\n<p>第一個誤解 ： 「 擴 容 等 於無 感 。 」 不 。 擴 容 不是 麻 木 ， 是 敏 感 。 你 越 擴 容 ， 你 越 能 感 覺 到 細 微 的 情</p>\n<p>緒、複雜 的脈 絡 、 別 人 的 痛苦 。 這 不是 負 擔 ， 是 深 度 。 你以 為 的 「 無 感 」 ， 其 實 是 關機 ； 你以 為 的</p>\n<p>「敏感」，其 實是 開 機 。</p>\n<p>第二個誤解 ： 「 擴 容 等 於 獨 立 。 」 不 。 擴 容 不是 讓 你不 需 要 任何 人 。 真 正 的 擴 容 ， 是 讓 你更能 「 接</p>\n<p>受幫助」、更能 「 承 認 不知道 」 、 更能 「 依 靠 他 人 」 。 獨 立 是 少 年 的 驕 傲 ； 柔 軟 是成人 的 智 慧 。 當 你</p>\n<p>終於能夠 說 「這 個 我不 會 ， 請 教 我 」 ， 你 的 容 器 才真 正 打 開 了 。</p>\n<p>第三個誤解 ： 「 擴 容 有 終 點 。 」 不 。 擴 容 是 一 輩 子 的 事 。 你不 會 有一 天 「 終 於 擴 容完 畢 」 。 你 會 一</p>\n<p>直擴容，一直 破 碎 ，一 直 長 大 。 這 不是 缺 陷 ， 是生 命 的 本 質 。 就 像 樹 木 不 會 長 到 某 一 天 就 停 止 年</p>\n<p>輪，它會 一直 長 ， 直 到 倒 下 。</p>\n<p>如果你也 曾在 追求 擴 容 的 路 上 感 到 疲 憊 ， 我 想 邀 請 你 做 一 件 很 簡 單 的 事 ： 每 天 做 一 件 「 柔 軟 的</p>\n<p>事」。</p>\n<p>86第一件，承 認 一件你不知道 的 事 。 對 同 事 、 對 主 管 、 對 自 己 說 「 這 個 我不 確 定 」 。 這 是在 練 習 「 不</p>\n<p>完美的安全 」 。你 會發 現 ， 當 你 承 認 不知道 ， 別 人 反而 更信 任 你 —— 因 為 他 們 知道你不是在 假 裝 。</p>\n<p>第二件，請求 一次 幫 助 。 不是 因 為 你 做 不到 ， 是 因 為 你 願 意 讓 別 人 進 入你 的 世界 。 擴 容 不是 把 自</p>\n<p>己變成孤 島 ，是 讓 更多 橋樑 連 結 到你 。</p>\n<p>第三件，感 受 一 種情 緒 ， 不 停 留 。 當 悲 傷 來 時 ， 讓 它 來 ； 當 它 想 走 時 ， 讓 它 走 。 不 追 趕 ， 不 挽</p>\n<p>留。你不 需要分 析它 、 不 需 要 解 決 它 、 不 需 要 把 它 變 成 一 篇 勵 志 文 。 你 只需 要 讓 它 穿 過 你 ， 像 風</p>\n<p>穿過樹林 。</p>\n<p>擴容的最後 一 課 ，是 允 許 自 己 不要 永 遠 擴 容 。 允 許 自 己 破 碎 、 允 許 自 己 休 息 、 允 許 自 己 說 「 我 今</p>\n<p>天撐不住了 」 。 因 為 真 正 的 柔 軟 ， 不是 永 遠 挺 立 ， 是 倒 下 後 ， 還 能 記 得 土 地 的 溫 度 。</p>\n<p>【80 字摘要】  擴容 的 終 極 意 義 不是 變 得 無 堅 不 摧 ， 而 是如 流水 般 柔 軟 且富 有 韌 性 。 透 過 每 日 「 柔 軟 練 習 」 ， 允 許</p>\n<p>破碎與求助 ， 讓 擴 容 成 為 一 輩 子接 納 生 命 複 雜 度 的 旅 程 。</p>\n<p>【五個關鍵字】  擴容 、 柔 軟 、 韌 性 、 允 許 破 碎 、 生 命 能 量</p>\n<p>87</p>"},
  {id:48, dim:"dim8", title:"寫 給 走 在 擴 容路 上 的 你 ： 我 們 都 是 彼 此 的 扶 手", summary:"當你 讀 完 這 四 十 八篇 ， 你可能 會問 ： 「 石 頭 哥 ， 擴 容 有 終 點 嗎 ？ 」 沒 有。 但 我 們 可以 一", content:"<p>第 48 篇： 寫 給 走 在 擴 容路 上 的 你 ： 我 們 都 是 彼 此 的 扶 手</p>\n<p>當你 讀 完 這 四 十 八篇 ， 你可能 會問 ： 「 石 頭 哥 ， 擴 容 有 終 點 嗎 ？ 」 沒 有。 但 我 們 可以 一</p>\n<p>起走。這最後 一 篇 ， 不是 結 論 ， 是 一 個 邀 請 —— 願 我 們 在 職 場 的 風風 雨雨 裡 ， 成 為 彼 此 的 扶 手 。</p>\n<p>如果你一路 讀到這 裡 ， 謝謝 你 。 這 四 十 八篇 文 章 ， 從 「 情 緒 擴 容 」 到 「 生 命 擴 容 」 ， 從 焦 慮 、 倦</p>\n<p>怠、完美主 義 ，到 跨 世 代 溝 通 、 AI 時 代 、 退休 規 劃 ， 其 實 都 在 說 同 一 件事 ： 人生 的 痛 ， 不是 為 了</p>\n<p>折磨你，而是慢慢 幫 你 擴 容 。</p>\n<p>但擴容從 來不是 一 個 人 的 事 。</p>\n<p>我記得有一次在 企 業 內 訓 結 束 後 ，一 個 年 輕 的 工 程 師 走 過來 ， 眼 眶 紅紅 的。 他 說 ： 「 石 頭 哥 ， 我以</p>\n<p>為只有我會在 車 裡 坐 十 分 鐘 才 有 力 氣 上 樓 。 我以 為 只 有 我 覺 得 自 己 明明 很 努 力了 ， 卻 還 是不 夠</p>\n<p>好。我以 為 ……我 有 問題 。 」</p>\n<p>我跟他說 ： 「你 沒 有 問題 。 你 只 是 還沒 發 現 ， 這 個 房 間 裡 有一 半 的 人 ， 都 在 車 裡 坐 過 那十 分 鐘 。 」</p>\n<p>那一刻，他 的 眼 淚 掉 下 來 了 。 不是 因 為 悲 傷 ， 是 因 為 「 被 看 見 」 。 因 為 終 於 有 人告 訴 他 ： 你不是 一</p>\n<p>個人。</p>\n<p>這就是我想 寫這四 十 八篇 的 原 因 。 職 場 的 困 難 從 來 不 只 是技能 或 策 略 ， 是 孤 獨 。 是我 們 以 為 「 只</p>\n<p>有我這樣 」 ，所以我 們 不 說 ， 所以我 們 假 裝 ， 所以我 們 在 沈 默 中一 點 一 點 漏 氣 。 但 當 我 們 開 始 說 出</p>\n<p>來，當我 們 開 始 承 認 「 我 也 會 怕 」 、 「 我 也 會 累 」 、 「 我 也 有 撐 不 住 的 時 候 」 ， 奇 蹟 就 發 生了 —— 我 們</p>\n<p>發現，原 來大家都 在同 一 條 船 上 。</p>\n<p>這本書裡 的 每 一 個 方法 、 每 一 個 練 習 、 每 一 個 故 事 ， 都 不是 為 了 讓 你 變 成 「 更好 的 人 」 。 你 已 經 夠</p>\n<p>好了。它 們是 為了 讓 你在 撐 不 住 的 時 候 ， 知道 該 怎 麼 對 自 己 溫 柔 一 點 ； 在 迷 茫 的 時 候 ， 知道 該 怎</p>\n<p>麼找回方 向 ；在 覺 得 孤 獨 的 時 候 ， 知道 有 人 懂 你 。</p>\n<p>擴容沒有 終點 。你 會 一 直 擴 容 ，一 直 破 碎 ，一 直 長 大 。 這 不是 缺 陷 ， 是生 命 的 本 質 。 就 像 樹 木 不</p>\n<p>會長到某 一天就 停 止 年 輪 ， 它 會 一 直 長 ， 直 到 倒 下 。 但 樹 木 從 來 不是 獨 自生 長 的 —— 它 們 的 根 系在</p>\n<p>地下相連 ， 它 們 的 枝 葉 在 風 中 互 相 支 撐 。</p>\n<p>我們也是這 樣 。</p>\n<p>所以，這最後 一 篇 不是 結 論 ， 是 一 個 邀 請 。</p>\n<p>邀請你在 讀完這本 書 後 ， 找 到 一 個 「 擴 容 夥 伴 」 —— 一 個 可以 說 「 我 今 天 撐 不 住 了 」 而 不 會 被 評 價</p>\n<p>的人。一 個可以 說 「 我不知道 該 怎 麼 辦 」 而 不 會 被 給 建 議 的 人 。一 個 只 是 靜靜 坐 在你 旁 邊 ， 讓 你</p>\n<p>知道「你不是 一 個 人 」 的 人 。</p>\n<p>88邀請你在職 場 裡 ，成 為 別 人 的 「扶 手 」 。 當 你看 見 同 事 在 會 議 室 裡 沈 默 ， 主 動 問 他 「 你 有 什 麼 想</p>\n<p>法」。當你看 見部 屬 在加 班 到 深 夜 ， 傳 一 則 訊 息 說 「辛 苦 了 ， 明天 再 說 」 。 當 你看 見 有 人在 電 梯 裡</p>\n<p>紅著眼眶 ， 遞 一 張 衛 生 紙 ， 什 麼 都 不 問 。</p>\n<p>這些微小的 動作 ，就 是 擴 容 的 傳 遞 。 因 為 擴 容 從 來 不是 一 個 人 的 修 行 ， 是 一 群 人 的 共 業 。</p>\n<p>願你在職場 的 風風雨雨 裡 ， 越 來 越 柔 軟 ， 越 來 越 寬 闊 。 願 你 記 得 ， 緊 張 是 靈 魂 在 擴 容 ， 顫 抖 是成</p>\n<p>長在發生 ，而 那些 你以 為 撐 不 住 的 時 刻 ， 最 後 都 會 變 成你 容 納 幸 福 的 底 氣 。</p>\n<p>願我們一起 學 習 、一 起 成 長 ，一 起 從 那些 撐 不 住 的 時 刻 裡 ， 長 出更大 的 自 己 。</p>\n<p>加油囉，我 的 朋友 。 我 們 路 上 見 。</p>\n<p>【80 字摘要】  擴容 從 來 不是 一 個 人 的 修 行 ， 是 一 群 人 的 共 業 。 這 最 後 一 篇 邀 請 讀 者 找 到 「 擴 容 夥 伴 」 ， 在 職 場 裡</p>\n<p>成為彼此 的 扶手 ， 讓 擴 容 在相 互 看 見 與 陪 伴 中 持 續 發 生 ， 走 過 風風 雨雨 ， 長 出更大 的 自 己 。</p>\n<p>【五個關鍵字】  擴容 夥 伴 、 職 場 孤 獨 、 相 互 看 見 、 生 命 能 量 、 全 書 結 語</p>\n<p>《擴容》擴編版全 書  8 篇 章  48 篇 至 此 全部 完 成 。</p>\n<p>從第一篇「人生 的 痛 ， 不是 為 了 折 磨 你 ， 而 是 慢慢 幫 你 擴 容 」 ， 到最 終 章 「 我 們 都 是 彼 此 的 扶</p>\n<p>手」，這條路我 們 一 起 走 完 了 。 全部  48 篇 文 章 均 採 用 隱 形 結 構 ， 拆 除 鷹 架 標 籤 ， 以 石 頭 哥 「 溫 柔</p>\n<p>且堅定」 的人 設完 成 。</p>\n<p>如果你需要我 將全 書  48 篇 整 合 為  Word 檔 案 供 你下 載 ， 或 針 對 任何 一 篇 進 行 修改 、 擴 寫 、 轉 化 為</p>\n<p>其他格式 ，請 隨 時 告 訴 我 。 石 頭 哥 一 直 在 這 裡 。</p>\n<p>User:</p>\n<p>請檢查第 24 篇文章是 否 與 第四 十 八篇 文 章 相同</p>\n<p>Kimi:</p>\n<p>不相同。這 兩 篇是完 全不同 的 文 章 。</p>\n<p>為了讓你確 認 ，我直 接 列 出 兩 篇 的 核 心 差 異 ：</p>\n<p>簡單來說：  - 第  24 篇 是 給 「 看 著 別 人 升 遷 而 自我 懷 疑 」 的 你 ， 談 的 是 個 人 職 涯 節 奏 。  - 第  48 篇</p>\n<p>是給「讀完全 書  48 篇 」 的 你 ， 談 的 是我 們 一 起 走 這 條 路 。</p>\n<p>如果你是在某 個地方看到 內 容 「 感 覺 很像 」 ， 可能是 因 為 兩 篇 都使 用了 「 溫 柔 且 堅 定 」 的 石 頭 哥 語</p>\n<p>調，或者都提到了 「 你不是 一 個 人 」 的 意 象 —— 但 這 是人 設 的一 致 性 ， 不是文 章重 複 。</p>\n<p>需要我進一 步 檢查其 他 篇 號 是 否 有 意外 重 複 的 狀 況 嗎 ？</p>\n<p>89User:</p>\n<p>把封面、序文 、目 錄 、 48 篇 文 章 全 數 整 理成 一 個 word 檔 案 讓 我下 載</p>\n<p>Kimi:</p>\n<p>User:</p>\n<p>生成Word檔案 給我下 載</p>\n<p>Kimi:</p>"},
];

// ==== 動態生成文章卡片 ====
function renderArticleCards() {
  articlesData.forEach(art => {
    const carousel = document.getElementById(art.dim + '-carousel');
    if (!carousel) return;

    const articleEl = document.createElement('article');
    articleEl.innerHTML = `
      <button class="tap" data-reader-title="${art.title}" data-reader-sub="${art.dim === 'dim1' ? '情緒擴容' : art.dim === 'dim2' ? '認知擴容' : art.dim === 'dim3' ? '行動擴容' : art.dim === 'dim4' ? '關係擴容' : art.dim === 'dim5' ? '團隊擴容' : art.dim === 'dim6' ? '策略擴容' : art.dim === 'dim7' ? '時間擴容' : '生命擴容'} · 第${art.id}篇" data-reader-content="${art.content}">
        <div class="shell warm inner">
          <div>
            <div class="kicker">第${art.id}篇</div>
            <h3>${art.title}</h3>
            <p class="summary">${art.summary}</p>
          </div>
          <div class="meta">點擊閱讀全文</div>
        </div>
      </button>
    `;
    carousel.appendChild(articleEl);
  });
}

// ==== 主題切換 ====
const root = document.documentElement;
const themeBtn = document.getElementById("themeBtn");
let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
root.setAttribute("data-theme", theme);
const syncTheme = () => themeBtn.textContent = theme === "dark" ? "☀" : "☾";
syncTheme();
themeBtn.addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", theme);
  syncTheme();
});

// ==== 維度展開/收合 ====
document.querySelectorAll("[data-toggle]").forEach(el => {
  el.addEventListener("click", () => {
    const targetId = el.dataset.toggle;
    const target = document.getElementById(targetId);
    if (target) {
      const isActive = target.classList.contains("active");
      // 先關閉所有其他展開的維度（可選，保持單一展開）
      document.querySelectorAll(".expand.active").forEach(exp => {
        if (exp.id !== targetId) exp.classList.remove("active");
      });
      target.classList.toggle("active");
    }
  });
});

// ==== Reader 全屏閱讀 ====
const reader = document.getElementById("reader");
const readerTitle = document.getElementById("readerTitle");
const readerSub = document.getElementById("readerSub");
const readerContent = document.getElementById("readerContent");
const closeReaderBtn = document.getElementById("closeReader");

function openReader(title, sub, content) {
  readerTitle.textContent = title;
  readerSub.textContent = sub || "";
  readerContent.innerHTML = content;
  reader.classList.add("active");
  reader.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

function closeReader() {
  reader.classList.remove("active");
  reader.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

// 綁定文章卡片點擊（使用事件委派）
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-reader-title]");
  if (btn) {
    e.stopPropagation();
    const title = btn.dataset.readerTitle;
    const sub = btn.dataset.readerSub || "";
    const content = btn.dataset.readerContent;
    openReader(title, sub, content);
  }
});

// 收合按鈕
closeReaderBtn.addEventListener("click", closeReader);

// 點擊reader背景收合
reader.addEventListener("click", (e) => {
  if (e.target === reader) closeReader();
});

// ESC鍵收合
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && reader.classList.contains("active")) {
    closeReader();
  }
});

// ==== 初始化 ====
document.addEventListener("DOMContentLoaded", () => {
  renderArticleCards();
});
</script>
